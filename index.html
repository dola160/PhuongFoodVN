/345e658a2eceb9fdcf3d645c344b2466.jpg","name_vi":"Lẩu Thái","name":{"en":"Thai-style Hot Pot","zh":"泰式火锅(冬阴功锅)","ja":"タイ風鍋(トムヤム風)","ko":"태국식 전골 (똠얌풍)"},"rating":4.5,"price":120000,"origin":"Việt Nam","spices":[{"vi":"Sa tế","price":3000},{"vi":"Nước mắm","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Rau muống","price":5000},{"vi":"Nấm kim châm","price":5000},{"vi":"Đậu hũ","price":3000},{"vi":"Bún tươi","price":5000}],"short":{"en":"A hot, sour and fragrant broth in the tom-yum tradition, simmered with seafood, mushrooms and lemongrass.","zh":"辛酸开胃的冬阴功风味汤底，与海鲜、菌菇及香茅同煮。","ja":"トムヤム風の辛酸っぱい香り高いスープに、海鮮やきのこ、レモングラスを合わせた鍋。","ko":"똠얌 스타일의 맵고 신 향긋한 육수에 해산물, 버섯, 레몬그라스를 넣어 끓인 전골."},"desc_vi":"Lẩu Thái là gì?\n**Lẩu Thái** (tiếng Thái: *Tom Yum*) là món lẩu nổi tiếng bậc nhất thế giới có nguồn gốc từ Thái Lan và là món \"lẩu quốc dân\" cực kỳ được yêu thích tại Việt Nam. Điểm đặc trưng nhất của món ăn này là phần nước dùng bùng nổ hương vị với sự kết hợp hài hòa giữa **4 vị chính: chua - cay - mặn - ngọt** cùng hương thơm thảo mộc khó cưỡng.\n## 1. Thành phần chính\nMột nồi Lẩu Thái chuẩn vị và thu hút thường bao gồm:\n * **Nước dùng (Linh hồn món ăn):**\n   * Ninh từ nước dùng xương (gà hoặc heo) hòa quyện cùng các loại gia vị thảo mộc tươi: **sả đập dập, lá chanh Kaffir (lá chanh Thái), củ riềng, ớt hiểm** và cà chua.\n   * Vị chua đặc trưng đến từ nước cốt tắc (quất) hoặc me, vị béo thơm có thể thêm một chút **nước cốt dừa** hoặc **sữa bay hơi (Evaporated milk)** cùng sốt sa tế Tom Yum để tạo màu đỏ cam bắt mắt.\n * **Đồ nhúng đa dạng:**\n   * **Hải sản:** Tôm tươi, mực, bạch tuộc, ngao (nghêu), phi lê cá.\n   * **Thịt:** Thịt bò thái mỏng (ba chỉ bò, bắp bò), viên thả lẩu (chả cá, bò viên, phô mai viên).\n * **Rau & Nấm ăn kèm:** Rau muống, cải cúc, bắp non, hoa chuối, cùng vô số loại nấm như nấm kim针 (nấm kim chi), nấm rơm, nấm đùi gà, nấm hải sản...\n * **Mì / Bún:** Ăn kèm phổ biến nhất là mì gói (mì tôm), bún tươi hoặc mì bún gạo Thái.\n## 2. Các biến tấu Lẩu Thái phổ biến\n| Loại Lẩu Thái | Đặc điểm đặc trưng |\n|---|---|\n| **Tom Yum Goong (Lẩu Thái Tôm Mơ)** | Phiên bản truyền thống nổi tiếng nhất của Thái Lan, tập trung vào vị ngọt tươi của **tôm sông/tôm sú** kết hợp nước dùng chua cay nồng nàn. |\n| **Lẩu Thái Cốt Dừa (Tom Kha / Tom Yum Nam Khon)** | Nước dùng có thêm **nước cốt dừa/sữa**, tạo màu nước sóng sánh, vị chua cay được dịu lại bởi độ béo ngậy, bùi bùi rất dễ ăn. |\n| **Lẩu Thái Hải Sản Thập Cẩm** | Phiên bản cực kỳ phổ biến tại Việt Nam, kết hợp đa dạng giữa hải sản, thịt bò và vô số viên thả lẩu. |\n## 3. Cảm nhận hương vị\nĐiểm đặc biệt khiến Lẩu Thái \"gây nghiện\" chính là sự bùng nổ giác quan ngay từ muỗng nước dùng đầu tiên: vị **chua thanh** kích thích vị giác, vị **cay xè** ấm áp từ ớt và sa tế, vị **ngọt đậm** từ xương và hải sản tươi, hòa quyện cùng **mùi thơm nức** đặc trưng của sả, riềng và lá chanh Thái.\nĐây là món ăn vô cùng thích hợp cho những buổi tiệc sum họp, xum vầy gia đình hoặc tụ tập bạn bè vào những ngày mưa hay thời tiết se lạnh."},{"id":45,"cat":"mains","image":"https://i.ibb.co/2Yd8jJL9/9619acde324ccddd0e06d242520e94ca.jpg","name_vi":"Bò kho","name":{"en":"Vietnamese Beef Stew","zh":"越式炖牛肉(牛肉煲)","ja":"ボーコー(ベトナム風牛肉煮込み)","ko":"보코 (베트남식 소고기 스튜)"},"rating":4.5,"price":60000,"origin":"Việt Nam","spices":[{"vi":"Muối","price":1000},{"vi":"Tiêu","price":2000},{"vi":"Nước mắm","price":2000},{"vi":"Ớt tươi","price":1000}],"sides":[{"vi":"Bánh mì","price":5000},{"vi":"Rau quế","price":3000},{"vi":"Ngò gai","price":2000},{"vi":"Hành lá","price":2000}],"short":{"en":"A fragrant beef stew simmered with lemongrass, star anise and carrot until fork-tender, often eaten with bread.","zh":"香茅八角慢炖牛肉至软烂入味，配胡萝卜，常配面包食用。","ja":"レモングラスと八角、にんじんでとろとろに煮込んだ牛肉のスープ。パンと一緒に食べることも。","ko":"레몬그라스와 팔각, 당근을 넣어 부드럽게 조린 소고기 스튜. 빵과 함께 즐기기도 한다."},"desc_vi":"Bò kho là gì?\n**Bò kho** là một món ăn truyền thống vô cùng quen thuộc và đậm đà trong ẩm thực Việt Nam, đặc biệt cực kỳ phổ biến tại miền Nam. Đây là món ăn kết hợp giữa thịt bò và các loại củ, được hầm (kho) mềm trong phần nước sốt sóng sánh, đậm vị và thơm lừng hương thảo mộc.\nKhác với các món kho thông thường dùng để ăn với cơm daily, bò kho mang phong cách lai giữa món kho và món súp/canh, thường được dùng cho bữa sáng, bữa trưa hoặc làm món chính trong các buổi tiệc gia đình.\n## 1. Thành phần chính & Gia vị đặc trưng\n * **Thịt bò:** Chọn các phần thịt có lẫn gân, mỡ để khi hầm không bị khô mà đạt độ dẻo mềm, sần sật béo ngậy như **nạm bò, gầu bò, bắp bò, sườn bò hoặc gân bò**.\n * **Rau củ:** **Cà rốt** là thành phần bắt buộc (giúp nước dùng ngọt thanh và có màu sắc đẹp). Ngoài ra nhiều nơi còn cho thêm củ cải trắng hoặc khoai tây.\n * **Gia vị & Thảo mộc (Linh hồn món ăn):**\n   * Thịt bò được tẩm ướp công phu với **hoa hồi (đại hồi), quế, thảo quả, đinh hương, hạt điều màu, dầu màu điều, sốt cà chua, sả đập dập, tỏi, hành tím và ớt**.\n   * Sự kết hợp của các loại thảo mộc giúp khử hoàn toàn mùi hoi của bò, tạo nên hương thơm đặc trưng \"không lẫn vào đâu được\" và màu đỏ cam sánh mượt.\n## 2. Các cách thưởng thức Bò kho \"chuẩn bài\"\nBò kho là món ăn vô cùng linh hoạt, tùy theo sở thích mà bạn có thể ăn kèm với:\n| Cách ăn | Trải nghiệm hương vị |\n|---|---|\n| **Bò kho ăn kèm Bánh mì** | Cách ăn phổ biến nhất. Bánh mì vỏ giòn rụm xé nhỏ, chấm ngập vào phần nước sốt bò kho sánh mịn, đậm đà, béo ngậy. |\n| **Hủ tiếu bò kho / Mì bò kho** | Thịt bò mềm cùng nước sốt bò kho nóng hổi chan lên tô hủ tiếu dẻo hoặc sợi mì trứng/mì gói, rắc thêm chút hành tây thái mỏng và ngò gai. |\n| **Bò kho ăn cùng Cơm nóng** | Phần nước sốt đậm đà rưới lên bát cơm trắng dẻo thơm, ăn kèm thịt bò hầm mềm béo là món ăn tối cực kỳ \"tốn cơm\". |\n## 3. Cảm nhận hương vị\nMột tô bò kho chuẩn vị khi dọn ra sẽ nghi ngút khói, dậy mùi thơm nức của hoa hồi, quế và sả. Từng miếng thịt bò hầm chín tới **mềm dẻo, gân bò giòn sần sật nhưng không bị bở**, cà rốt ngọt mọng, phần nước dùng sánh quánh, có vị mặn ngọt đậm đà và cay nhẹ.\nKhi ăn, người ta thường rắc thêm ít **húng quế, ngò gai (mùi tàu), hành tây thái mỏng** và vắt thêm chút **tắc (quất) hoặc chanh**, chấm thịt bò vào chén **muối ớt hạt/muối tiêu chanh** để bùng nổ trọn vẹn hương vị."},{"id":46,"cat":"mains","image":"https://i.ibb.co/wNz8GNrG/e7069291a74fa855ce0c2f7ced892612.jpg","name_vi":"Bò lá lốt","name":{"en":"Beef Wrapped in Betel Leaf","zh":"越式牛肉卷(荜拨叶烤牛肉)","ja":"ボーラーロット(葉包み牛肉焼き)","ko":"보라롯 (베텔잎 소고기말이)"},"rating":4.5,"price":80000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Tương ớt","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Rau sống","price":5000},{"vi":"Bánh tráng","price":5000},{"vi":"Bún tươi","price":5000},{"vi":"Đồ chua","price":5000}],"short":{"en":"Seasoned minced beef rolled in fragrant betel leaf and grilled until charred and aromatic.","zh":"调味牛肉末以香叶包裹烤至焦香四溢。","ja":"下味をつけた牛ひき肉を香り豊かな葉で巻いて焼き上げた一品。","ko":"양념한 다진 소고기를 향긋한 잎에 싸서 구워낸 요리."},"desc_vi":"Bò lá lốt là gì?\n**Bò lá lốt** (hay đầy đủ là *Bò cuốn lá lốt*) là một món ăn đường phố đặc sản vô cùng nổi tiếng và quen thuộc trong ẩm thực miền Nam Việt Nam. Món ăn này thu hút bởi những cuộn thịt bò cuốn trong lá lốt được nướng xém cạnh trên bếp than hồng, tỏa ra **mùi thơm nồng nàn đặc trưng** làm nức lòng bất kỳ ai đi ngang qua.\n## 1. Thành phần chính & Cách chế biến\n * **Thịt bò băm:** Thịt bò tươi được băm hoặc xay nhuyễn, trộn cùng một ít mỡ heo thái hạt lựu (để khi nướng thịt không bị khô mà đạt độ béo ngậy, mọng nước).\n * **Gia vị tẩm ướp:** Thịt được ướp công phu với **sả băm, hành tím, tỏi, tiêu, nước mắm, một chút ngũ vị hương** và không thể thiếu một ít lá lốt thái nhỏ trộn thẳng vào nhân để tăng hương vị.\n * **Lá lốt (Linh hồn món ăn):** Chọn những lá lốt tươi, bản to, xanh đậm, rửa sạch và lau khô.\n * **Quy trình làm:**\n   1. Cho một lượng nhân thịt bò vừa đủ vào mặt sau của lá lốt, cuộn tròn chặt tay lại rồi dùng cuống lá hoặc xiên tre cố định.\n   2. Xếp các cuộn bò lên vỉ nướng trên **bếp than hồng**.\n   3. Trong quá trình nướng, lớp tinh dầu trong lá lốt tiết ra quyện vào thịt bò, tỏa ra mùi thơm phức. Người ta thường phết thêm một lớp mỡ hành để cuộn bò bóng mượt và không bị cháy khô.\n## 2. Dụng cụ & Hương vị ăn kèm\nBò lá lốt hiếm khi ăn riêng lẻ mà luôn đi kèm với một \"mâm\" nguyên liệu phụ trợ phong phú:\n * **Mỡ hành & Đậu phụng:** Bò lá lốt nướng xong được xếp ra đĩa, rưới ngập **mỡ hành xanh mướt** và rắc **đậu phụng (lạc) rang giã dập** lên trên.\n * **Nước chấm (Mắm nêm):** Bò lá lốt \"chuẩn bài\" nhất định phải chấm cùng **mắm nêm** pha đậm đà với dứa (thơm) giã mịn, đường, tỏi, ớt và chút nước cốt tắc để tạo vị chua ngọt cay dịu. (Một số nơi cũng phục vụ thêm nước mắm chua ngọt).\n * **Rau sống & Bánh hỏi/Bánh tráng:** Ăn kèm xà lách, rau thơm (tía tô, húng quế, diếp cá), dưa leo, khế chua, chuối chát, dưa góp và bánh hỏi mềm mượt hoặc bánh tráng dẻo.\n## 3. Cách thưởng thức\nNgười ta thưởng thức bò lá lốt bằng cách cuốn:\n 1. Trải tấm bánh tráng dẻo (hoặc lá xà lách) ra bàn tay.\n 2. Cho vào một ít bánh hỏi, thêm rau thơm, dưa leo, khế chua, chuối chát.\n 3. Đặt **cuộn bò lá lốt nóng hổi** (đã ngập mỡ hành, đậu phụng) vào giữa.\n 4. Cuộn chặt tay rồi **chấm ngập vào chén mắm nêm** thơm nức.\nSự kết hợp giữa vị ngọt mọng của thịt bò, vị béo ngậy của mỡ hành đậu phụng, mùi thơm nồng nàn độc đáo của lá lốt nướng quyện cùng vị chua-chát-tươi mát của rau rừng và đậm đà của mắm nêm tạo nên một trải nghiệm ẩm thực vô cùng cuốn hút!"},{"id":47,"cat":"mains","image":"https://i.ibb.co/5gXgmnfP/a21f24b57a26b5d98a05eac0e4e705fd.jpg","name_vi":"Thịt kho tàu","name":{"en":"Braised Pork & Eggs","zh":"越式红烧肉炖蛋(东坡肉风味)","ja":"ティットコートー(豚肉と卵の煮込み)","ko":"팃코또 (돼지고기 달걀조림)"},"rating":4.4,"price":78000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Đường","price":1000}],"sides":[{"vi":"Cơm trắng","price":5000},{"vi":"Dưa giá","price":5000},{"vi":"Rau luộc","price":5000},{"vi":"Dưa leo","price":3000}],"short":{"en":"Pork belly and whole eggs slow-braised in coconut water and caramel sauce, a Tet holiday staple.","zh":"五花肉与全蛋以椰子水与焦糖汁慢炖，是越南春节必备菜肴。","ja":"豚バラ肉とゆで卵をココナッツウォーターとキャラメルソースでじっくり煮込んだ、テトの定番料理。","ko":"삼겹살과 삶은 달걀을 코코넛워터와 캐러멜소스로 오래 조린, 설날 필수 요리."},"desc_vi":"Thịt kho tàu là gì?\n**Thịt kho tàu** (hay còn gọi là *Thịt kho rệu*, *Thịt kho hột vịt*) là món ăn truyền thống, quen thuộc và mang tính biểu tượng trong mâm cơm gia đình người Việt, đặc biệt là ở miền Nam. Đây cũng là món ăn không thể thiếu trên cỗ cúng và mâm cơm Tết cổ truyền của người dân Nam Bộ.\nMón ăn này nổi bật với những khối thịt ba chỉ mềm rục, béo ngậy cùng trứng kho thấm vị, kho sóng sánh trong nước dừa tươi màu cánh gián đẹp mắt.\n## 1. Tên gọi \"Thịt kho tàu\" có phải của người Trung Quốc?\nDù có chữ \"tàu\", nhưng theo dân gian và các nhà nghiên cứu văn hóa ẩm thực Nam Bộ, chữ **\"tàu\"** ở đây không phải để chỉ người Trung Quốc hay ẩm thực Trung Hoa.\nTrong tiếng miền Tây Nam Bộ xưa, từ **\"tàu\"** có nghĩa là **\"lợt\"** (lạt/nhẹ). \"Thịt kho tàu\" hiểu đúng nghĩa là món thịt kho nước dừa có **vị mặn ngọt nhẹ nhàng, lạt lạt**, không quá mặn gắt như các món kho quẹt hay kho khô miền Bắc. Ngoài ra, các ngư dân đi ghe tàu đường dài ngày xưa cũng thường kho một nồi thịt to để ăn dần trong nhiều ngày trên sông nước.\n## 2. Thành phần chính\nMột nồi thịt kho tàu đúng chuẩn gồm có:\n * **Thịt heo (Thịt lợn):** Phải chọn **thịt ba chỉ (ba rọi)** hoặc thịt đùi có cả da, mỡ và thịt cân bằng. Thịt được cắt thành những khối **vuông to** (khoảng 4–5 cm).\n * **Trứng (Hột vịt / Hột gà / Trứng cút):** Trứng được luộc chín, bóc vỏ. Người Nam Bộ truyền thống thích dùng **hột vịt** to để kho cùng thịt.\n * **Nước dừa tươi:** Đây là bí quyết quan trọng nhất. Dùng nước dừa tươi để kho giúp thịt nhanh mềm rục, tạo độ ngọt thanh tự nhiên và lên màu cánh gián vàng óng mà không cần dùng quá nhiều phẩm màu hay nước màu.\n * **Gia vị:** Nước mắm ngon, đường, tỏi, hành tím, ớt tươi và tiêu.\n## 3. Bí quyết & Hương vị đặc trưng\n * **Mềm rục nhưng không nát:** Thịt kho tàu đạt chuẩn khi phần mỡ trong veo, phần thịt mềm dẻo như tan trong miệng (nên mới có tên gọi là *thịt kho rệu*), nhưng khối thịt vẫn giữ nguyên hình dáng đẹp mắt.\n * **Màu sắc bắt mắt:** Nhờ quá trình kho lâu cùng nước dừa tươi và nước mắm, phần nước kho sánh lại có màu nâu cánh gián bóng mượt, ngấm sâu vào từng quả trứng và miếng thịt.\n * **Hương vị hài hòa:** Vị béo ngậy của mỡ heo, ngọt thanh của nước dừa, mặn mòi của nước mắm và vị bùi bùi của lòng đỏ trứng vịt.\n## 4. Cách thưởng thức\nThịt kho tàu ngon nhất khi ăn cùng **cơm trắng nóng hổi**. Để cân bằng độ béo ngậy của thịt mỡ, người ta thường ăn kèm với:\n * **Dưa giá / Giá hẹ ngâm chua** (chuẩn vị Tết miền Nam).\n * **Dưa cải muối chua** hoặc dưa leo thái mỏng.\n * Rưới phần nước kho đậm đà thơm phức lên bát cơm nóng rồi trộn đều."},{"id":48,"cat":"veggie","image":"https://i.ibb.co/C5XhFYCQ/807d23f093630dc532d6a9e8c4ed04ae.jpg","name_vi":"Canh chua","name":{"en":"Sour Soup","zh":"越式酸汤","ja":"カインチュア(酸味スープ)","ko":"까인쭈어 (베트남식 신맛국)"},"rating":4.4,"price":5300,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Tiêu","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Cơm trắng","price":5000},{"vi":"Rau thơm","price":3000},{"vi":"Giá đỗ","price":5000},{"vi":"Rau muống","price":5000}],"short":{"en":"A tangy-sweet fish soup built on tamarind, pineapple, tomato and bean sprouts, balancing sour, sweet and savory.","zh":"罗望子、菠萝、番茄与豆芽炖煮的酸甜鱼汤，酸甜咸鲜平衡。","ja":"タマリンドとパイナップル、トマト、もやしで作る、甘酸っぱい魚のスープ。","ko":"타마린드와 파인애플, 토마토, 콩나물로 끓인 새콤달콤한 생선국."},"desc_vi":"Canh chua là gì?\n**Canh chua** là một món canh truyền thống, dân dã và vô cùng phổ biến trong bữa cơm hàng ngày của người Việt Nam, đặc biệt là ở vùng sông nước **Miền Tây Nam Bộ**.\nMón ăn này gây thương nhớ bởi hương vị thanh mát, sự kết hợp hoàn hảo giữa **vị chua thanh dịu, vị ngọt đậm đà, chút cay nhẹ và ngò thơm lừng**, giúp giải nhiệt cực kỳ tốt trong những ngày nắng nóng.\n## 1. Thành phần chính\nMột nồi canh chua Nam Bộ chuẩn vị thường có sự góp mặt của các nguyên liệu rất phong phú:\n * **Đồ đạm (Cá / Hải sản / Thịt):**\n   * Phổ biến nhất là các loại **cá nước ngọt / cá đồng** như: *cá lóc, cá bông lau, cá hú, cá điêu hồng, cá chẽm, cá kèo...*\n   * Ngoài ra còn có thể nấu canh chua tôm, canh chua nghêu/ngao, canh chua lườn cá hồi hoặc canh chua gà (miền Tây gọi là gà nấu lá giang/lá me).\n * **Tạo vị chua tự nhiên:**\n   * **Quả me chín / me tươi** (phổ biến nhất ở miền Nam).\n   * Các nguyên liệu tạo chua khác tùy vùng miền: *lá giang, quả sấu, quả dọc, khế chua, quả dứa (thơm), cà chua, giấm nuôi, hoặc cơm mẻ*.\n * **Rau củ đi kèm (Đa dạng, giòn mát):**\n   * **Cà chua, dứa (khóm), đậu ok / đậu bắp, dọc mùng (người miền Nam gọi là bạc hà), giá đỗ.**\n   * Rau nêm không thể thiếu: **ngò gai (mùi tàu), rau ôm (rau ngổ)** thái nhỏ và vài lát **ớt hiểm tươi**.\n   * Tỏi phi vàng thơm rưới lên trên mặt bát canh.\n## 2. Các biến tấu Canh chua theo Vùng miền\nDù cùng tên gọi, nhưng canh chua ở ba miền lại mang những phong cách hương vị rất riêng:\n| Vùng miền | Đặc điểm đặc trưng |\n|---|---|\n| **Canh chua Miền Nam** | Vị **ngọt đậm - chua thanh - cay nhẹ** rõ rệt nhờ dùng nước cốt me, đường thốt nốt/đường cát và đa dạng loại rau như bạc hà, đậu bắp, giá, ngò ôm. |\n| **Canh chua Miền Trung** | Vị chua sắc và cay nồng hơn, thường nấu với cá biển (cá bớp, cá nhồng, cá thu) cùng khế chua, cà chua, dứa, ít cho đường. |\n| **Canh chua Miền Bắc** | Vị chua thanh nhẹ, trong nước, thường tạo chua bằng **quả sấu, quả dọc, tai chua, hoặc giấm mẻ/dấm thanh**. Bát canh mỏng nhẹ, ít béo, nêm thì là hoặc hành lá. |\n## 3. Thưởng thức Canh chua đúng điệu\nCanh chua ngon nhất khi ăn lúc còn **nóng hổi**:\n * **Món ăn kèm hoàn hảo:** Canh chua kết hợp cùng **Cá kho tộ** tạo thành \"cặp đôi hoàn hảo\" kinh điển trên mâm cơm gia đình người Nam Bộ (vừa có món mặn đậm đà, vừa có món canh chua ngọt giải ngấy).\n * **Nước chấm cá:** Khúc cá trong canh chua sau khi nấu chín tới sẽ được gắp riêng ra đĩa, chấm ngập vào bát **nước mắm nguyên chất dầm ớt hiểm** để giữ trọn độ đậm đà, ngọt thịt.\n * Rưới nước canh chua chan ngập cơm trắng dẻo thơm hoặc bún tươi để cảm nhận trọn vẹn vị tươi mát."},{"id":49,"cat":"veggie","image":"https://i.ibb.co/ZpR8BM3q/b2d09e1ef1e7ca9238f10a7da5f5cc17.jpg","name_vi":"Rau muống xào tỏi","name":{"en":"Stir-fried Water Spinach with Garlic","zh":"蒜蓉空心菜","ja":"ラウムオンサオトイ(空心菜のにんにく炒め)","ko":"라우무옹싸오또이 (마늘 모닝글로리볶음)"},"rating":4.2,"price":25000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Tỏi phi","price":3000},{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000}],"sides":[{"vi":"Cơm trắng","price":5000},{"vi":"Đậu phộng rang","price":3000},{"vi":"Dưa leo","price":3000},{"vi":"Canh","price":5000}],"short":{"en":"Water spinach flash-fried with plenty of garlic over high heat, a simple, essential side to any Vietnamese meal.","zh":"大火快炒空心菜与大量蒜末，是越南餐桌上不可或缺的家常菜。","ja":"たっぷりのにんにくで強火にサッと炒めた空心菜。ベトナムの食卓に欠かせない一品。","ko":"마늘을 듬뿍 넣고 센 불에 빠르게 볶은 모닝글로리. 베트남 밥상에 빠지지 않는 밑반찬."},"desc_vi":"Rau muống xào tỏi là gì?\n**Rau muống xào tỏi** là món ăn bình dị, dân dã nhưng vô cùng quen thuộc và được ví như món xào \"quốc dân\" trên mâm cơm gia đình cũng như trong các quán ăn, nhà hàng tại Việt Nam.\nMón ăn này thu hút bởi những đọt rau muống xanh mướt, giữ được độ giòn sần sật, quyện sánh cùng vị béo ngậy của mỡ/dầu ăn và thơm nức mũi của tỏi phi.\n## 1. Thành phần chính & Cách chế biến\nDù nguyên liệu vô cùng đơn giản, để xào được một đĩa rau muống xanh giòn, không bị đen hay nát lại đòi hỏi vài mẹo nhỏ:\n * **Nguyên liệu:**\n   * **Rau muống:** Dùng rau muống chẻ hoặc rau muống cọng nhỏ, nhặt lấy phần đọt non, rửa sạch và để thật ráo nước.\n   * **Tỏi:** Chọn tỏi ta thơm nồng, băm nhỏ hoặc đập dập (giữ cả tép to để khi xào tỏi thơm hơn và có độ bùi).\n   * **Gia vị:** Nước mắm ngon (hoặc dầu hàu, hạt nêm), chút đường, tiêu xay, và dầu ăn hoặc **mỡ heo** (dùng mỡ heo xào sẽ béo thơm vượt trội).\n * **Bí quyết chế biến xanh giòn:**\n   1. **Luộc sơ (trụng nước sôi):** Trụng nhanh rau muống qua nồi nước sôi có nêm chút muối hột, sau đó vớt ra vắt ráo hoặc ngâm ngay vào thau **nước đá lạnh** để giữ màu xanh tươi và độ giòn.\n   2. **Xào lửa lớn:** Phi thơm tỏi đập dập với dầu/mỡ nóng cho chuyển sang màu vàng nhạt, trút rau muống vào đảo thật nhanh tay trên **lửa lớn**.\n   3. **Nêm nếm nhanh:** Nêm dầu hàu/nước mắm, đảo đều khoảng 1–2 phút cho rau ngấm gia vị rồi tắt bếp ngay, không xào quá lâu làm rau bị dai và ngả màu.\n## 2. Các biến tấu nâng cấp phổ biến\nTừ món rau muống xào tỏi cơ bản, người ta có thể kết hợp thêm các nguyên liệu khác để tạo ra những món ăn đậm đà, sang trọng hơn:\n| Món biến tấu | Đặc điểm hấp dẫn |\n|---|---|\n| **Rau muống xào tỏi thịt bò** | Thịt bò ướp mềm, xào chín tới cùng rau muống, tăng thêm độ ngọt đạm đà và dinh dưỡng. |\n| **Rau muống xào ốc móng tay** | Món nhậu cực kỳ bắt miệng. Thịt ốc móng tay dai giòn sần sật xào cùng rau muống thơm nức mùi tỏi phi. |\n| **Rau muống xào chao** | Phong cách ẩm thực miền Nam. Thay vì nêm mắm/hạt nêm, người ta xào cùng **chao đỏ/chao trắng** tạo vị béo ngậy, thơm nồng lạ miệng. |\n| **Rau muống xào tỏi tóp mỡ** | Rắc thêm những viên tóp mỡ giòn rụm béo ngậy lên trên đĩa rau muống xào nóng hổi. |\n## 3. Thưởng thức\nRau muống xào tỏi ngon nhất khi ăn lúc vừa trút ra đĩa, còn nóng hổi nghi ngút khói. Món này ăn kèm với cơm trắng nóng, chấm cùng bát **nước mắm tỏi ớt** hoặc **nước tương (xì dầu) dầm ớt tươi** rất đưa cơm, giúp cân bằng lại vị giác khi mâm cơm có nhiều món thịt cá béo ngậy."},{"id":50,"cat":"dessert","image":"https://i.ibb.co/bjHHD88J/3425f0053458cb8d651a3d6b7458d1e8.jpg","name_vi":"Chè ba màu","name":{"en":"Three-Color Dessert","zh":"越南三色甜品","ja":"チェーバマウ(三色ベトナムぜんざい)","ko":"쩨바마우 (베트남 삼색빙수)"},"rating":4.1,"price":15000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Nước cốt dừa","price":5000},{"vi":"Đá bào","price":2000},{"vi":"Muối","price":1000}],"sides":[{"vi":"Đậu đỏ","price":5000},{"vi":"Đậu xanh","price":5000},{"vi":"Thạch rau câu","price":5000},{"vi":"Dừa sợi","price":5000}],"short":{"en":"A layered sweet-soup dessert of mung bean, red bean and pandan jelly over ice with coconut milk.","zh":"绿豆、红豆与班兰啫喱分层叠放，淋椰浆冰镇享用。","ja":"緑豆、小豆、パンダンゼリーを層にし、ココナッツミルクと氷をかけて食べる甘味。","ko":"녹두, 팥, 판단잎 젤리를 층층이 쌓고 코코넛밀크와 얼음을 부어 먹는 디저트."},"desc_vi":"Chè ba màu là gì?\n**Chè ba màu** là một món chè tráng miệng dân dã, tươi mát và vô cùng quen thuộc trong văn hóa ẩm thực miền Nam Việt Nam. Món chè này đúng như tên gọi, thu hút người ăn ngay từ cái nhìn đầu tiên nhờ **3 lớp màu sắc tươi tắn, tách biệt rõ ràng** xếp chồng lên nhau trong một chiếc ly thủy tinh trong suốt.\n## 1. Ba lớp màu sắc gồm những gì?\nMột ly chè ba màu truyền thống chuẩn vị được cấu thành từ 3 phần đậu/thạch đặc trưng:\n * **Lớp màu đỏ (Đậu đỏ):** Đậu đỏ (hoặc đậu kidney) được ninh mềm dẻo, ngọt thanh.\n * **Lớp màu vàng (Đậu xanh):** Đậu xanh đánh (đã đãi vỏ) được hấp chín, xay hoặc giã nhuyễn với đường thành lớp paste mịn màng, bùi bùi.\n * **Lớp màu xanh (Thạch bánh đúc / Thạch lá nếp):** Thạch rau câu hoặc thạch bột năng/bột gạo màu xanh mướt, dậy **mùi thơm đặc trưng của lá nếp (lá dứa)**, có độ giòn dẻo dai sần sật.\n## 2. Phần nước sốt & Đồ ăn kèm \"thần thánh\"\nĐiều làm nên độ béo ngậy, mát lạnh kích thích vị giác của ly chè ba màu chính là:\n * **Nước cốt dừa béo ngậy:** Phần nước cốt dừa thắng sánh mịn, nêm chút muối nhẹ để dằn lại vị ngọt, rưới ngập lên trên cùng của ly chè.\n * **Đá bào mát lạnh:** Lớp đá bào nhỏ mịn phủ lên trên giúp món chè trở nên thanh mát, xua tan ngay cái nóng bức.\n * **Đậu phụng rang (Lạc):** Rắc một ít đậu phụng rang đập dập lên trên mặt để tăng độ bùi và thơm.\n## 3. Cảm nhận hương vị & Cách thưởng thức\n * **Hương vị:** Sự hòa quyện hoàn hảo giữa **vị bùi dẻo của đậu đỏ, vị béo mịn của đậu xanh, độ giòn dẻo thơm lừng lá dứa của thạch**, hòa trong vị **béo ngậy mát lạnh của nước cốt dừa và đá bào**.\n * **Cách ăn \"đúng điệu\":** Khi cầm ly chè ba màu trên tay, bạn dùng muỗng **trộn đều tất cả các lớp lại với nhau** cho đá tan nhẹ, giúp nước cốt dừa quyện đều vào đậu và thạch rồi thưởng thức!\nChè ba màu không chỉ là món ăn giải nhiệt tuyệt vời vào những ngày hè nắng nóng mà còn là tuổi thơ của biết bao thế hệ người Việt."},{"id":51,"cat":"dessert","image":"https://i.ibb.co/CstW4zbD/8c6181c40b0544bbff4476feb23b084a.jpg","name_vi":"Chè đậu xanh","name":{"en":"Sweet Mung Bean Soup","zh":"绿豆甜汤","ja":"チェーダウサイン(緑豆ぜんざい)","ko":"쩨더우싼 (녹두단팥죽)"},"rating":4.8,"price":10000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Nước cốt dừa","price":5000},{"vi":"Muối","price":1000},{"vi":"Vani","price":2000}],"sides":[{"vi":"Dừa sợi","price":5000},{"vi":"Đậu phộng rang","price":3000},{"vi":"Thạch rau câu","price":5000},{"vi":"Đá bào","price":2000}],"short":{"en":"A comforting warm or chilled sweet soup of tender mung beans in coconut milk.","zh":"绵软绿豆熬煮的椰香甜汤，可热食也可冰镇。","ja":"やわらかく煮た緑豆をココナッツミルクで仕上げた、温かくも冷たくも楽しめる甘味。","ko":"부드럽게 삶은 녹두를 코코넛밀크에 넣은 따뜻하거나 시원한 단팥죽 같은 디저트."},"desc_vi":"Chè đậu xanh là gì?\n**Chè đậu xanh** là món chè tráng miệng truyền thống, lâu đời và quen thuộc bậc nhất trong văn hóa ẩm thực của người Việt Nam. Món ăn này được làm từ nguyên liệu chính là **đậu xanh** (dùng cả hạt hoặc đậu xanh đã đãi vỏ), nấu cùng đường và các nguyên liệu tạo độ sánh hoặc thanh mát.\nKhông chỉ là một món ăn ngon, chè đậu xanh còn được coi là một \"món ăn bài thuốc\" nhờ đặc tính **thanh nhiệt, giải độc, làm mát cơ thể** cực kỳ tốt, đặc biệt là vào những ngày hè oi nóng.\n## 1. Các kiểu nấu Chè đậu xanh phổ biến\nTùy theo thói quen ẩm thực của từng vùng miền và sở thích gia đình, chè đậu xanh được biến tấu thành nhiều phong cách khác nhau:\n| Phong cách chè | Đặc điểm nổi bật |\n|---|---|\n| **Chè đậu xanh đánh (Nhiều ở Miền Nam)** | Dùng đậu xanh đã đãi sạch vỏ, hấp chín rồi đánh/xay nhuyễn mịn với đường. Khi ăn rưới ngập **nước cốt dừa béo ngậy**, rắc chút đậu phụng rang, ăn kèm đá bào. |\n| **Chè đậu xanh nguyên hạt (Miền Bắc/Trung)** | Dùng đậu xanh nguyên hạt (còn vỏ) ninh mềm nhừ nhưng không vỡ nát, nấu cùng đường phèn/đường thốt nốt. Nước chè thanh ngọt, ăn vừa thơm vừa bùi. |\n| **Chè hoa cau / Chè xé (Miền Bắc)** | Đậu xanh đãi vỏ hấp chín tới (rời từng hạt như hoa cau), nấu trong nước đường thốt nốt/đường phèn hòa chút **bột sắn dây** sánh mịn, thoảng hương hoa lài/hoa rượi. |\n| **Chè đậu xanh phổ tai / Phổ tai bột lọc** | Kết hợp đậu xanh với **phổ tai (một loại rong biển khô)** giòn sần sật và hạt bột lọc dẻo dai, tạo cảm giác thanh mát đặc biệt. |\n## 2. Thành phần & Nguyên liệu ăn kèm\n * **Nguyên liệu chính:** Đậu xanh (nguyên hạt hoặc cà vỏ), đường (đường cát, đường phèn hoặc đường thốt nốt).\n * **Chất tạo sánh (Tùy loại chè):** Bột sắn dây, bột năng hoặc bột củ năng.\n * **Topping & Hương liệu tăng vị:**\n   * **Nước cốt dừa:** Tạo độ béo ngậy thơm lừng.\n   * **Đậu phụng (lạc) / Vừng (mè) rang:** Tăng độ bùi.\n   * **Nước hoa dừa, hoa lài hoặc vani:** Tạo mùi thơm thư thái.\n   * **Thạch đen (sương sáo), dừa nạo sợi, trân trì / bột lọc.**\n## 3. Lợi ích sức khỏe & Thưởng thức\n * **Giá trị dinh dưỡng:** Đậu xanh giàu chất xơ, vitamin nhóm B, sắt, kali và chất chống oxy hóa. Theo Đông y, đậu xanh có tính mát, giúp thanh nhiệt, hạ hỏa, giải độc và giảm cảm giác mệt mỏi.\n * **Cách thưởng thức:**\n   * **Ăn nóng:** Thích hợp vào mùa đông hay tiết trời se lạnh, múc ra bát nhỏ thoảng hương hoa dừa/hoa lài, nhâm nhi vị bùi ngọt thanh dịu.\n   * **Ăn lạnh:** Thêm đá bào hoặc để ngăn mát tủ lạnh, ăn cùng nước cốt dừa và các loại thạch giúp giải nhiệt tức thì trong ngày hè."},{"id":52,"cat":"dessert","image":"https://i.ibb.co/5W4ptGx1/0d8286bad5c123aa43b81439dd4c01da.jpg","name_vi":"Chè trôi nước","name":{"en":"Glutinous Rice Balls in Ginger Syrup","zh":"越式汤圆(姜汁糯米团)","ja":"チェートロイヌック(生姜シロップの白玉)","ko":"쩨쪼이느억 (생강시럽 찹쌀경단)"},"rating":4.5,"price":50000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Nước cốt dừa","price":5000},{"vi":"Gừng","price":2000},{"vi":"Muối","price":1000}],"sides":[{"vi":"Dừa sợi","price":5000},{"vi":"Đậu phộng rang","price":3000},{"vi":"Mè rang","price":3000},{"vi":"Đá bào","price":2000}],"short":{"en":"Chewy glutinous rice balls filled with sweet mung bean, served in warm ginger syrup with coconut cream.","zh":"糯米团内包绿豆馅，浸于温热姜汁中，淋椰浆。","ja":"緑豆餡入りのもちもち白玉を、生姜の効いた温かいシロップとココナッツクリームでいただく。","ko":"녹두소를 채운 쫄깃한 찹쌀경단을 따뜻한 생강시럽과 코코넛크림에 곁들인 디저트."},"desc_vi":"Chè trôi nước là gì?\n**Chè trôi nước** là món chè truyền thống nổi tiếng, mang đậm nét văn hóa ẩm thực của người Việt Nam, đặc biệt phổ biến ở miền Nam và miền Trung. Món chè này thu hút bởi những **viên chè tròn dẻo mịn làm từ bột nếp, bọc nhân đậu xanh bùi bùi**, ngập trong phần **nước đường gừng nóng hổi, thơm nức** và rưới thêm **nước cốt dừa béo ngậy**.\nNgoài ra, chè trôi nước còn là món ăn mang tính biểu tượng, không thể thiếu trong các dịp cúng lễ quan trọng như **Tết Đoan Ngọ (mùng 5 tháng 5 âm lịch), ngày Tết Hàn Thực (mùng 3 tháng 3 âm lịch ở miền Nam), lễ Cúng Mụ, thôi nôi, hay rằm tháng Giêng**.\n## 1. Thành phần chính & Cách chế biến\nMột bát chè trôi nước chuẩn vị được tạo nên từ sự kết hợp của các thành phần dân dã:\n * **Vỏ bánh:** Làm từ **bột nếp** nhào kỹ với nước ấm cho đến khi dẻo mịn, không dính tay. Khi luộc chín trong nước sôi, viên bột nổi \"trôi\" lên mặt nước (đây cũng là nguồn gốc tên gọi *chè trôi nước*).\n * **Nhân bánh:** **Đậu xanh** đã đãi vỏ, hấp chín, giã nhuyễn rồi sên với đường và ít hành phi/mỡ hành cho bùi thơm, sau đó vo thành từng viên tròn nhỏ.\n * **Viên ỉ (Viên ỉa / Viên trôi con):** Cùng với các viên bánh lớn có nhân, người ta thường vo thêm những viên bột nếp nhỏ không nhân (gọi là viên ỉ) thả vào nồi chè.\n * **Nước đường gừng (Linh hồn nước chè):** Nấu từ **đường thốt nốt** hoặc đường phèn tạo màu vàng óng đẹp mắt và vị ngọt thanh, thêm **gừng tươi thái sợi hoặc đập dập** tạo mùi thơm ấm nồng.\n## 2. Phân biệt Chè trôi nước (Miền Nam) & Bánh trôi (Miền Bắc)\nDù cùng làm từ bột nếp và có hình dáng viên tròn, hai món này có những điểm khác biệt rõ rệt:\n| Tiêu chí | Chè trôi nước (Miền Nam / Miền Trung) | Bánh trôi (Miền Bắc) |\n|---|---|---|\n| **Nhân bánh** | Nhân **đậu xanh** sên nhuyễn bùi bùi. | Nhân **đường phèn/đường thẻ** cắt viên vuông nhỏ. |\n| **Kích thước** | Viên to (khoảng bằng quả trứng gà). | Viên nhỏ vừa ăn (khoảng bằng quả quất/tắc). |\n| **Nước chè & Topping** | Chan ngập **nước đường gừng**, rưới **nước cốt dừa**, rắc **mè/đậu phụng rang**. | Bánh vớt ra đĩa khô, rắc **vừng trắng (mè)** hoặc dừa nạo lên trên, không chan nước đường. |\n## 3. Cảm nhận hương vị & Ý nghĩa văn hóa\n * **Hương vị:** Khi cắn một miếng, bạn sẽ cảm nhận được độ **dẻo mềm của vỏ nếp**, vị **bùi ngậy của nhân đậu xanh**, hòa quyện với vị **ngọt thanh, cay ấm của nước đường gừng** và độ **béo ngậy của nước cốt dừa**.\n * **Ý nghĩa:** Những viên chè tròn trịa, trôi lăn tăn trong nồi nước đường tượng trưng cho sự **tròn đầy, viên mãn, hanh thông** và tình cảm gia đình khăng khít, gắn kết."},{"id":53,"cat":"cake","image":"https://i.ibb.co/LDVxjnBw/718e0072d57a813ca96584d7f485011d.jpg","name_vi":"Bánh da lợn","name":{"en":"Layered Pandan-Coconut Cake","zh":"越式千层糕(斑斓椰汁糕)","ja":"バインザーロン(パンダン層ケーキ)","ko":"반자런 (판단 코코넛 켜떡)"},"rating":5.0,"price":20000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Nước cốt dừa","price":5000},{"vi":"Muối","price":1000},{"vi":"Vani","price":2000}],"sides":[{"vi":"Dừa nạo","price":5000},{"vi":"Mè rang","price":3000},{"vi":"Đậu phộng rang","price":3000},{"vi":"Trà nóng","price":5000}],"short":{"en":"A striped steamed cake alternating jade-green pandan and coconut layers, chewy and lightly sweet.","zh":"翠绿班兰与椰香分层交叠的Q弹蒸糕，清甜爽口。","ja":"翡翠色のパンダンとココナッツを交互に重ねた、もちもちで優しい甘さの蒸しケーキ。","ko":"연두빛 판단잎과 코코넛을 켜켜이 쌓아 찐 쫄깃하고 은은하게 단 떡."},"desc_vi":"Bánh da lợn là gì?\n**Bánh da lợn** (hay còn gọi là *Bánh da heo*) là một món bánh tráng miệng truyền thống, dân dã vô cùng nổi tiếng của vùng **Đồng bằng sông Cửu Long (Miền Tây Nam Bộ)**. Món bánh này gây ấn tượng bởi cấu trúc **mềm dẻo, dai giòn sần sật**, kết cấu gồm **nhiều lớp màu sắc xếp chồng lên nhau** đẹp mắt và hương vị béo thơm đặc trưng của nước cốt dừa.\n## 1. Tại sao lại gọi là \"Bánh da lợn\"?\nDù có tên gọi là \"da lợn\" (hoặc \"da heo\"), nhưng món bánh này **hoàn toàn không chứa bất kỳ thành phần nào từ thịt hay da heo**.\nTên gọi thú vị này xuất phát từ đặc tính vật lý của bánh:\n * Bánh khi hấp chín có độ **dẻo, dai, mịn màng và hơi bóng**.\n * Khi dùng tay kéo nhẹ hoặc cắn vào, bánh có độ đàn hồi giòn dẻo nhẹ giống như cảm giác của lớp da heo.\n## 2. Thành phần chính & Các lớp màu sắc\nBánh da lợn truyền thống chuẩn vị Miền Tây thường được làm từ các nguyên liệu vô cùng dân dã:\n * **Phần bột (Tạo độ dẻo dai & bóng):** Kết hợp giữa **bột năng** (thành phần chính tạo độ dai dẻo), **bột gạo** (giúp bánh không bị quá dính) và **nước cốt dừa** béo ngậy.\n * **Lớp màu xanh (Mùi thơm lá dứa):** Nước cốt **lá dứa (lá nếp)** tươi xay ra, vừa tạo màu xanh mướt tự nhiên vừa mang lại mùi thơm nức đặc trưng.\n * **Lớp màu vàng (Vị bùi đậu xanh):** **Đậu xanh** đãi sạch vỏ, hấp chín rồi xay/đánh thật mịn với đường và nước cốt dừa.\n * **Các lớp xếp kẽ:** Người ta sẽ đổ từng lớp bột (một lớp xanh, một lớp vàng) vào khuôn rồi đem hấp. Khi lớp này vừa chín tới thì mới đổ tiếp lớp kia lên, tạo thành chiếc bánh có nhiều tầng tầng lớp lớp cực kỳ đẹp mắt.\n## 3. Các biến tấu hiện đại\nNgoài phiên bản truyền thống lá dứa - đậu xanh, ngày nay bánh da lợn còn được sáng tạo thêm nhiều phong cách phong phú:\n| Biến tấu | Đặc điểm hấp dẫn |\n|---|---|\n| **Bánh da lợn khoai môn** | Thay lớp đậu xanh bằng **khoai môn hấp chín xay mịn**, tạo màu tím nhạt và vị bùi bùi đặc trưng. |\n| **Bánh da lợn cà phê / Cacao** | Tạo lớp màu nâu cùng hương thơm đắng nhẹ của cà phê/cacao, ăn rất lạ miệng và ngấy. |\n| **Bánh da lợn cuộn** | Bánh được tráng mỏng, hấp chín rồi cuộn tròn lại cùng nhân đậu xanh bọc ở giữa trước khi cắt lát. |\n## 4. Cảm nhận hương vị & Cách thưởng thức\n * **Hương vị:** Khi thưởng thức, bạn sẽ cảm nhận được độ **dẻo dai sần sật** của lớp bột năng, vị **bùi ngậy béo mịn** của đậu xanh, hòa quyện với vị **béo ngậy của nước cốt dừa** và **mùi thơm thanh mát của lá dứa**.\n * **Trải nghiệm ăn thú vị:** Nhiều người (đặc biệt là trẻ em) rất thích ăn bánh da lợn bằng cách **bóc tách từng lớp bánh ra để nhâm nhi từng chút một** thay vì cắn nguyên miếng lớn, để cảm nhận rõ từng tầng hương vị dẻo thơm.\nBánh da lợn thường được dùng làm món ăn vặt xế chiều, xuất hiện trong các khay bánh quê hoặc dùng làm quà biếu đậm chất miền Tây."},{"id":54,"cat":"cake","image":"https://i.ibb.co/677BdQQt/987227d7b1e4b0968734477b3f8dd390.jpg","name_vi":"Bánh chuối","name":{"en":"Banana Cake","zh":"香蕉糕(蒸香蕉糯米糕)","ja":"バインチュオイ(バナナ蒸しケーキ)","ko":"반쭈오이 (바나나 찹쌀떡케이크)"},"rating":5.0,"price":15000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Nước cốt dừa","price":5000},{"vi":"Mè rang","price":3000},{"vi":"Muối","price":1000}],"sides":[{"vi":"Dừa nạo","price":5000},{"vi":"Đậu phộng rang","price":3000},{"vi":"Kem dừa","price":10000},{"vi":"Trà nóng","price":5000}],"short":{"en":"Sweet ripe bananas folded into tapioca or rice batter, steamed or grilled until translucent and sticky.","zh":"熟香蕉拌入木薯粉浆，蒸或烤至晶莹软糯。","ja":"熟したバナナをタピオカ粉の生地に混ぜ、蒸すか焼くかして半透明でもちもちに仕上げる。","ko":"잘 익은 바나나를 타피오카 반죽에 넣어 찌거나 구워 반투명하고 쫀득하게 만든 떡."},"desc_vi":"Bánh chuối là gì?\n**Bánh chuối** là tên gọi chung cho các món bánh tráng miệng dân dã, ngọt ngào và cực kỳ phổ biến trong văn hóa ẩm thực Việt Nam, đặc biệt là ở miền Nam và miền Tây Nam Bộ. Nguyên liệu chính của món ăn này chính là những quả **chuối chín** (thường dùng nhất là *chuối sứ* hay *chuối xiêm* vì thịt dẻo, ngọt đậm và không bị chát khi chế biến).\nTùy thuộc vào cách chế biến (chiến, hấp, nướng), bánh chuối được chia thành 3 phong cách kinh điển cực kỳ hấp dẫn:\n## 1. Các loại Bánh chuối phổ biến nhất\n| Loại bánh | Cách chế biến & Đặc điểm nổi bật |\n|---|---|\n| **Bánh chuối chiên** | **Món ăn đường phố \"quốc dân\":** Chuối chín được ép dẹp, nhúng qua lớp bột mì/bột gạo pha sền sệt (có thể thêm chút vừng đen) rồi chiên phồng trong chảo dầu nóng. Bánh có lớp vỏ ngoài **vàng ươm, giòn rụm**, bên trong thịt chuối chín **mềm dẻo, ngọt thơm, nóng hổi**. |\n| **Bánh chuối hấp** | **Đặc sản Miền Tây dẻo thơm:** Chuối thái lát xắt mỏng trộn với bột năng, bột gạo, ít đường rồi mang đi hấp chín trong khuôn. Bánh hoàn thành có màu vàng ánh kem, **dẻo quánh, mềm mịn**. Khi ăn cắt thành từng miếng nhỏ, **rưới ngập nước cốt dừa** béo ngậy và rắc đậu phụng rang lên trên. |\n| **Bánh chuối nướng** | **Đậm đà hương vị truyền thống:** Chuối được xắt lát ướp với đường và chút rượu rum (hoặc rượu mai quế lộ) cho dậy mùi, trộn cùng bánh mì sandwich xé nhỏ ngâm sữa tươi/nước cốt dừa rồi nướng vàng mặt. Bánh có màu đỏ nâu cánh gián, **thơm lừng mùi dừa, mượt mà và ngậy béo**. |\n## 2. Thành phần & Hương vị đặc trưng\n * **Chuối chín:** \"Linh hồn\" tạo nên độ ngọt tự nhiên, mùi thơm nồng nàn cho món bánh.\n * **Bột:** Bột mì (cho bánh chiên), bột năng & bột gạo (cho bánh hấp/nướng).\n * **Nước cốt dừa & Đậu phụng:** Hai thành phần không thể thiếu khi ăn bánh chuối hấp hay bánh chuối nướng phong cách miền Nam, giúp nâng tầm độ béo ngậy và bùi thơm.\n## 3. Cảm nhận khi thưởng thức\nBánh chuối dù làm theo cách nào cũng mang lại cảm giác vô cùng ấm cúng và gần gũi. Vị ngọt thanh tự nhiên từ quả chuối chín khi kết hợp cùng độ giòn của bột chiên, độ dẻo của bột hấp hay độ béo ngậy của nước cốt dừa luôn tạo nên một món ăn vặt xế chiều hoặc tráng miệng khó cưỡng cho mọi lứa tuổi."},{"id":55,"cat":"cake","image":"https://i.ibb.co/s9NhJHDM/ddfcdd377daea1278a74666dcf2a243e.jpg","name_vi":"Bánh tiêu","name":{"en":"Puffy Sesame Donut","zh":"芝麻球(空心芝麻饼)","ja":"バインティエウ(ふわふわごまドーナツ)","ko":"반띠에우 (속이 빈 참깨도넛)"},"rating":5.0,"price":10000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Mè rang","price":3000},{"vi":"Muối","price":1000},{"vi":"Vani","price":2000}],"sides":[{"vi":"Sữa đặc","price":3000},{"vi":"Dừa nạo","price":5000},{"vi":"Đậu xanh","price":5000},{"vi":"Trà nóng","price":5000}],"short":{"en":"A hollow, puffy fried dough ball coated in sesame seeds, crisp outside and airy within.","zh":"外裹芝麻的中空炸面饼，外酥内空气感十足。","ja":"ごまをまぶした、中が空洞のふわっと揚げたドーナツ。外はカリッと中はふんわり。","ko":"참깨를 묻혀 튀긴 속이 빈 도넛. 겉은 바삭하고 속은 부풀어 가볍다."},"desc_vi":"Bánh tiêu là gì?\n**Bánh tiêu** là một món bánh chiên ăn vặt bình dị, dân dã và vô cùng quen thuộc trong văn hóa ẩm thực đường phố Việt Nam, có nguồn gốc từ ẩm thực người Hoa du nhập vào miền Nam. Món bánh này thu hút bởi những chiếc bánh hình tròn **rỗng ruột, nở phồng to, bên ngoài phủ kín lớp vừng (mè) trắng** thơm phức.\n## 1. Thành phần chính & Cách chế biến\nDù có vẻ ngoài phồng to bắt mắt, nguyên liệu làm bánh tiêu lại rất đơn giản và mộc mạc:\n * **Thành phần:** Bột mì, men nở (yeast), đường, một chút muối, nước ấm và **vừng (mè) trắng**.\n * **Quy trình chế biến:**\n   1. Bột mì được nhào trộn với men nở và đường, sau đó ủ cho bột nở gấp đôi.\n   2. Chia bột thành từng viên nhỏ, cán mỏng vừa phải rồi lăn qua một lớp vừng trắng phủ kín hai mặt.\n   3. Thả lá bột vào chảo **dầu nóng ngập bánh**. Dưới tác động của nhiệt độ cao và men nở, lá bột sẽ tự động **nở phồng to căng tròn** như một quả bóng, chuyển sang màu vàng ruộm hấp dẫn.\n## 2. Hương vị & Cảm nhận khi thưởng thức\n * **Vỏ bánh:** Lớp vỏ ngoài có màu vàng ươm, thoang thoảng mùi thơm nức của vừng rang. Khi cắn vào có độ **giòn nhẹ ở lớp vỏ ngoài**, nhưng bên trong lại **mềm dẻo, hơi hơi dai**.\n * **Ruột bánh:** Bên trong hoàn toàn **rỗng ruột**, tỏa ra mùi thơm của men nở và vừng.\n * **Vị bánh:** Bánh tiêu có vị **ngọt nhẹ, thanh thanh** chứ không ngọt gắt, béo bùi nhờ vừng và dầu chiên nhưng không gây cảm giác quá ngấy.\n## 3. Các cách ăn biến tấu thú vị\nBánh tiêu không chỉ ăn riêng như một món ăn vặt xế chiều mà còn rất thích hợp để kết hợp cùng các món khác:\n| Cách ăn | Trải nghiệm hương vị |\n|---|---|\n| **Bánh tiêu kẹp Bánh bò** | **Cặp đôi \"huyền thoại\" đường phố:** Cắt đôi chiếc bánh tiêu phồng rỗng rồi nhét một chiếc bánh bò rễ tre dẻo mềm, béo ngậy nước cốt dừa vào giữa. Vị ngọt dẻo của bánh bò hòa quyện với vỏ giòn thơm của bánh tiêu cực kỳ bắt miệng. |\n| **Bánh tiêu nhân xôi / xôi đậu xanh** | Bánh tiêu cắt đôi kẹp xôi nếp dẻo thơm, rắc thêm chút dừa nạo và đậu phụng giã dập. |\n| **Bánh tiêu nhân sầu riêng / phô mai** | Phiên bản biến tấu hiện đại, bơm thêm sốt sầu riêng béo ngậy hoặc phô mai tan chảy vào bên trong ruột bánh nóng hổi. |\nBánh tiêu ngon nhất khi thưởng thức ngay lúc **vừa mới vớt ra khỏi chảo dầu, còn nóng hổi nghi ngút khói**, vỏ bánh giữ trọn độ giòn thơm xốp dẻo."},{"id":56,"cat":"cake","image":"https://i.ibb.co/Q3XTgSkm/f03d54ee148c7101929e31f7ba4ef28a.jpg","name_vi":"Bánh cam","name":{"en":"Fried Sesame Balls","zh":"煎堆(芝麻球)","ja":"バインカム(ごま揚げ団子)","ko":"반깜 (참깨 튀김경단)"},"rating":5.0,"price":6000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Mè rang","price":3000},{"vi":"Muối","price":1000},{"vi":"Nước cốt dừa","price":5000}],"sides":[{"vi":"Đậu xanh","price":5000},{"vi":"Dừa nạo","price":5000},{"vi":"Sữa đặc","price":3000},{"vi":"Trà nóng","price":5000}],"short":{"en":"Golden fried glutinous rice balls with a sweet mung bean center, rolled in crunchy sesame seeds.","zh":"金黄炸糯米球，内包绿豆馅，外裹酥脆芝麻。","ja":"緑豆餡入りの揚げたもち米団子。表面はカリカリのごまをまぶす。","ko":"녹두소를 넣고 튀긴 황금빛 찹쌀경단에 바삭한 참깨를 묻힌 간식."},"desc_vi":"Bánh cam là gì?\n**Bánh cam** (ở miền Bắc gọi là *Bánh rán ngọt*) là món bánh chiên ăn vặt dân dã, lâu đời và vô cùng quen thuộc trong văn hóa ẩm thực đường phố Việt Nam, đặc biệt là ở miền Nam.\nMón bánh này thu hút bởi **hình dáng tròn xoe, màu vàng cam bắt mắt** (như quả cam chín), lớp vỏ ngoài **giòn rụm phủ vừng (mè)** hoặc áo một lớp đường thắng ngọt ngào, bên trong chứa **nhân đậu xanh bùi dẻo**.\n## 1. Thành phần chính & Chế biến\n * **Vỏ bánh dẻo giòn:** Làm từ hỗn hợp **bột nếp kết hợp với bột gạo** (hoặc một ít khoai lang hấp chín giã mịn) giúp vỏ bánh khi chiên có độ giòn phồng bên ngoài nhưng vẫn dẻo mềm, không bị cứng bên trong.\n * **Nhân đậu xanh (Linh hồn bên trong):** Đậu xanh đãi vỏ, hấp chín, giã nhuyễn rồi sên với đường cùng chút **dừa nạo sợi** và vani cho bùi thơm, sau đó vo thành từng viên tròn nhỏ.\n * **Lớp phủ bên ngoài:** Bánh sau khi vo tròn (bọc nhân đậu xanh bên trong) sẽ được lăn qua một lớp **vừng (mè) trắng** phủ kín.\n * **Chiên bánh:** Thả bánh vào chảo dầu nóng chiên ngập dầu trên lửa vừa, đảo đều tay cho bánh nở căng tròn, chuyển sang màu **vàng cam ruộm** giòn tan.\n## 2. Hai phiên bản Bánh cam phổ biến\nTùy vào lớp áo bên ngoài, bánh cam thường được chia làm 2 loại chính:\n| Loại bánh cam | Đặc điểm lớp vỏ |\n|---|---|\n| **Bánh cam mè (Bánh cam truyền thống)** | Sau khi chiên, vỏ bánh phủ kín **vừng (mè) trắng** rang thơm. Bánh có vị ngọt nhẹ tự nhiên, thơm bùi mùi vừng và đậu xanh. |\n| **Bánh cam đường** | Bánh chiên xong được đảo qua một lớp **đường thắng màu nâu sẫm/vàng óng** (hoặc đường thốt nốt) quánh lại bao bọc lấy vỏ bánh. Bánh có độ vỏ giòn cứng nhẹ, ngọt đậm đà và bóng bẩy. |\n## 3. Phân biệt Bánh cam (Miền Nam) & Bánh rán ngọt (Miền Bắc)\nDù cùng có dạng tròn chiên giòn bọc nhân đậu xanh, hai món này có vài điểm khác biệt nhỏ:\n * **Bánh cam miền Nam:** Thường có kích thước to hơn, nhân đậu xanh bên trong khi lắc nhẹ có thể thấy **\"lắc rắc\"** (do nhân đậu vo cứng tách rời khỏi vỏ bánh phồng rỗng).\n * **Bánh rán ngọt miền Bắc:** Thường nhỏ gọn hơn, phần vỏ dày dặn hơn một chút và nhân đậu xanh thường bám dính nhẹ vào thành vỏ bên trong.\n## 4. Cảm nhận hương vị\nMột chiếc bánh cam ngon đúng chuẩn phải đạt độ **vỏ ngoài giòn rụm, tỏa mùi thơm nức của vừng/đường**, khi cắn vào cảm nhận được độ dẻo của bột nếp và vị **bùi bùi, béo ngậy, ngọt thanh của nhân đậu xanh dừa**. Món này ngon nhất khi thưởng thức còn ấm nóng, rất thích hợp cho những bữa ăn vặt xế chiều."},{"id":57,"cat":"cake","image":"https://i.ibb.co/DD7dz5cv/5f83dfd0692b78a94d9e68c0129af92e.jpg","name_vi":"Bánh cốm","name":{"en":"Young Rice Pastry","zh":"绿糯米饼(河内青米糕)","ja":"バインコム(若摘み米菓子)","ko":"반꼼 (하노이 풋쌀떡)"},"rating":4.8,"price":40000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Dừa nạo","price":5000},{"vi":"Mè rang","price":3000},{"vi":"Muối","price":1000}],"sides":[{"vi":"Trà nóng","price":5000},{"vi":"Đậu xanh","price":5000},{"vi":"Hạt sen","price":5000},{"vi":"Dừa sợi","price":5000}],"short":{"en":"A delicate Hanoi pastry of pounded young green rice wrapped around sweet mung bean paste.","zh":"河内精致点心，以捣制青糯米包裹绿豆蓉甜馅。","ja":"若摘みの青い米を搗いて作る、緑豆餡入りのハノイの繊細な菓子。","ko":"어린 풋쌀을 찧어 만든 반죽에 달콤한 녹두소를 채운 하노이의 섬세한 떡."},"desc_vi":"Bánh cốm là gì?\n**Bánh cốm** là một món bánh đặc sản truyền thống thanh nhã, nổi tiếng bậc nhất của ẩm thực **Hà Nội** (miền Bắc Việt Nam). Món bánh này gây ấn tượng bởi **màu xanh ngọc tươi mát**, vỏ dẻo quánh thơm nức **mùi cốm thu** quyện cùng nhân đậu xanh dừa bùi ngọt.\nKhông chỉ là món ăn vặt tinh tế, bánh cốm còn mang giá trị văn hóa sâu sắc, là biểu tượng của sự may mắn, may mắn và viên mãn không thể thiếu trong các **lễ dạm ngõ, ăn hỏi, cưới xin** của người Việt.\n## 1. Thành phần chính & Cách làm công phu\nĐể làm ra một chiếc bánh cốm ngon đúng chuẩn Hà Thành, người thợ phải rất tỉ mỉ trong từng công đoạn:\n * **Vỏ bánh cốm:**\n   * Dùng **cốm khô** (hoặc cốm tươi vào mùa thu) đem xào cùng nước đường phèn hoặc đường cát, thêm chút nước hoa tưởi/hoa lài cho thơm.\n   * Khi xào trên lửa nhỏ, hạt cốm quánh lại thành một khối bột **dẻo mịn, có màu xanh ngọc tự nhiên** mà vẫn giữ trọn hương thơm đặc trưng của lúa nếp non.\n * **Nhân bánh:**\n   * **Đậu xanh** đãi vỏ, hấp chín, giã nhuyễn rồi sên dẻo với đường.\n   * Trộn thêm **dừa nạo sợi** sần sật và một ít mứt mứt hạt sen thái nhỏ để tăng độ bùi béo.\n * **Tạo hình & Đóng gói:** Nhân đậu xanh được bọc gọn bên trong lớp vỏ cốm dẻo, nắn thành hình **khối vuông vắn**. Bánh sau đó được gói trong lá chuối hoặc màng bọc thực phẩm, bên ngoài bọc hộp giấy màu đỏ in chữ \"Hỷ\" hoặc họa tiết hoa lá may mắn.\n## 2. Ý nghĩa văn hóa đặc biệt\n * **Biểu tượng cưới hỏi:** Trong đám hỏi của người miền Bắc, mâm tráp **\"Bánh cốm - Bánh phu thê\"** (hoặc Bánh cốm - Bánh hồng) luôn đi thành một cặp. Bánh cốm hình vuông tượng trưng cho đất (Âm), bánh phu thê hình tròn tượng trưng cho trời (Dương), thể hiện sự hòa hợp âm dương, sự gắn kết bền chặt và hạnh phúc tròn đầy của đôi lứa.\n * **Hương vị mùa thu Hà Nội:** Bánh cốm gắn liền với con phố **Hàng Than (Hà Nội)** – nơi hội tụ những thương hiệu bánh cốm gia truyền hàng trăm năm tuổi.\n## 3. Cảm nhận hương vị & Cách thưởng thức\n * **Hương vị:** Khi cắn một miếng, bạn sẽ cảm nhận ngay độ **dẻo quánh, mềm mịn của vỏ cốm**, tỏa ra mùi thơm mộc mạc của lúa non, hòa quyện hoàn hảo với **vị bùi béo của đậu xanh, độ sần sật của dừa nạo** và vị ngọt thanh tao không bị gắt.\n * **Cách thưởng thức:** Bánh cốm ngon nhất khi thưởng thức cùng **một tách trà mạn nóng (trà sen, trà thái nguyên)**. Vị chát nhẹ, ấm áp của trà sẽ dằn lại vị ngọt của bánh, tôn lên hương thơm cốm tươi vô cùng tinh tế."},{"id":58,"cat":"cake","image":"https://i.ibb.co/b5LSp641/16de78b3b1ff1f1fb0967aa5a27582a8.jpg","name_vi":"Bánh pía","name":{"en":"Soc Trang Durian Pastry","zh":"薄饼(朔庄榴莲饼)","ja":"バインピア(ドリアン入り薄焼き菓子)","ko":"반삐아 (속짱 두리안페이스트리)"},"rating":5.0,"price":210000,"origin":"Việt Nam","spices":[{"vi":"Đường","price":1000},{"vi":"Muối","price":1000},{"vi":"Vani","price":2000},{"vi":"Mè rang","price":3000}],"sides":[{"vi":"Trà nóng","price":5000},{"vi":"Dừa sợi","price":5000},{"vi":"Hạt sen","price":5000},{"vi":"Đậu xanh","price":5000}],"short":{"en":"Flaky layered pastry from Soc Trang, filled with mung bean, durian and salted egg yolk.","zh":"朔庄特产多层酥皮饼，内馅为绿豆、榴莲与咸蛋黄。","ja":"ソクチャン名物のパイ生地菓子。緑豆やドリアン、塩漬け卵黄を包んでいる。","ko":"속짱 지역 명물 페이스트리. 녹두, 두리안, 짠 달걀노른자를 채운 겹겹의 과자."},"desc_vi":"Bánh pía là gì?\n**Bánh pía** (hay còn gọi là *Bánh lột da*) là món bánh đặc sản nổi tiếng bậc nhất của tỉnh **Sóc Trăng** (vùng sông nước Miền Tây Nam Bộ). Món bánh này có nguồn gốc từ người Hoa Triều Châu di cư sang Việt Nam từ thế kỷ 17, sau đó được người dân địa phương sáng tạo, biến tấu để trở thành một nét văn hóa ẩm thực độc đáo không thể lẫn vào đâu.\nMón bánh này thu hút bởi lớp **vỏ bánh xốp nhẹ xếp thành hàng chục lớp mỏng như giấy** ôm trọn phần **nhân sầu riêng, đậu xanh, trứng muối đậm đà, ngậy béo**.\n## 1. Tên gọi \"Bánh pía\" có nghĩa là gì?\nTừ **\"Pía\"** bắt nguồn từ âm đọc tiếng Triều Châu: **\"Pía\" (餅 - bỉnh)**, có nghĩa là **\"bánh\"**. Người Triều Châu gọi loại bánh này là *\"Thập cẩm pía\"*. Khi du nhập vào miền Tây, tên gọi được giản lược lại thành \"Bánh pía\".\nCòn tên gọi dân dã **\"Bánh lột da\"** xuất phát từ chính cấu trúc vỏ bánh: vỏ bánh dẻo mềm, gồm rất nhiều lớp bột mỏng dính vào nhau, khi ăn hoặc dùng tay kéo nhẹ có thể lột ra từng lớp skin (da) bánh mỏng dính.\n## 2. Thành phần chính & Cấu tạo đặc trưng\nMột chiếc bánh pía chuẩn vị Sóc Trăng được cấu thành từ 3 phần chính vô cùng tỉ mỉ:\n * **Vỏ bánh lột da (Nhiều lớp):** Cấu tạo gồm 2 loại bột: bột nước (bột mì, đường, mỡ heo/dầu) và bột dầu. Nhờ kỹ thuật cán và gập bột công phu, khi nướng lên vỏ bánh tạo thành từng **lớp mỏng dính xếp chồng lên nhau**, mềm xốp và béo nhẹ.\n * **Nhân bánh bùi dẻo:**\n   * **Sầu riêng tươi:** Thành phần \"linh hồn\" tạo nên mùi thơm nức đặc trưng của bánh pía Nam Bộ.\n   * **Đậu xanh / Khoai môn:** Đậu xanh đãi vỏ hoặc khoai môn hấp chín, sên dẻo mịn với đường.\n   * **Mỡ heo thái hạt lựu:** Mỡ heo ướp đường sên trong suốt giúp nhân bánh giữ được độ dẻo, ẩm ướt và không bị khô.\n * **Lòng đỏ trứng muối (Linh hồn béo mặn):** Chiếc bánh tròn đặt 1 hoặc 2 lòng đỏ trứng muối ở chính giữa. Vị mặn mòi, bùi ngậy của trứng muối giúp dằn lại vị ngọt của sầu riêng và đậu xanh, tạo sự cân bằng hoàn hảo.\n## 3. Các loại Bánh pía phổ biến\n| Loại bánh pía | Đặc điểm nổi bật |\n|---|---|\n| **Bánh pía Đậu xanh Sầu riêng Trứng muối** | Phiên bản **truyền thống & phổ biến nhất**. Sự kết hợp kinh điển giữa đậu xanh dẻo, sầu riêng thơm nức và trứng muối bùi bùi. |\n| **Bánh pía Khoai môn Sầu riêng** | Nhân khoai môn màu tím nhạt, vị bùi ngọt thanh dịu nhẹ hơn so với đậu xanh. |\n| **Bánh pía Chay** | Không dùng trứng muối và mỡ heo, thích hợp cho người ăn chay hoặc không thích vị mặn. |\n| **Bánh pía Kim sa (Biến tấu hiện đại)** | Bánh pía mini với nhân trứng muối chảy / phô mai / sầu riêng tan chảy sánh mịn béo ngậy bên trong. |\n## 4. Cảm nhận hương vị & Cách thưởng thức\n * **Hương vị:** Khi cắn một miếng bánh pía, bạn sẽ cảm nhận được độ **xốp mềm lột da của vỏ**, vị **ngọt dẻo bùi bùi của đậu xanh**, **mùi thơm nồng nàn quyến rũ của sầu riêng tươi** hòa quyện cùng vị **béo mặn bùi ngậy của trứng muối**.\n * **Cách thưởng thức chuẩn bài:** Bánh pía ngọt đậm và béo ngậy nên sẽ tròn vị nhất khi ăn kèm với **một tách trà mạn nóng (trà xanh, trà ôt long)**. Vị chát nhẹ của trà sẽ gột rửa độ béo, dằn vị ngọt và làm bật lên hương thơm sầu riêng tinh tế của bánh."},{"id":59,"cat":"dessert","image":"https://i.ibb.co/j1G0qqM/cacc9182b8cc656df9a80b26f7157584.jpg","name_vi":"Cà phê sữa đá","name":{"en":"Vietnamese Iced Milk Coffee","zh":"越南冰咖啡(炼奶冰咖啡)","ja":"カフェスアダー(練乳アイスコーヒー)","ko":"까페 쓰어다 (연유 아이스커피)"},"rating":4.6,"price":15000,"origin":"Việt Nam","spices":[{"vi":"Sữa đặc","price":5000},{"vi":"Đường","price":1000},{"vi":"Đá viên","price":2000},{"vi":"Cà phê","price":5000}],"sides":[{"vi":"Bánh mì ngọt","price":5000},{"vi":"Bánh quy","price":5000},{"vi":"Bánh tiêu","price":5000},{"vi":"Trà đá","price":2000}],"short":{"en":"Bold drip-brewed robusta coffee stirred with sweetened condensed milk and poured over ice.","zh":"浓郁滴滤罗布斯塔咖啡，拌入炼乳后加冰享用。","ja":"濃厚なロブスタ豆のドリップコーヒーに練乳を混ぜ、氷を注いだベトナムの定番アイスコーヒー。","ko":"진한 로부스타 드립커피에 연유를 섞어 얼음을 부은 베트남식 아이스커피."},"desc_vi":"Cà phê sữa đá là gì?\n**Cà phê sữa đá** là một thức uống giải khát bình dị, mang tính biểu tượng văn hóa sâu sắc và nổi tiếng bậc nhất của Việt Nam. Món uống này hấp dẫn bởi sự kết hợp hoàn hảo giữa vị **đắng đậm đà của cà phê pha phin truyền thống**, vị **béo ngậy ngọt ngào của sữa đặc** và cảm giác **sảng khoái, mát lạnh của đá viên**.\nKhông chỉ phổ biến trên khắp các con phố, từ quán vỉa hè đến các nhà hàng sang trọng tại Việt Nam, cà phê sữa đá còn nhiều lần được báo chí quốc tế tôn vinh là một trong những món cà phê ngon nhất thế giới.\n## 1. Thành phần chính & Cách pha chế \"chuẩn bài\"\nCà phê sữa đá có công thức rất tối giản nhưng lại đòi hỏi sự tinh tế trong việc chọn nguyên liệu và định lượng:\n * **Cà phê phin:** Thường dùng **cà phê Robusta** (hoặc phối trộn giữa Robusta và Arabica). Hạt Robusta Việt Nam có hàm lượng caffeine cao, vị đắng đậm, đậm đà và thoảng hương sô-cô-la/gỗ. Cà phê được chiết xuất chậm rãi qua chiếc **phin nhôm/inox** truyền thống để lấy được phần nước cốt đậm đặc nhất.\n * **Sữa đặc có đường:** Thay vì dùng sữa tươi và đường như cà phê phương Tây, người Việt dùng sữa đặc (như *Ông Thọ, Phương Nam*). Sữa đặc tạo độ ngọt đậm, độ béo sánh mịn đặc trưng và giúp cân bằng hoàn hảo với vị đắng gắt của Robusta.\n * **Đá viên:** Đá đập nhỏ hoặc đá viên lớn giúp làm lạnh nhanh, pha loãng nhẹ độ đậm đặc của cà phê và sữa khi uống.\n## 2. Trải nghiệm & Văn hóa thưởng thức\n * **Nghệ thuật \"chờ đợi\":** Hình ảnh ly thủy tinh có một lớp sữa đặc trắng ngần bên dưới, phía trên là chiếc phin nhôm đang thong thả nhiễu từng giọt cà phê đen quánh xuống đã trở thành nét đẹp nhịp sống chậm rất riêng của người Việt.\n * **Cảm nhận hương vị:** Sau khi cà phê chảy hết, dùng muỗng khuấy đều cho sữa và cà phê hòa quyện thành màu nâu sóng sánh, thả đá vào. Nhấp một ngụm, bạn sẽ cảm nhận ngay vị **mát lạnh tê lưỡi**, tiếp đến là vị **béo ngọt dịu** của sữa và đọng lại cuối cùng là vị **đắng thanh, thơm nồng lôi cuốn** của cà phê lưu lại nơi cổ họng.\n * **Văn hóa \"Cà phê bệt / Cà phê vỉa hè\":** Cà phê sữa đá xuất hiện ở mọi khoảnh khắc trong ngày: là món uống khởi đầu buổi sáng giúp tỉnh táo làm việc, là cái hẹn \"nhâm nhi\" cùng bạn bè giờ nghỉ trưa, hay món giải khát xế chiều bên không khí phố phường nhộn nhịp.\n## 3. Phân biệt theo Vùng miền\n * **Miền Nam (Sài Gòn):** Thường gọi ngắn gọn là **\"Sữa đá\"**. Cà phê sữa đá Sài Gòn thường có nhiều đá, pha nhiều sữa hơn một chút, vị ngọt béo rõ rệt và đựng trong ly to để vừa đi vừa uống hoặc nhâm nhi cả buổi.\n * **Miền Bắc (Hà Nội):** Thường gọi là **\"Nâu đá\"** (Cà phê nâu đá). Người Hà Nội thích vị cà phê đậm đà hơn, ít sữa hơn, ly nhỏ hơn và chú trọng vào hậu vị đắng thơm nguyên bản của hạt cà phê."},{"id":60,"cat":"dessert","image":"https://i.ibb.co/JWy1f8F6/05cfe863ce9708bde82fa4217e1bbb76.jpg","name_vi":"Cà phê trứng","name":{"en":"Egg Coffee","zh":"鸡蛋咖啡(河内蛋咖啡)","ja":"カフェチュン(卵コーヒー)","ko":"까페쯩 (달걀커피)"},"rating":4.7,"price":30000,"origin":"Việt Nam","spices":[{"vi":"Trứng gà","price":5000},{"vi":"Sữa đặc","price":5000},{"vi":"Đường","price":1000},{"vi":"Cà phê","price":5000}],"sides":[{"vi":"Bánh quy","price":5000},{"vi":"Bánh ngọt","price":10000},{"vi":"Trà nóng","price":5000},{"vi":"Bánh mì ngọt","price":5000}],"short":{"en":"A Hanoi original: whipped egg yolk and condensed milk forming a custardy cream over hot black coffee.","zh":"河内独创，蛋黄与炼乳打发成绵密奶油，覆于热黑咖啡之上。","ja":"ハノイ発祥。卵黄と練乳を泡立てたクリームを、熱いブラックコーヒーの上にのせた一杯。","ko":"하노이에서 탄생한 커피. 달걀노른자와 연유를 휘핑한 크림을 뜨거운 블랙커피 위에 얹은 음료."},"desc_vi":"Cà phê trứng là gì?\n**Cà phê trứng** là một loại thức uống độc đáo và nổi tiếng của Việt Nam, đặc biệt gắn liền với văn hóa ẩm thực Hà Nội. Đây là sự kết hợp tinh tế giữa vị đắng đặc trưng của cà phê nguyên chất và vị béo ngậy, thơm mịn của lớp kem trứng.\n## 1. Nguồn gốc\nCà phê trứng ra đời vào khoảng những năm **1940** tại Hà Nội, do ông **Nguyễn Văn Giang** – cựu pha chế tại khách sạn Sofitel Legend Metropole – sáng tạo ra. Trong thời kỳ khan hiếm sữa tươi, ông đã dùng lòng đỏ trứng gà đánh bông để thay thế, tạo nên món thức uống độc đáo còn lưu giữ đến ngày nay tại thương hiệu *Cà phê Giảng*.\n## 2. Thành phần & Cách chế biến\nMột ly cà phê trứng chuẩn vị gồm các nguyên liệu chính:\n * **Lòng đỏ trứng gà tươi**\n * **Sữa đặc và đường** (đôi khi có thêm chút mật ong hoặc vani)\n * **Cà phê phin đậm đà** (thường dùng hạt Robusta)\n**Cách làm cơ bản:**\n 1. Lòng đỏ trứng được đánh bông cùng sữa đặc và đường bằng máy hoặc phới đánh trứng cho đến khi chuyển sang màu vàng nhạt, bông mịn và mất hoàn toàn mùi tanh.\n 2. Cà phê phin được pha nóng.\n 3. Rót cà phê nóng vào ly, sau đó từ từ phủ lớp kem trứng đánh bông lên trên.\n## 3. Hương vị & Cách thưởng thức\n * **Hương vị:** Lớp kem trứng phía trên mịn màng, béo ngậy như custard (kem trứng kiểu Tây) nhưng không hề bị tanh, kết hợp hài hòa với vị đắng, đậm đà của cà phê nóng phía dưới.\n * **Cách thưởng thức:**\n   * Cà phê trứng thường được đặt trong một bát nước nóng để giữ ấm suốt quá trình uống.\n   * Người ta thường dùng thìa nhỏ nếm thử lớp kem trứng trước, hoặc khuấy nhẹ từ dưới lên để hòa quyện hai tầng hương vị."}];

// ============================================================
// QR code encoder — byte mode, versions 1-4, ECC level L, mask 0
// (verified via RS-syndrome, codeword round-trip and format-info
//  round-trip checks during development)
// ============================================================
function qrEncode(text){
  const bytes = Array.from(new TextEncoder().encode(text));
  const CAP = { 1:{total:26,ec:7,data:19}, 2:{total:44,ec:10,data:34}, 3:{total:70,ec:15,data:55}, 4:{total:100,ec:20,data:80} };
  let version = null;
  for(const v of [1,2,3,4]){
    const neededBytes = Math.ceil((12 + bytes.length*8)/8);
    if(neededBytes <= CAP[v].data){ version = v; break; }
  }
  if(!version) return null; // too long — caller should fall back

  const {data:dataCw, ec:ecCw} = CAP[version];
  const size = version*4 + 17;

  let bits = [];
  const pushBits = (val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  pushBits(0b0100,4); pushBits(bytes.length,8);
  for(const b of bytes) pushBits(b,8);
  let termLen = Math.min(4, dataCw*8 - bits.length);
  if(termLen>0) pushBits(0,termLen);
  while(bits.length%8!==0) bits.push(0);
  let codewords=[];
  for(let i=0;i<bits.length;i+=8){ let byte=0; for(let j=0;j<8;j++) byte=(byte<<1)|bits[i+j]; codewords.push(byte); }
  const padSeq=[0xEC,0x11]; let pi=0;
  while(codewords.length<dataCw){ codewords.push(padSeq[pi%2]); pi++; }

  const EXP=new Array(512), LOG=new Array(256);
  let xx=1;
  for(let i=0;i<255;i++){ EXP[i]=xx; LOG[xx]=i; xx<<=1; if(xx&0x100) xx^=0x11D; }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const gmul=(a,b)=> (a===0||b===0) ? 0 : EXP[LOG[a]+LOG[b]];

  let gen=[1];
  for(let i=0;i<ecCw;i++){
    let next=new Array(gen.length+1).fill(0);
    for(let j=0;j<gen.length;j++){ next[j]^=gen[j]; next[j+1]^=gmul(gen[j],EXP[i]); }
    gen=next;
  }
  let msg=codewords.slice(); for(let i=0;i<ecCw;i++) msg.push(0);
  for(let i=0;i<dataCw;i++){
    const coef=msg[i]; if(coef===0) continue;
    const factor=LOG[coef];
    for(let j=0;j<gen.length;j++) msg[i+j]^=gmul(gen[j],EXP[factor]);
  }
  const ecCodewords = msg.slice(dataCw, dataCw+ecCw);
  const allCodewords = codewords.concat(ecCodewords);

  const M = Array.from({length:size},()=>new Array(size).fill(0));
  const RES = Array.from({length:size},()=>new Array(size).fill(false));
  const setFn=(r,c,val)=>{ if(r<0||c<0||r>=size||c>=size) return; M[r][c]=val; RES[r][c]=true; };
  const placeFinder=(r0,c0)=>{
    for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){
      const rr=r0+r, cc=c0+c; if(rr<0||cc<0||rr>=size||cc>=size) continue;
      let val;
      if(r>=0&&r<=6&&c>=0&&c<=6 && (r===0||r===6||c===0||c===6)) val=1;
      else if(r>=2&&r<=4&&c>=2&&c<=4) val=1; else val=0;
      setFn(rr,cc,val);
    }
  };
  placeFinder(0,0); placeFinder(0,size-7); placeFinder(size-7,0);
  for(let i=8;i<size-8;i++){ setFn(6,i,i%2===0?1:0); setFn(i,6,i%2===0?1:0); }
  if(version>=2){
    const X=size-7;
    for(let r=-2;r<=2;r++) for(let c=-2;c<=2;c++){
      let val; if(Math.abs(r)===2||Math.abs(c)===2) val=1; else if(r===0&&c===0) val=1; else val=0;
      setFn(X+r,X+c,val);
    }
  }
  setFn(size-8,8,1);
  for(let i=0;i<9;i++){ RES[8][i]=true; RES[i][8]=true; }
  for(let i=0;i<8;i++){ RES[8][size-1-i]=true; RES[size-1-i][8]=true; }

  let dataBits=[]; for(const cw of allCodewords) for(let i=7;i>=0;i--) dataBits.push((cw>>i)&1);
  let bitIdx=0; const nextBit=()=> bitIdx<dataBits.length ? dataBits[bitIdx++] : 0;
  let col=size-1, dirUp=true;
  while(col>0){
    if(col===6) col--;
    for(let k=0;k<size;k++){
      const row = dirUp ? size-1-k : k;
      for(const c of [col,col-1]){
        if(RES[row][c]) continue;
        const bit=nextBit();
        const maskCond=(row+c)%2===0;
        M[row][c]= bit ^ (maskCond?1:0);
      }
    }
    dirUp=!dirUp; col-=2;
  }

  const fmtData=(0b01<<3)|0; // ECC level L, mask 0
  let val15=fmtData<<10;
  for(let i=14;i>=10;i--){ if((val15>>i)&1) val15 ^= (0b10100110111 << (i-10)); }
  let fmtBits15=(fmtData<<10)|val15;
  fmtBits15 ^= 0b101010000010010;
  const copyA=[[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];
  const copyB=[[8,size-1],[8,size-2],[8,size-3],[8,size-4],[8,size-5],[8,size-6],[8,size-7],[8,size-8],
               [size-7,8],[size-6,8],[size-5,8],[size-4,8],[size-3,8],[size-2,8],[size-1,8]];
  for(let i=0;i<15;i++){
    const bv=(fmtBits15>>(14-i))&1;
    M[copyA[i][0]][copyA[i][1]]=bv; M[copyB[i][0]][copyB[i][1]]=bv;
  }
  return {size, matrix:M};
}

function renderQRtoCanvas(canvas, text, opts){
  opts = opts||{};
  const q = qrEncode(text);
  const ctx = canvas.getContext('2d');
  if(!q){ ctx.font='12px sans-serif'; ctx.fillText('QR unavailable', 10, 20); return; }
  const quiet = 4;
  const modules = q.size + quiet*2;
  const px = Math.max(4, Math.floor((opts.size||240) / modules));
  const dim = modules*px;
  canvas.width = dim; canvas.height = dim;
  ctx.fillStyle = opts.light || '#ffffff';
  ctx.fillRect(0,0,dim,dim);
  ctx.fillStyle = opts.dark || '#1B1712';
  for(let r=0;r<q.size;r++) for(let c=0;c<q.size;c++){
    if(q.matrix[r][c]===1) ctx.fillRect((c+quiet)*px,(r+quiet)*px,px,px);
  }
}

// State + persistence
// ============================================================
const LS_KEY = 'pfvn_state_v1';

function detectSystemLang(){
  const nav = (navigator.language||'vi').toLowerCase();
  if(nav.startsWith('vi')) return 'vi';
  if(nav.startsWith('zh')) return 'zh';
  if(nav.startsWith('ja')) return 'ja';
  if(nav.startsWith('ko')) return 'ko';
  if(nav.startsWith('en')) return 'en';
  return 'vi';
}

function defaultState(){
  return {
    settings:{
      theme:'system', font:'system', fontSize:1, language:detectSystemLang(),
      sort:'default', ribbonCollapsed:false, installed:false,
    },
    cart:[],       // {uid, dishId, qty, spiceIds:[], sideIds:[], selected, addedAt}
    drafts:[],     // {uid, items:[...cart items...], savedAt}
    orders:[],     // {code, items:[{dishId,qty,spiceIds,sideIds,unitPrice}], total, address, payment, status, createdAt, etaMinutes, statusAt:{}, }
    recentlyViewed:[], // {dishId, viewedAt}
  };
}

let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    return {
      settings:Object.assign(d.settings, parsed.settings||{}),
      cart:parsed.cart||[],
      drafts:parsed.drafts||[],
      orders:parsed.orders||[],
      recentlyViewed:parsed.recentlyViewed||[],
    };
  }catch(e){
    return defaultState();
  }
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){ /* storage full/unavailable — app still works this session */ }
  }, 80);
}

function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function genOrderCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='PF-';
  for(let i=0;i<3;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  s+='-';
  for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

    return '₫' + Math.round(vnd).toLocaleString('vi-VN');
  }
  const val = vnd*fx.rate;
  const rounded = fx.decimals===0 ? Math.round(val) : Math.round(val*100)/100;
  const numStr = fx.decimals===0 ? rounded.toLocaleString('en-US') : rounded.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return fx.pos==='before' ? fx.symbol+numStr : numStr+fx.symbol;
}
function approxNote(vnd, lang){
  lang = lang || STATE.settings.language;
  if(lang==='vi') return '';
  return '≈ ₫'+Math.round(vnd).toLocaleString('vi-VN');
}

// ---------- cart helpers ----------
function cartAdd(dishId, qty, spiceIds, sideIds){
  const existing = STATE.cart.find(it=>it.dishId===dishId && sameSet(it.spiceIds,spiceIds) && sameSet(it.sideIds,sideIds));
  if(existing){ existing.qty += qty; }
  else{ STATE.cart.push({uid:uid(), dishId, qty, spiceIds:spiceIds||[], sideIds:sideIds||[], selected:true, addedAt:Date.now()}); }
  saveState();
}
function sameSet(a,b){ a=a||[]; b=b||[]; if(a.length!==b.length) return false; const sa=[...a].sort(), sb=[...b].sort(); return sa.every((v,i)=>v===sb[i]); }
function cartRemove(cartUid){ STATE.cart = STATE.cart.filter(it=>it.uid!==cartUid); saveState(); }
function cartSetQty(cartUid, qty){
  const it = STATE.cart.find(i=>i.uid===cartUid); if(!it) return;
  it.qty = Math.max(1, qty); saveState();
}
function cartToggleSelect(cartUid){ const it=STATE.cart.find(i=>i.uid===cartUid); if(it){ it.selected=!it.selected; saveState(); } }
function cartSelectAll(val){ STATE.cart.forEach(it=>it.selected=val); saveState(); }
function cartCount(){ return STATE.cart.reduce((s,it)=>s+it.qty,0); }
function cartItemUnitPrice(it){
  const d = getDish(it.dishId); if(!d) return 0;
  let p = d.price;
  (it.spiceIds||[]).forEach(sid=>{ const sp=d.spices.find(s=>s.vi===sid); if(sp) p+=sp.price; });
  (it.sideIds||[]).forEach(sid=>{ const sd=d.sides.find(s=>s.vi===sid); if(sd) p+=sd.price; });
  return p;
}
function cartLineTotal(it){ return cartItemUnitPrice(it)*it.qty; }
function cartSelectedTotal(){ return STATE.cart.filter(it=>it.selected).reduce((s,it)=>s+cartLineTotal(it),0); }
function cartSelectedItems(){ return STATE.cart.filter(it=>it.selected); }
function cartSelectedCount(){ return cartSelectedItems().reduce((s,it)=>s+it.qty,0); }

// ---------- orders ----------
function placeOrder(items, address, payment, lang){
  const code = genOrderCode();
  const orderItems = items.map(it=>({dishId:it.dishId, qty:it.qty, spiceIds:it.spiceIds, sideIds:it.sideIds, unitPrice:cartItemUnitPrice(it)}));
  const total = orderItems.reduce((s,it)=>s+it.unitPrice*it.qty,0);
  const etaMinutes = 18 + Math.floor(Math.random()*23); // 18-40 min, feels real
  const order = {
    code, items:orderItems, total, address, payment, status:'confirming',
    createdAt:Date.now(), etaMinutes, statusAt:{confirming:Date.now()},
  };
  STATE.orders.unshift(order);

function advanceOrderStatus(code, status){

  o.status = status; o.statusAt[status]=Date.now(); saveState();
}

const FLAGS = { vi:'🇻🇳', en:'🇺🇸', zh:'🇨🇳', ja:'🇯🇵', ko:'🇰🇷' };
const LANG_LABELS = { vi:'Tiếng Việt', en:'English', zh:'中文', ja:'日本語', ko:'한국어' };

function relTime(ts, lang){
  lang = lang || STATE.settings.language;
  const diffSec = Math.max(0, Math.floor((Date.now()-ts)/1000));
  const units = [
    [60,'sec'], [3600,'min'], [86400,'hr'], [86400*30,'day'], [86400*365,'mo'],
  ];
  const LABELS = {
    vi:{sec:'giây',min:'phút',hr:'giờ',day:'ngày',mo:'tháng', ago:'trước', now:'Vừa xong'},
    en:{sec:'s',min:'m',hr:'h',day:'d',mo:'mo', ago:'ago', now:'Just now'},
    zh:{sec:'秒',min:'分钟',hr:'小时',day:'天',mo:'个月', ago:'前', now:'刚刚'},
    ja:{sec:'秒',min:'分',hr:'時間',day:'日',mo:'ヶ月', ago:'前', now:'たった今'},
    ko:{sec:'초',min:'분',hr:'시간',day:'일',mo:'개월', ago:'전', now:'방금'},
  };
  const L = LABELS[lang]||LABELS.vi;
  if(diffSec<45) return L.now;
  if(diffSec<3600){ const m=Math.floor(diffSec/60); return `${m} ${L.min} ${L.ago}`; }
  if(diffSec<86400){ const h=Math.floor(diffSec/3600); return `${h} ${L.hr} ${L.ago}`; }
  if(diffSec<86400*30){ const dd=Math.floor(diffSec/86400); return `${dd} ${L.day} ${L.ago}`; }
  const mo=Math.floor(diffSec/(86400*30)); return `${mo} ${L.mo} ${L.ago}`;
}

function formatClock(ts, lang){
  const d = new Date(ts);
  const localeMap = {vi:'vi-VN', en:'en-US', zh:'zh-CN', ja:'ja-JP', ko:'ko-KR'};
  return d.toLocaleTimeString(localeMap[lang]||localeMap[STATE.settings.language]||'vi-VN', {hour:'2-digit',minute:'2-digit'});
}

// ============================================================
// Lightweight markdown renderer for the sourced Vietnamese descriptions
// Supports: **bold**, ## heading, blank-indent * bullets (2 levels), > blockquote, paragraphs
// ============================================================
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function renderMarkdownVi(raw){
  const lines = raw.split('\n');
  let html = '';
  let listStack = []; // stack of {level, html}
  let inQuote = false; let quoteBuf = [];
  let para = [];

  function flushPara(){
    if(para.length){ html += `<p>${inlineMd(escapeHtml(para.join(' ')))}</p>`; para=[]; }
  }
  function closeLists(){
    while(listStack.length){ const top=listStack.pop(); html += top.close; }
  }
  function flushQuote(){
    if(quoteBuf.length){ html += `<blockquote>${inlineMd(escapeHtml(quoteBuf.join(' ')))}</blockquote>`; quoteBuf=[]; }
    inQuote=false;
  }

  // Since bullets need proper nested <ul>, do a two-pass: build a simple tree by tracking indent levels via a stack of <ul> open tags.
  let ulOpen = []; // depths currently open, values = indent-level

  function closeULsTo(level){
    while(ulOpen.length && ulOpen[ulOpen.length-1] >= level){ html += '</li></ul>'; ulOpen.pop(); }
    if(ulOpen.length){ html += '</li>'; }
  }

  for(let raw_line of lines){
    const line = raw_line;
    const trimmed = line.trim();

    const bulletMatch = line.match(/^(\s*)\*\s+(.*)$/);
    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    const headMatch = trimmed.match(/^##\s+(.*)$/);

    if(bulletMatch){
      flushPara(); flushQuote();
      const indent = bulletMatch[1].length;
      const level = indent >= 2 ? 1 : 0;
      const text = bulletMatch[2];
      if(ulOpen.length===0 || level > ulOpen[ulOpen.length-1]){
        html += '<ul>';
        html += `<li>${inlineMd(escapeHtml(text))}`;
        ulOpen.push(level);
      } else {
        // close deeper/equal levels first
        while(ulOpen.length && ulOpen[ulOpen.length-1] > level){ html += '</li></ul>'; ulOpen.pop(); }
        if(ulOpen.length && ulOpen[ulOpen.length-1] === level){
          html += `</li><li>${inlineMd(escapeHtml(text))}`;
        } else {
          html += '<ul>'; html += `<li>${inlineMd(escapeHtml(text))}`; ulOpen.push(level);
        }
      }
      continue;
    } else if(ulOpen.length){
      while(ulOpen.length){ html += '</li></ul>'; ulOpen.pop(); }
    }

    if(quoteMatch){
      flushPara();
      if(trimmed === '>' || quoteMatch[1]===''){ /* blank quote line = end of blockquote paragraph, ignore */ continue; }
      quoteBuf.push(quoteMatch[1]);
      inQuote = true;
      continue;
    } else if(inQuote){
      flushQuote();
    }

    if(headMatch){
      flushPara(); flushQuote();
      html += `<h3>${inlineMd(escapeHtml(headMatch[1]))}</h3>`;
      continue;
    }

    if(trimmed===''){
      flushPara();
      continue;
    }

    para.push(trimmed);
  }
  flushPara(); flushQuote();
  while(ulOpen.length){ html += '</li></ul>'; ulOpen.pop(); }
  return html;
}

function starsHtml(rating){
  let s='';
  for(let i=1;i<=5;i++){
    if(rating >= i-0.25) s += ICON.star;
    else if(rating >= i-0.75) s += ICON.starHalf;
    else s += `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35"><path d="M10 1.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L1.4 7.8l6-.7z"/></svg>`;
  }
  return `<span class="stars">${s}</span>`;
}

// ============================================================
// Router — simple stack-based navigation with back support
// ============================================================
let NAV_STACK = [{view:'home', params:{}}];
let CURRENT_CATEGORY = 'all';
let CURRENT_SEARCH = '';
let CURRENT_SORT = 'default';
let DETAIL_STATE = {}; // per-open-detail transient selection state, keyed by dishId

function currentView(){ return NAV_STACK[NAV_STACK.length-1]; }

function navigateTo(view, params, opts){
  params = params||{}; opts = opts||{};
  if(!opts.replace){ NAV_STACK.push({view, params}); }
  else { NAV_STACK[NAV_STACK.length-1] = {view, params}; }
  try{ history.pushState({depth:NAV_STACK.length}, '', '#'+view); }catch(e){}
  renderCurrentView();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

function goBack(){
  if(NAV_STACK.length>1){ NAV_STACK.pop(); renderCurrentView(); window.scrollTo(0,0); }
  else{ /* already at root */ }
}

window.addEventListener('popstate', ()=>{
  if(NAV_STACK.length>1){ NAV_STACK.pop(); renderCurrentView(); }
});

function renderCurrentView(){
  const {view, params} = currentView();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el = document.getElementById('page-'+view);
  if(el) el.classList.add('active');

  closeAllSheets();

  if(view==='home') renderHome();
  else if(view==='category') renderCategoryPage(params.cat);
  else if(view==='detail') renderDetailPage(params.id);
  else if(view==='cart') renderCartPage();
  else if(view==='checkout') renderCheckoutPage();
  else if(view==='tracking') renderTrackingPage(params.code);
  else if(view==='orders') renderOrdersPage(params.tab);
  else if(view==='recent') renderRecentPage();

  refreshHeaderBadges();
}

function refreshHeaderBadges(){
  document.querySelectorAll('.js-cart-badge').forEach(b=>{
    const n = cartCount();
    b.textContent = n>99?'99+':n;
    b.style.display = n>0 ? 'flex':'none';
  });
}

function getFilteredSortedDishes(cat, search, sort){
  let list = DISHES.slice();
  if(cat && cat!=='all') list = list.filter(d=>d.cat===cat);
  if(search && search.trim()){
    const q = search.trim().toLowerCase();
    list = list.filter(d=>{
      const n1 = d.name_vi.toLowerCase();
      const n2 = (dishName(d)||'').toLowerCase();
      return n1.includes(q) || n2.includes(q);
    });
  }
  if(sort==='price_desc') list.sort((a,b)=>b.price-a.price);
  else if(sort==='price_asc') list.sort((a,b)=>a.price-b.price);
  else if(sort==='rating_desc') list.sort((a,b)=>b.rating-a.rating);
  return list;
}

let countAnimated = false;
function animatedCountTarget(target){
  if(countAnimated) return target;
  countAnimated = true;
  const el = ()=>document.getElementById('dishCountNum');
  let cur = 0;
  const step = ()=>{
    cur += Math.max(1, Math.ceil(target/24));
    if(cur>=target){ if(el()) el().textContent = target; return; }
    if(el()) el().textContent = cur;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return 0;
}

function wireDetailPage(d, ds){
  const page = document.getElementById('page-detail');
  // back + cart-nav buttons use [data-back]/[data-goto-cart] which are handled by
  // the global document-level delegation in wireGlobalDelegation() — do not
  // attach page-specific listeners here too, or clicks fire twice.

  page.querySelectorAll('.detail-thumb').forEach(th=>{
    th.addEventListener('click', ()=>{
      page.querySelectorAll('.detail-thumb').forEach(x=>x.classList.remove('is-active'));
      th.classList.add('is-active');
    });
  });

  const descToggle = page.querySelector('#descToggle');
  if(descToggle){
    descToggle.addEventListener('click', ()=>{
      ds.descOpen = !ds.descOpen;
      descToggle.classList.toggle('open', ds.descOpen);
      page.querySelector('#descBody').classList.toggle('open', ds.descOpen);
    });
  }

  function toggleChip(group, id){
    const isNone = id==='none';
    if(isNone){ group.length = 0; group.push('none'); }
    else{
      const noneIdx = group.indexOf('none'); if(noneIdx>-1) group.splice(noneIdx,1);
      const idx = group.indexOf(id);
      if(idx>-1) group.splice(idx,1); else group.push(id);
    }
  }
  const spiceWrap = page.querySelector('#spiceChips');
  if(spiceWrap){
    spiceWrap.addEventListener('click', (e)=>{
      const chip = e.target.closest('[data-chip]'); if(!chip) return;
      toggleChip(ds.spiceIds, chip.dataset.chip);
      spiceWrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-selected'));
      spiceWrap.querySelectorAll('.chip').forEach(c=>{
        const cid = c.dataset.chip;
        if(ds.spiceIds.includes(cid)) c.classList.add('is-selected');
      });
    });
  }
  const sideWrap = page.querySelector('#sideChips');
  if(sideWrap){
    sideWrap.addEventListener('click', (e)=>{
      const chip = e.target.closest('[data-chip]'); if(!chip) return;
      toggleChip(ds.sideIds, chip.dataset.chip);
      sideWrap.querySelectorAll('.chip').forEach(c=>{
        const cid = c.dataset.chip;
        c.classList.toggle('is-selected', ds.sideIds.includes(cid));
      });
    });
  }

  function syncQty(){
    page.querySelectorAll('#detailQty,#detailQtyMobile').forEach(e=>e.textContent=ds.qty);
  }
  page.querySelectorAll('[data-step]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const delta = parseInt(btn.dataset.step,10);
      ds.qty = Math.max(1, Math.min(99, ds.qty+delta));
      syncQty();
    });
  });

  function currentSelection(){
    const spiceIds = ds.spiceIds.filter(x=>x!=='none');
    const sideIds = ds.sideIds.filter(x=>x!=='none');
    return {spiceIds, sideIds};
  }

  page.querySelectorAll('[data-action="add-cart"]').forEach(btn=>btn.addEventListener('click', ()=>{
    const {spiceIds, sideIds} = currentSelection();
    cartAdd(d.id, ds.qty, spiceIds, sideIds);
    refreshHeaderBadges();
    toastShow(t('added_to_cart_toast'), 'cart');
  }));
  page.querySelectorAll('[data-action="buy-now"]').forEach(btn=>btn.addEventListener('click', ()=>{
    const {spiceIds, sideIds} = currentSelection();
    cartAdd(d.id, ds.qty, spiceIds, sideIds);
    // select only this line, deselect rest for a focused "buy now" checkout
    const line = STATE.cart[STATE.cart.length-1];
    STATE.cart.forEach(it=>it.selected = (it===line));
    saveState();
    navigateTo('checkout');
  }));
}

// Order tracking — signature moment: animated moto on a city map
// Route verified analytically to stay within street corridors
// (never crosses a building rect) — see design notes.

const SIM_MS = { confirming: 3000, picking: 4000, delivering: 24000 };
const ROUTE_D = "M 8 8 L 8 77 L 108 77 L 108 148 L 212 148 L 212 216 L 312 216";

function computeOrderProgress(order){
  if(order.status==='delivered') return {status:'delivered', frac:1};
  const elapsed = Date.now() - order.createdAt;
  const t1 = SIM_MS.confirming, t2 = t1+SIM_MS.picking, t3 = t2+SIM_MS.delivering;
  if(elapsed < t1) return {status:'confirming', frac:elapsed/t1};
  if(elapsed < t2) return {status:'picking', frac:(elapsed-t1)/SIM_MS.picking};
  if(elapsed < t3) return {status:'delivering', frac:(elapsed-t2)/SIM_MS.delivering};
  return {status:'delivered', frac:1};
}
