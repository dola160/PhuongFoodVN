ếng Bá Lễ:** Nước dùng để nhào bột phải lấy từ giếng cổ Bá Lễ nổi tiếng ở Hội An thì mì mới đạt được hương vị chuẩn nhất.\n * **Cách nấu sợi mì:** Không luộc như các loại mì/phở thông thường, sợi mì Cao lầu được **hấp chín**, giúp mì giữ được độ nhảy, sần sật và không bị bở.\n### 3. Thành phần của một bát Cao lầu chuẩn vị\nMột bát Cao lầu ngon là sự hòa quyện tuyệt vời của nhiều tầng hương vị và màu sắc:\n * **Thịt xá xíu:** Thịt heo đùi săn chắc được ướp ngũ vị hương, nước tương, gia vị đậm đà rồi khìa lửa nhỏ, sau đó thái lát mỏng.\n * **Nước sốt (nước xíu):** Cao lầu không dùng nước lèo ngập bát mà chỉ rưới vài muỗng nước kho thịt xá xíu đậm đà, thơm lừng lên trên.\n * **Mì giòn (da heo/bột mì chiên):** Món ăn được nhấn nhá bằng những miếng bột mì chiên giòn rụm (hoặc da heo chiên giòn).\n * **Rau sống:** Ăn kèm với rau sống đắng, đắng nhẹ và thơm đặc trưng của làng rau Trà Quế nổi tiếng.\n> **So sánh nhanh Cao lầu & Mì Quảng:**\n>  * **Cao lầu:** Sợi mì dày, dai sần sật (do hấp với nước tro); ăn kèm thịt xá xíu, bột chiên giòn và rưới rất ít nước sốt thịt khìa.\n>  * **Mì Quảng:** Sợi mì mềm, dẹt; phần nhân đa dạng (tôm, thịt, gà, ếch); ăn kèm bánh tráng nướng, đậu phộng và nước dùng kho đậm đà.\n>"},{"id":18,"cat":"noodle","image":"https://i.ibb.co/SDWdCf5N/c7cc7e1f51fe68fac7fe95ae4c55afd7-1.jpg","name_vi":"Hủ tiếu","name":{"en":"Southern Rice Noodle Soup","zh":"粿条汤(南越粿条)","ja":"フーティウ(南部風米麺スープ)","ko":"후띠에우 (남부식 쌀국수)"},"rating":4.2,"price":20000,"origin":"Việt Nam","spices":[{"vi":"Chanh","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Nước tương","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Giá đỗ","price":5000},{"vi":"Hẹ","price":2000},{"vi":"Rau xà lách","price":3000},{"vi":"Tỏi phi","price":3000}],"short":{"en":"A light, clear pork-broth noodle soup from southern Vietnam, topped with shrimp, pork and crisp fried shallots.","zh":"越南南部清汤粿条，猪骨清汤配虾仁、猪肉与炸葱头。","ja":"南部ベトナムの澄んだ豚骨スープ麺。エビ、豚肉、揚げエシャロットをトッピング。","ko":"베트남 남부의 맑은 돼지육수 국수. 새우, 돼지고기, 튀긴 샬롯을 얹어낸다."},"desc_vi":"Hủ tiếu là gì?\n**Hủ tiếu** (hay hủ tíu) là một món ăn truyền thống vô cùng phổ biến trong ẩm thực Việt Nam, đặc biệt là ở khu vực Nam Bộ. Món ăn này có nguồn gốc từ ẩm thực Triều Châu (Trung Hoa), sau đó du nhập vào Việt Nam và qua thời gian đã biến tấu để thích nghi hoàn toàn với hương vị cũng như thổ nhưỡng người Việt.\n## 1. Thành phần chính\nMột tô hủ tiếu tiêu chuẩn thường gồm 3 thành phần cơ bản:\n * **Sợi hủ tiếu:** Làm từ tinh bột gạo, có dạng sợi nhỏ, mảnh hơn phở. Tùy từng biến tấu mà sợi hủ tiếu có thể dai (hủ tiếu Mỹ Tho, Nam Vang) hoặc mềm (hủ tiếu hấp, hủ tiếu truyền thống Triều Châu).\n * **Nước dùng (nước lèo):** Ninh chủ yếu từ xương heo, mực khô, tôm khô và củ cải trắng để tạo vị ngọt thanh tự nhiên, trong và đậm đà.\n * **Topping & Rau ăn kèm:**\n   * *Topping:* Thịt heo bằm, thịt xá xíu, tôm, mực, gan heo, trứng cút, giò heo, bò viên...\n   * *Rau ăn kèm:* Giá đỗ, hẹ, tần ô (cúc tần), giá sống, xà lách, chanh, ớt và mắm ớt.\n## 2. Các hình thức thưởng thức\nHủ tiếu có hai cách ăn phổ biến nhất:\n 1. **Hủ tiếu nước:** Trụng chín sợi hủ tiếu, cho topping lên trên rồi chan ngập nước dùng nóng hổi.\n 2. **Hủ tiếu khô:** Sợi hủ tiếu được trộn đều với sốt sệt đặc trưng (vị mặn ngọt, béo ngậy), xếp topping lên trên và phục vụ kèm một chén nước dùng riêng.\n## 3. Một số biến tấu hủ tiếu nổi tiếng\n| Tên món hủ tiếu | Đặc điểm nổi bật |\n|---|---|\n| **Hủ tiếu Nam Vang** | Nguồn gốc từ Phnom Penh (Campuchia), đặc trưng với thịt bằm, tôm, gan, trứng cút và nước dùng đậm đà thơm mùi tỏi phi. |\n| **Hủ tiếu Mỹ Tho** | Dùng loại sợi hủ tiếu khô đặc sản của Tiền Giang có độ dai, giòn nhẹ và thơm mùi gạo rất riêng. |\n| **Hủ tiếu Sa Đéc** | Sợi hủ tiếu đét, to và mềm dẻo đặc trưng của vùng Đồng Tháp, nổi tiếng nhất là phiên bản hủ tiếu khô sốt đậm đà. |\n| **Hủ tiếu Bò Viên / Gõ** | Phong cách bình dân gắn liền với đời sống đô thị (đặc biệt là Sài Gòn), thường bán trên các xe đẩy đêm. |"},{"id":19,"cat":"noodle","image":"https://i.ibb.co/spgKS18L/d78f619fbe39f158c603913851de47d6.jpg","name_vi":"Hủ tiếu Nam Vang","name":{"en":"Phnom Penh-style Noodle Soup","zh":"金边粿条","ja":"フーティウ・ナムヴァン(プノンペン風麺)","ko":"후띠에우 남방 (프놈펜식 쌀국수)"},"rating":4.4,"price":70000,"origin":"Việt Nam","spices":[{"vi":"Chanh","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Nước tương","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Hẹ","price":2000},{"vi":"Giá đỗ","price":5000},{"vi":"Tỏi phi","price":3000},{"vi":"Rau xà lách","price":3000}],"short":{"en":"A richer cousin of hu tieu, loaded with pork, liver, shrimp, squid and quail egg in a deeply savory broth.","zh":"比粿条汤更丰盛，加入猪肝、虾、鱿鱼与鹌鹑蛋，汤头浓郁鲜美。","ja":"フーティウをさらに豪華にした一杯。レバーやエビ、イカ、うずらの卵が入る濃厚なスープ。","ko":"후띠에우보다 더 푸짐한 버전. 돼지간, 새우, 오징어, 메추리알이 들어간 깊은 맛의 국수."},"desc_vi":"Hủ tiếu Nam Vang là gì?\n**Hủ tiếu Nam Vang** là một trong những biến tấu nổi tiếng và phổ biến nhất của món hủ tiếu tại Nam Bộ, đặc biệt là ở Sài Gòn. Món ăn này có một \"hành trình ẩm thực\" rất thú vị: xuất xứ từ Triều Châu (Trung Quốc), du nhập sang Phnom Penh (Cambodia – mà người Việt xưa gọi là **Nam Vang**), sau đó được người Việt chế biến lại cho phù hợp với khẩu vị địa phương.\n## 1. Điểm đặc trưng làm nên thương hiệu\nKhác với các loại hủ tiếu khác, một tô hủ tiếu Nam Vang đúng chuẩn thường có những nét rất riêng:\n * **Thịt heo bằm:** Đây là thành phần không thể thiếu. Thịt bằm được tơi mịn trong nước dùng, tạo nên độ ngọt béo nhẹ bám đều vào từng sợi hủ tiếu.\n * **Topping phong phú:** Ngoài thịt bằm, một tô đầy đủ thường có tôm tươi luộc, gan heo, tôm/mực, trứng cút và thịt thăn thái mỏng.\n * **Tỏi phi thơm nức:** Hương vị đặc trưng nhất của hủ tiếu Nam Vang chính là mùi tỏi phi vàng rượm, béo ngậy được phủ lên trên surface tô hủ tiếu.\n * **Rau ăn kèm độc đáo:** Món này nhất định phải ăn kèm với **tần ô (cúc tần)** và **cần tây**, cùng với giá đỗ và hẹ.\n## 2. Hai phong cách thưởng thức\n| Phong cách | Mô tả hương vị |\n|---|---|\n| **Hủ tiếu nước** | Sợi hủ tiếu được chan ngập nước dùng ninh từ xương heo, mực khô và tôm khô. Vị nước dùng ngọt thanh, trong vắt và thơm lừng mùi tỏi phi. |\n| **Hủ tiếu khô** | Sợi hủ tiếu được trụng chín rồi trộn đều với loại sốt sệt mặn ngọt đặc trưng (thường làm từ xì dầu, dầu hàu, đường, gia vị bí truyền), ăn kèm chén nước dùng riêng có thịt bằm và trứng cút. |\n> **Mẹo nhỏ:** Để ăn hủ tiếu Nam Vang \"đúng điệu\" Nam Bộ, người ta thường vắt thêm một lát chanh, thêm vài lát ớt tươi hoặc tỏi ngâm chua và chấm topping với nước tương (xì dầu) hoặc tỏi ớt sa tế.\n>"},{"id":20,"cat":"cake","image":"https://i.ibb.co/B7jHR75/7bbd0f40d5dc4b2205ec43d37ffc11b7.jpg","name_vi":"Bánh cuốn","name":{"en":"Steamed Rice Rolls","zh":"越式肠粉(蒸米卷)","ja":"バインクオン(蒸し米ロール)","ko":"반꾸온 (베트남식 쌀말이)"},"rating":4.8,"price":50000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Tiêu","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Chả lụa","price":5000},{"vi":"Hành phi","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Giá đỗ","price":5000}],"short":{"en":"Silky steamed rice-batter sheets rolled around minced pork and wood-ear mushroom, served with fish sauce and herbs.","zh":"薄如蝉翼的蒸米皮包裹猪肉末与木耳，佐鱼露与香草。","ja":"薄く蒸した米粉のシートで、豚ひき肉ときくらげを巻いた一品。魚醤とハーブを添えて。","ko":"얇게 찐 쌀피에 다진 돼지고기와 목이버섯을 말아 피시소스와 허브를 곁들인다."},"desc_vi":"Bánh cuốn là gì?\n**Bánh cuốn** (ở một số nơi miền Nam còn gọi là bánh ướt nhân thịt) là một món ăn truyền thống thanh nhã và vô cùng quen thuộc trong ẩm thực Việt Nam, thường được dùng làm món ăn sáng hoặc ăn nhẹ trong ngày.\n## 1. Thành phần và Cách chế biến\nĐể tạo ra một đĩa bánh cuốn ngon đòi hỏi sự khéo léo và tinh tế trong từng khâu:\n * **Vỏ bánh:** Làm từ bột gạo xát mịn pha với nước theo tỷ lệ chuẩn. Người làm bánh sẽ tráng một lớp bột cực kỳ mỏng lên tấm vải căng trên nồi nước sôi, đậy vung vài giây cho bánh chín bằng hơi rồi dùng nẹp trúc khéo léo nhấc lá bánh mỏng dính, trong suốt ra.\n * **Nhân bánh:** Thường gồm thịt heo băm nhỏ, mộc nhĩ (nấm mèo), nấm hương xào chín và nêm nếm vừa vặn. Bánh sau khi tráng sẽ được cuốn chặt phần nhân này bên trong.\n * **Nước chấm:** Là \"linh hồn\" của món ăn. Nước mắm được pha loãng kết hợp với nước ấm, đường, chanh/dấm và tỏi ớt băm nhỏ để tạo nên vị chua - cay - mặn - ngọt hài hòa, ấm nóng.\n## 2. Topping & Rau ăn kèm\nMột đĩa bánh cuốn đầy đủ thường được trình bày đẹp mắt với:\n * **Hành phi:** Hành khô thái mỏng phi vàng giòn, rắc đều lên trên mặt bánh tạo mùi thơm phức và độ giòn rụm.\n * **Chả ăn kèm:** Chả lụa, chả quế, chả cốm hoặc bánh tôm chiên giòn.\n * **Rau ăn kèm:** Rau thơm (húng quế, giá đỗ trụng hoặc sống, dưa leo thái sợi).\n## 3. Các biến tấu bánh cuốn nổi tiếng\n| Tên biến tấu | Đặc điểm nổi bật |\n|---|---|\n| **Bánh cuốn Thanh Trì (Hà Nội)** | Bánh tráng siêu mỏng, **không có nhân**, chỉ thoa một lớp mỡ hành thơm phức, ăn kèm chả quế và nước mắm cà cuống truyền thống. |\n| **Bánh cuốn Phủ Lý (Hà Nam)** | Bánh tráng không nhân, ăn nguội kèm với **thịt nướng than hoa** nóng hổi và nước mắm chua ngọt. |\n| **Bánh cuốn Cao Bằng / Lạng Sơn** | Khác biệt hoàn toàn khi **ăn kèm với bát nước dùng ninh từ xương heo** nóng hổi (thay vì nước mắm pha), bên trong có thêm trứng gà chèn chín tới hoặc giò mắm. |\n| **Bánh ướt (Miền Nam)** | Tương tự bánh cuốn Thanh Trì nhưng lá bánh dày hơn một chút, thường ăn kèm chả lụa, nem chua, bánh tôm và tưới ngập nước mắm ngọt. |"},{"id":21,"cat":"cake","image":"https://i.ibb.co/pjvJJ3Tm/9e595df6543706a9b433e326873944d9.jpg","name_vi":"Bánh xèo","name":{"en":"Sizzling Turmeric Pancake","zh":"越式煎饼(黄姜煎饼)","ja":"バインセオ(パリパリ米粉クレープ)","ko":"반쎄오 (바삭한 쌀전병)"},"rating":5.0,"price":180000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Rau sống","price":5000},{"vi":"Xà lách","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Dưa leo","price":3000}],"short":{"en":"A large, crisp turmeric-rice crepe folded over shrimp, pork and bean sprouts, wrapped in lettuce and dipped in fish sauce.","zh":"金黄酥脆的姜黄米浆煎饼，包裹虾肉、猪肉与豆芽，用生菜包食蘸鱼露。","ja":"ターメリック入りの米粉を薄く焼いた大きなクレープに、エビや豚肉、もやしを挟む。レタスで包み魚醤で。","ko":"강황을 넣은 바삭한 쌀전병에 새우, 돼지고기, 콩나물을 넣어 상추에 싸서 피시소스에 찍어 먹는다."},"desc_vi":"Bánh xèo là gì?\n**Bánh xèo** là một món ăn dân dã, đặc trưng và vô cùng nổi tiếng của ẩm thực Việt Nam. Tên gọi \"bánh xèo\" xuất phát từ chính âm thanh **\"xèo xèo\"** vui tai phát ra khi người làm bánh trút lớp bột gạo lỏng lên chảo mỡ nóng hổi.\n## 1. Thành phần chính\nMột chiếc bánh xèo chuẩn vị là sự hòa quyện giữa vỏ bánh giòn rụm và phần nhân đậm đà:\n * **Vỏ bánh:** Làm từ bột gạo pha với nước (hoặc nước cốt dừa), bột nghệ (tạo màu vàng óng) và hành lá cắt nhỏ.\n * **Nhân bánh:** Thường bao gồm thịt heo (thịt ba chỉ), tôm tươi, giá đỗ, hẹ và đôi khi có thêm củ sắn (củ đậu) thái sợi hoặc đậu xanh nguyên hạt hấp chín.\n * **Nước chấm:** Nước mắm chua ngọt pha khéo léo với tỏi, ớt, chanh, đường, ăn kèm dưa góp (cà rốt, đu đủ bào sợi ngâm chua).\n * **Rau ăn kèm (Rất quan trọng):** Bánh xèo không thể thiếu các loại rau sống phong phú như cải xanh (cải bẹ xanh), xà lách, bánh tráng và các loại rau thơm dân dã (húng quế, diếp cá, tía tô, lá xoài, lá cóc, đọt đinh lăng...).\n## 2. Cách thưởng thức\nNgười Việt thường ăn bánh xèo bằng tay:\n 1. Đặt một lá cải xanh hoặc lá xà lách lên lòng bàn tay.\n 2. Thêm các loại rau thơm và một miếng bánh xèo (có đủ cả vỏ giòn và nhân).\n 3. Cuộn tròn lại rồi chấm ngập vào bát nước mắm chua ngọt.\nSự kết hợp giữa vị giòn béo của vỏ bánh, ngọt đậm đà của tôm thịt, chút vị đắng nhẹ/chát của rau rừng và vị chua cay mặn ngọt của nước chấm tạo nên hương vị rất khó quên.\n## 3. Sự khác biệt giữa Bánh xèo Miền Tây và Bánh xèo Miền Trung\n| Đặc điểm | Bánh xèo Miền Tây | Bánh xèo Miền Trung |\n|---|---|---|\n| **Kích thước** | Rất to, vành bánh mỏng và giòn xốp. | Nhỏ gọn (bằng lòng bàn tay), đổ trong chảo đất hoặc khuôn gang nhỏ. |\n| **Vỏ bánh** | Đổ thêm nước cốt dừa nên béo ngậy, vàng ươm. | Bột gạo nguyên chất, vỏ dẻo mềm hơn hoặc giòn nhẹ, ít béo hơn. |\n| **Nhân bánh** | Tôm, thịt ba chỉ, giá, củ sắn, có nơi dùng **thịt vịt, nấm mối** hoặc **củ ma** (củ đao). | Tôm đất, mực tươi, thịt heo. |\n| **Nước chấm** | Nước mắm chua ngọt nhẹ tỏi ớt. | Nước mắm chua ngọt hoặc **mắm nêm / mắm đậu phụng** (sốt tương đậu béo bùi). |"},{"id":22,"cat":"cake","image":"https://i.ibb.co/TM4Qyc71/fab3340dbb93d798cde1ac9f55cb65be.jpg","name_vi":"Bánh khọt","name":{"en":"Mini Savory Coconut Pancakes","zh":"迷你煎饼(炸蟹壳黄)","ja":"バインコット(ミニ米粉パンケーキ)","ko":"반콧 (미니 코코넛 쌀전병)"},"rating":4.2,"price":60000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Rau sống","price":5000},{"vi":"Xà lách","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Đu đủ chua","price":5000}],"short":{"en":"Bite-sized crisp coconut-milk pancakes cooked in a special dimpled pan, each topped with a whole shrimp.","zh":"椰浆米浆制成的迷你煎饼，用特制凹槽锅煎至酥脆，每个点缀整只虾仁。","ja":"専用の窪んだ鍋で焼く、ココナッツミルク入りの一口サイズのパリパリパンケーキ。エビをのせて。","ko":"코코넛밀크 반죽을 특수 팬에 구운 한입 크기의 바삭한 전병. 새우 한 마리씩 올려낸다."},"desc_vi":"Bánh khọt là gì?\n**Bánh khọt** là một món ăn ăn vặt đặc sản vô cùng nổi tiếng của ẩm thực miền Nam Việt Nam (đặc biệt là vùng Bà Rịa - Vũng Tàu và các tỉnh miền Tây). Bánh có hình tròn nhỏ vừa ăn, được đổ trong các khuôn nhôm hoặc khuôn gang hình bán cầu.\nTên gọi **\"bánh khọt\"** theo dân gian xuất phát từ âm thanh *“khọt khọt”* khi người thợ dùng muỗng tróc chiếc bánh giòn rụm ra khỏi khuôn, hoặc theo cách gọi tên loại khuôn đổ bánh thời xưa.\n## 1. Thành phần và đặc điểm chính\n * **Vỏ bánh:** Làm từ bột gạo xát mịn, pha thêm một chút bột nghệ (tạo màu vàng tươi) và nước cốt dừa (tạo độ béo ngậy). Bánh được chiên/nướng với một lớp dầu hoặc mỡ mỏng trong khuôn, cho ra thành phẩm **vỏ ngoài vàng giòn, bên trong mềm thơm béo gậy**.\n * **Nhân bánh:** Phổ biến nhất là **tôm tươi** đặt chính giữa mặt bánh. Một số nơi còn biến tấu thêm nhân mực, tôm bằm, thịt heo xào hoặc trứng cút. Trên mặt bánh thường được rắc thêm tôm khô xay mịn, mỡ hành và dừa nạo.\n * **Nước chấm:** Bánh khọt dùng chung nước mắm chua ngọt pha thanh dịu, kết hợp với tỏi ớt băm và đu đủ / cà rốt bào sợi ngâm chua.\n * **Rau ăn kèm:** Tương tự bánh xèo, bánh khọt phải ăn kèm với rất nhiều rau sống như xà lách, cải bẹ xanh, cùng đủ loại rau thơm (húng quế, diếp cá, tía tô, đọt xoài, lá cóc...).\n## 2. So sánh nhanh: Bánh Khọt và Bánh Xèo\nTuy có nhiều điểm tương đồng về nguyên liệu nhưng hai món này lại có nét đặc trưng riêng:\n| Tiêu chí | Bánh Khọt | Bánh Xèo |\n|---|---|---|\n| **Hình dáng & Kích thước** | Nhỏ tròn, đường kính khoảng 4–5 cm, vừa vặn một miếng ăn. | Dạng hình bán nguyệt to, từ kích thước cái đĩa đến cả cái chảo lớn. |\n| **Hình thức đổ bánh** | Đổ trong khuôn lỗ nhỏ chuyên dụng. | Tráng mỏng trên chảo lớn. |\n| **Cảm giác khi ăn** | Dày dặn hơn, béo ngậy vị dừa và giòn giòn ở phần đáy. | Vỏ mỏng rụm, dàn trải đều với nhiều giá đỗ/thịt bên trong. |\n## 3. Cách thưởng thức\nĐể thưởng thức đúng điệu, bạn gắp một chiếc bánh khọt nóng hổi, cuộn chặt trong lá xà lách hoặc cải xanh cùng vài cọng rau thơm, sau đó chấm ngập vào bát nước mắm chua ngọt. Vị giòn rụm của vỏ bánh, ngọt đậm đà của tôm, béo ngậy của dừa hòa quyện với vị tươi mát của rau sống sẽ tạo nên hương vị rất cuốn hút.\nBạn có muốn tìm hiểu thêm về cách pha bột bánh khọt giòn lâu hay địa điểm ăn bánh khọt ngon không?"},{"id":23,"cat":"cake","image":"https://i.ibb.co/twjVHkzd/9139341d95ce5d3fdb7c522a9acc9142.jpg","name_vi":"Bánh bèo","name":{"en":"Steamed Savory Rice Cakes","zh":"水粿(越式蒸米饼)","ja":"バインベオ(蒸し米カップケーキ)","ko":"반베오 (베트남식 쌀떡)"},"rating":4.2,"price":15000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Tiêu","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Hành phi","price":3000},{"vi":"Tôm cháy","price":5000},{"vi":"Chả lụa","price":5000},{"vi":"Rau thơm","price":3000}],"short":{"en":"Small steamed rice-flour cups from Hue, topped with dried shrimp floss, crispy pork rind and scallion oil.","zh":"顺化风味小蒸米饼，撒上虾松、猪皮脆片与葱油。","ja":"フエ発祥の小さな蒸し米カップ。干しエビのそぼろ、揚げ豚皮、ねぎ油をのせて。","ko":"후에 지역의 작은 쌀떡. 말린 새우가루와 바삭한 돼지껍질, 파기름을 올려낸다."},"desc_vi":"Bánh bèo là gì?\n**Bánh bèo** là một món ăn dân dã vô cùng quen thuộc và nổi tiếng của ẩm thực Việt Nam, gắn liền sâu sắc với văn hóa ẩm thực miền Trung (đặc biệt là xứ Huế) trước khi lan rộng và trở thành món ăn yêu thích trên khắp cả nước.\nTên gọi **\"bánh bèo\"** xuất phát từ chính hình dáng của chiếc bánh: mỏng, tròn nhỏ và có một độ lõm nhẹ ở giữa trông rất giống lá của cây bèo tây (bèo Nhật Bản).\n## 1. Thành phần chính\nMột phần bánh bèo chuẩn vị thường là sự kết hợp hài hòa của các lớp nguyên liệu:\n * **Thân bánh (Đế bánh):** Làm hoàn toàn từ bột gạo pha với nước theo tỷ lệ chuẩn, đổ vào các chén nhỏ (chén tầng) hoặc đĩa nhỏ rồi đem hấp chín. Bánh chín có màu trắng đục, mềm dẻo nhưng vẫn có độ dai nhẹ và xoáy lõm đặc trưng ở giữa.\n * **Nhân (Topping):** Tùy từng vùng miền mà nhân bánh bèo sẽ khác nhau, phổ biến nhất là:\n   * **Tôm cháy (kiểu Huế):** Tôm tươi giã nhỏ, rang khô với gia vị cho đến khi bông xốp và có màu cam tươi đẹp mắt.\n   * **Sốt nhân ướt (kiểu Quảng Nam/Đà Nẵng):** Sốt tôm thịt băm nhỏ nấu sánh đặc cùng bột năng, có màu cam đỏ đậm đà.\n   * **Mỡ hành & Tóp mỡ/Bánh breadcrumb chiên giòn:** Tạo độ béo ngậy và giòn rụm khi ăn.\n * **Nước chấm:** Nước mắm pha thanh nhẹ, vị ngọt nhẹ xen lẫn vị cay xè của ớt tươi thái lát. Nước mắm bánh bèo Huế thường không pha tỏi hay chanh để giữ trọn vị thơm tự nhiên của mắm ngon.\n## 2. Sự khác biệt theo vùng miền\n| Đặc điểm | Bánh bèo Huế (Miền Trung) | Bánh bèo Miền Nam |\n|---|---|---|\n| **Kích thước** | Nhỏ, mỏng, đổ trong chén đất nướng nhỏ tẹo (chén tầng). | Dày hơn, to hơn, thường trút ra đĩa lớn. |\n| **Nhân bánh** | Tôm cháy khô, mỡ hành, tóp mỡ hoặc da heo chiên giòn. | Đậu xanh hấp chín giã mịn, tôm cháy, mỡ hành, đồ chua. |\n| **Thưởng thức** | Ăn trực tiếp trong từng chén nhỏ, chan chút nước mắm cay xè. | Bánh xếp ra đĩa, chan ngập nước mắm chua ngọt nhẹ, ăn kèm chả lụa hoặc nem chua. |\n## 3. Cách thưởng thức\nKhi ăn bánh bèo Huế truyền thống, người ta thường dùng một chiếc **dao tre** nhỏ xíu (hoặc muỗng nhỏ), rưới một ít nước mắm mặn ngọt có vài lát ớt xanh/đỏ vào lòng chén, xoay nhẹ dao tre một vòng quanh mép chén để tách bánh rồi đưa vào miệng.\nVị mềm dẻo của bột gạo, béo ngậy của mỡ hành, ngọt đậm đà của tôm cháy kết hợp với vị cay nồng của nước mắm tạo nên trải nghiệm ẩm thực vô cùng tinh tế."},{"id":24,"cat":"cake","image":"https://i.ibb.co/6cw3SXpL/e4086edc58c90f8d556356ad1064b790.jpg","name_vi":"Bánh bột lọc","name":{"en":"Clear Tapioca Dumplings","zh":"越式虾饺(树薯粉粿)","ja":"バインボットロック(タピオカ団子)","ko":"반봇록 (타피오카 만두)"},"rating":5.0,"price":40000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Hành phi","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Dưa leo","price":3000},{"vi":"Đồ chua","price":5000}],"short":{"en":"Translucent, chewy tapioca dumplings from Hue, filled with shrimp and pork, served with sweet fish sauce.","zh":"顺化特色，晶莹Q弹的树薯粉团，内包虾肉与猪肉，佐甜鱼露。","ja":"フエ発祥の透明でもちもちしたタピオカ団子。エビと豚肉を包み、甘い魚醤で。","ko":"후에 지역의 반투명하고 쫄깃한 타피오카 만두. 새우와 돼지고기를 채워 달콤한 피시소스에 곁들인다."},"desc_vi":"Bánh bột lọc là gì?\n**Bánh bột lọc** là một món ăn đặc sản vô cùng nổi tiếng của ẩm thực miền Trung (đặc biệt là xứ Huế), nổi bật với vẻ ngoài trong suốt nhìn thấu phần nhân đỏ ươm bên trong cùng độ dai sần sật đặc trưng.\nTên gọi **\"bánh bột lọc\"** xuất phát từ chính loại nguyên liệu làm nên vỏ bánh: bột năng (ở miền Trung hay gọi là bột lọc) – loại bột sau khi nhào nặn và luộc/hấp chín sẽ trở nên trong vắt.\n## 1. Thành phần chính\n * **Vỏ bánh:** Làm từ **bột năng** (hoặc bột sắn dây). Khi chín, vỏ bánh đạt độ dẻo, dai sần sật và trong suốt.\n * **Nhân bánh:** Thường gồm hai nguyên liệu chính là **tôm** (giữ nguyên con, để nguyên vỏ hoặc bỏ đầu) và **thịt ba chỉ** thái nhỏ, được xào săn và nêm nếm đậm đà với gia vị, màu dầu điều/ớt tạo màu cam đỏ bắt mắt.\n * **Nước chấm:** Thường là nước mắm nguyên chất pha nhẹ với đường, nước luộc tôm và đặc biệt phải có **nhiều ớt tươi thái lát** (ớt xanh hoặc ớt đỏ) để tạo vị cay nồng đúng chất Huế.\n## 2. Các dạng bánh bột lọc phổ biến\nBánh bột lọc chủ yếu được chế biến theo 2 hình thức:\n| Dạng bánh | Mô tả & Đặc điểm |\n|---|---|\n| **Bánh bột lọc gói lá chuối** | Bánh được bọc cẩn thận trong lá chuối tươi rồi đem hấp chín. Món này có hương thơm đặc trưng của lá chuối chín, vỏ bánh mềm dẻo, mướt mịn và giữ độ nóng rất lâu. |\n| **Bánh bột lọc trần (không gói lá)** | Bánh được nặn trực tiếp, thả vào nồi nước sôi luộc chín rồi vớt ra xóc qua mỡ hành/mỡ hẹ để không bị dính. Dạng này có độ dai giòn rụm hơn và lộ rõ màu đỏ tươi của nhân tôm thịt. |\n## 3. Cách thưởng thức\nKhi ăn bánh bột lọc trần, người ta thường xếp bánh ra đĩa, rắc mỡ hành, hành phi giòn và ngò rí (rau mùi) lên trên, sau đó chan hoặc chấm ngập vào bát nước mắm cay xè. Sự hòa quyện giữa **vỏ bánh dai dẻo**, **nhân tôm thịt đậm đà, béo ngậy** và **vị cay nồng của nước mắm** khiến món ăn này trở thành một trải nghiệm ẩm thực vô cùng cuốn hút."},{"id":25,"cat":"cake","image":"https://i.ibb.co/rRvmh6km/3afc2c5847deb9d5c2a8c1e4691cc899.jpg","name_vi":"Bánh nậm","name":{"en":"Flat Rice Dumplings in Banana Leaf","zh":"越式扁米粽(蕉叶蒸米糕)","ja":"バインナム(バナナの葉包み蒸し米)","ko":"반남 (바나나잎에 찐 쌀떡)"},"rating":4.5,"price":7000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Hành phi","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Chả lụa","price":5000},{"vi":"Dưa leo","price":3000}],"short":{"en":"A Hue delicacy of thin steamed rice batter with shrimp filling, wrapped and cooked in banana leaf.","zh":"顺化风味小吃，薄米浆包裹虾肉馅料，以芭蕉叶包裹蒸熟。","ja":"フエ名物。薄い米粉生地でエビの具を包み、バナナの葉ごと蒸し上げる。","ko":"후에 지역 별미. 얇은 쌀반죽에 새우 소를 넣어 바나나잎에 싸서 찐 떡."},"desc_vi":"Bánh nậm là gì?\n**Bánh nậm** là một món ăn dân dã, thanh nhã và là mảnh ghép không thể thiếu trong \"bộ sưu tập\" bánh đặc sản của xứ Huế (bên cạnh bánh bèo, bánh bột lọc và bánh ram ít).\nKhác với độ dai của bánh bột lọc hay độ dẻo mềm của bánh bèo, bánh nậm thu hút bởi **độ mềm mịn, tan ngay trong miệng** cùng hương thơm ngát của lá chuối chín hấp.\n## 1. Thành phần chính\n * **Vỏ bánh:** Làm từ **bột gạo** (có pha thêm một chút bột năng để tạo độ kết dính mỏng nhẹ) quấy đều với nước, gia vị và một ít dầu ăn trên bếp cho đến khi bột nửa chín nửa sống (gọi là \"giai đoạn giáo bột\").\n * **Nhân bánh:** Gồm **thịt heo băm nhỏ** và **tôm tươi giã mịn**, xào săn với hành tím, nước mắm và tiêu, nêm nếm đậm đà rồi rải đều thành một lớp mỏng dẹt màu cam đỏ trên mặt bột.\n * **Lá gói:** Bánh bắt buộc phải gói bằng **lá chuối tươi** (đã qua sơ chế cho dẻo). Lá chuối không chỉ giữ dáng bánh mà khi hấp chín còn tiết ra hương thơm tự nhiên thấm đượm vào lớp bột gạo.\n## 2. Hình dáng và Cách chế biến\n * Bánh nậm có hình chữ nhật, mỏng dẹt và phẳng.\n * Sau khi phết bột và nhân lên lá chuối, người ta gấp gọn hai đầu lá lại rồi đem **hấp cách thủy** khoảng 15 – 20 phút. Khi chín, vỏ bánh chuyển sang màu trắng đục, hơi ngả xanh nhẹ do thấm màu từ lá chuối.\n## 3. Cách thưởng thức đúng chất Huế\nKhi ăn bánh nậm, người ta thường làm theo các bước:\n 1. Bóc nhẹ nhàng lớp lá chuối ra (để nguyên bánh trên mặt lá thay vì gắp ra đĩa).\n 2. Dùng muỗng tưới nhẹ một chút **nước mắm ngọt pha cay xè** (đặc trưng với ớt tươi thái lát) lên thân bánh.\n 3. Dùng muỗng xúc từng miếng bánh mềm mịn đưa vào miệng.\nKhi thưởng thức, bạn sẽ cảm nhận được bột gạo mềm mượt như tan ra, vị bùi béo đậm đà của nhân tôm thịt hòa quyện cùng vị cay nồng của nước mắm và hương thơm mộc mạc từ lá chuối.\n> **Mẹo nhỏ:** Ngoài bánh nậm mặn, ở Huế còn có **bánh nậm chay** (nhân đậu xanh hoặc nấm) thường dùng trong các ngày rằm, mùng một.\n>"},{"id":26,"cat":"cake","image":"https://i.ibb.co/215KGtZj/812b8e2127bc634c9a0c5b73635abc85.jpg","name_vi":"Bánh ít","name":{"en":"Banana-Leaf Sticky Rice Cake","zh":"越式糯米糍(蕉叶糯米团)","ja":"バインイット(バナナの葉のもち米団子)","ko":"반잇 (바나나잎 찹쌀떡)"},"rating":5.0,"price":11000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Hành phi","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Dưa leo","price":3000},{"vi":"Đồ chua","price":5000}],"short":{"en":"Soft glutinous rice cakes wrapped in banana leaf, filled with sweet mung bean or savory pork.","zh":"芭蕉叶包裹的软糯米团，内馅可为甜绿豆或咸猪肉。","ja":"バナナの葉で包んだもちもちの米団子。甘い緑豆餡か、しょっぱい豚肉餡が入る。","ko":"바나나잎에 싼 부드러운 찹쌀떡. 달콤한 녹두소 또는 짭짤한 돼지고기소를 채운다."},"desc_vi":"Bánh ít là gì?\n**Bánh ít** (ở miền Bắc có món tương tự gọi là *bánh gai* hay *bánh nếp*) là một món bánh truyền thống rất phổ biến trong ẩm thực Việt Nam, đặc biệt gắn liền với văn hóa ẩm thực miền Trung và miền Nam.\nĐây là món bánh không thể thiếu trong các dịp cúng giỗ, lễ Tết, đám cưới hỏi hay đơn giản là món quà quê mộc mạc.\n## 1. Nguồn gốc tên gọi\nCó nhiều cách giải thích dân gian về tên gọi \"bánh ít\":\n * **Từ hình dáng:** Chiếc bánh được gói thu gọn lại thành hình tháp nhỏ nhắn, xinh xắn nên gọi là \"ít\".\n * **Từ sự khiêm tốn:** Người xưa quan niệm món bánh này làm ra để tỏ lòng thành kính, tuy giá trị vật chất \"ít\" nhưng đậm đà nghĩa tình gia đình, xóm giềng.\n## 2. Thành phần chính\n * **Vỏ bánh:** Làm từ **bột gạo nếp** xay mịn. Nhờ vậy, vỏ bánh khi chín có độ dẻo, mịn và rất thơm mùi nếp. Tùy biến tấu mà vỏ bánh có thể giữ màu trắng nguyên bản, nhuộm màu lá gai (đen huyền), hoặc màu lá nếp/lá cẩm.\n * **Nhân bánh:** Có hai phong cách nhân chính:\n   * **Nhân ngọt:** Đậu xanh đãi vỏ nấu chín đãi mịn, sên cùng đường và dừa nạo xắt sợi (hoặc nhân dừa xào đường thốt nốt, đậu phụng).\n   * **Nhân mặn:** Tôm tươi, thịt ba chỉ băm nhỏ, nấm mèo, xào đậm đà với hành tím và tiêu đen.\n * **Lá gói:** Bánh thường được gói bằng **lá chuối tươi** (được chần qua nước sôi hoặc hơ lửa cho dẻo), gấp thành hình tháp chóp nhọn 4 góc rất đặc trưng.\n## 3. Các biến tấu bánh ít nổi tiếng\n| Tên loại bánh | Đặc điểm nổi bật |\n|---|---|\n| **Bánh ít lá gai (Bình Định/Miền Trung)** | Vỏ bánh làm từ bột nếp giã chung với lá gai tạo màu đen tuyền bóng mượt. Nhân bên trong là đậu xanh hoặc dừa dẻo ngọt, thơm nồng vị gừng. |\n| **Bánh ít nhân tôm thịt (Mặn)** | Phổ biến ở Huế và các tỉnh miền Tây. Vỏ dẻo mềm bao bọc lấy nhân tôm thịt xào đậm đà, vị béo ngậy xen lẫn vị cay của tiêu. |\n| **Bánh ít trần** | Loại bánh **không gói lá**, sau khi nặn nhân dừa hoặc tôm thịt thì đem luộc/hấp trực tiếp. Khi ăn thường rưới mỡ hành, ăn kèm nước mắm chua ngọt (đối với nhân mặn). |\n| **Bánh ram ít (Đặc sản Huế)** | Sự kết hợp tinh tế giữa một chiếc **bánh ít dẻo mềm** đặt lên trên một đế **bánh ram chiên giòn rụm**, tạo cảm giác \"giòn - dẻo\" hòa quyện rất thú vị. |\n## 4. Cảm nhận hương vị\nKhi bóc lớp lá chuối xanh (thường có thoa một lớp dầu mỏng để chống dính), chiếc bánh ít hiện ra bóng mượt, dẻo quánh. Bánh ít ngọt thì thơm bùi vị đậu xanh, béo ngậy vị dừa và cay nhẹ vị gừng; bánh ít mặn thì đậm đà vị tôm thịt, ăn vô cùng bắt miệng."},{"id":27,"cat":"noodle","image":"https://i.ibb.co/Z6gHW4fP/423155590a3ac6f06f357c87c3c41f8a-1.jpg","name_vi":"Bánh canh cua","name":{"en":"Crab Thick Noodle Soup","zh":"螃蟹粗米线(蟹肉板面)","ja":"バインカインクア(カニ入り太麺スープ)","ko":"반깐꾸어 (게살 굵은쌀국수)"},"rating":4.9,"price":35000,"origin":"Việt Nam","spices":[{"vi":"Chanh","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Tiêu","price":2000},{"vi":"Nước mắm","price":2000}],"sides":[{"vi":"Hành lá","price":2000},{"vi":"Rau thơm","price":3000},{"vi":"Giá đỗ","price":5000},{"vi":"Quẩy","price":5000}],"short":{"en":"Thick, chewy rice noodles in a savory crab broth, topped with crab paste cake and fried shallots.","zh":"粗米线搭配鲜美蟹汤，配蟹膏饼与炸葱头，浓郁鲜香。","ja":"もちもちの太麺を、旨みたっぷりのカニだしで。カニ味噌の団子と揚げエシャロットを添えて。","ko":"쫄깃한 굵은 쌀국수에 진한 게살 육수, 게살떡과 튀긴 샬롯을 곁들인다."},"desc_vi":"Bánh canh cua là gì?\n**Bánh canh cua** là một món ăn siêu phổ biến và rất được yêu thích trong ẩm thực miền Nam (đặc biệt là ở Sài Gòn và các tỉnh Nam Bộ). Món ăn này gây ấn tượng mạnh bởi bát bánh canh nghi ngút khói, nước dùng màu đỏ cam sánh đặc, đậm đà cùng muôn vàn loại topping hải sản bắt mắt.\n## 1. Thành phần chính\n * **Sợi bánh canh:** Thường làm từ bột lọc (bột năng), bột gạo hoặc pha trộn giữa cả hai (*bột xắt*). Sợi bánh canh cua to, tròn, có độ dẻo dai sần sật đặc trưng.\n * **Nước dùng (nước lèo):** Được ninh từ xương heo, ghẹ/cua biển, tôm khô và củ cải để tạo vị ngọt thanh tự nhiên. Nước dùng được quấy thêm chút bột năng/bột sắn để tạo độ **sánh đặc**, kết hợp với gạch cua và dầu điều tạo nên màu đỏ cam vô cùng bắt mắt.\n * **Topping phong phú:**\n   * **Thịt cua/ghẹ:** Thịt cua gỡ xé phay hoặc nguyên càng cua mọng nước.\n   * **Chả cua:** Cua quết cùng thịt heo bằm, gia vị rồi hấp chín thành viên/miếng thơm lừng.\n   * **Topping kèm theo:** Tôm tươi luộc, huyết heo, giò heo (hoặc thịt khoanh), trứng cút và bánh quẩy giòn rụm.\n## 2. Điểm khác biệt so với các món bánh canh khác\n| Đặc điểm | Bánh canh cua | Bánh canh trảng bàng / Bánh canh giò heo |\n|---|---|---|\n| **Nước dùng** | Đỏ cam bắt mắt, **sánh đặc** như súp. | Trong vắt, ngọt thanh vị xương ống. |\n| **Hương vị chính** | Đậm đà, béo ngậy vị hải sản và gạch cua. | Thanh nhẹ, thơm vị hành tiêu và thịt heo. |\n| **Ăn kèm** | Bắt buộc phải ăn kèm **bánh quẩy** chiên giòn. | Thường ăn kèm nước mắm nguyên chất tỏi ớt. |\n## 3. Cách thưởng thức đúng điệu\nMột bát bánh canh cua nóng hổi khi bê ra sẽ được rắc thêm ít hành lá, ngò rí và thật nhiều tiêu đen.\nKhi ăn, bạn vắt thêm một lát chanh tươi, chấm các loại topping (càng cua, tôm, chả cua) vào bát **muối ớt xanh** hoặc nước tương tỏi ớt. Đừng quên xé nhỏ chiếc bánh quẩy thả ngập vào phần nước dùng sánh mịn để quẩy hút trọn vị ngọt béo rồi thưởng thức!"},{"id":28,"cat":"porridge","image":"https://i.ibb.co/ZpN2k3DQ/112e2029bc31ad824d3f105bd571dd48.jpg","name_vi":"Cháo lòng","name":{"en":"Pork Offal Rice Porridge","zh":"猪杂粥(内脏粥)","ja":"チャオロン(豚内臓のお粥)","ko":"짜오롱 (돼지내장 죽)"},"rating":4.8,"price":45000,"origin":"Việt Nam","spices":[{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Nước mắm","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Quẩy","price":5000},{"vi":"Hành lá","price":2000},{"vi":"Rau thơm","price":3000},{"vi":"Giá đỗ","price":5000}],"short":{"en":"Silky rice porridge simmered with pork broth and topped generously with assorted cooked pork offal.","zh":"猪骨清粥搭配丰富的猪内脏配料，口感绵密浓香。","ja":"豚だしでとろりと炊いたお粥に、豚モツをたっぷりのせた一杯。","ko":"돼지육수로 부드럽게 끓인 죽에 다양한 돼지내장을 푸짐하게 올린 요리."},"desc_vi":"Cháo lòng là gì?\n**Cháo lòng** là một món ăn bình dân, lâu đời và vô cùng quen thuộc trong ẩm thực Việt Nam, xuất hiện phổ biến từ Bắc chí Nam. Món ăn này là sự kết hợp hoàn hảo giữa **cháo gạo** nấu nhừ và các loại **nội tạng heo (lòng heo)** luộc chín tới thơm phức.\n## 1. Thành phần chính\nMột tô cháo lòng đầy đủ bao gồm các thành phần cơ bản:\n * **Phần cháo:** Được nấu từ gạo giã dập hoặc gạo nguyên hạt (thường pha thêm một ít gạo nếp để tạo độ sánh dẻo). Điểm đặc trưng nhất là cháo được ninh trực tiếp bằng **nước luộc lòng** và kết hợp với **dồi huyết (huyết heo)**, tạo nên màu nâu xám đặc trưng và vị ngọt đậm đà, béo ngậy.\n * **Topping lòng heo:** Đa dạng các bộ phận nội tạng heo luộc chín:\n   * *Lòng non, dạ dày (bao tử), gan, tim, cật, cổ hủ, lưỡi heo...*\n   * **Dồi (Món đinh):** Ruột già nhồi huyết heo cùng hành lá, sả, đậu xanh, mỡ heo và các loại rau thơm (rau húng, rau răm) rồi đem hấp/luộc chín, sau đó chiên hoặc nướng tùy vùng.\n   * **Huyết luộc:** Những khối huyết đóng đông mềm mịn, bùi bùi.\n * **Gia vị & Rau ăn kèm:** Hành lá thái nhỏ, ngò rí, giá đỗ, gừng thái sợi, tiêu xay và đặc biệt là các loại rau thơm như **húng quế, húng quắn, rau răm**.\n## 2. Sự khác biệt theo vùng miền\n| Đặc điểm | Cháo lòng Miền Bắc | Cháo lòng Miền Nam |\n|---|---|---|\n| **Phần cháo** | Thường nấu hơi loãng, cháo có màu nâu đậm do nấu chung với huyết tán mịn, thơm nồng vị gừng. | Cháo sánh đặc hơn, hạt gạo nở bung hoặc giã dập nhẹ, nước cháo thanh ngọt hơn. |\n| **Dồi heo** | Dồi luộc chín, nhân thường có nhiều mỡ, huyết và các loại rau thơm (đặc biệt là rau húng). | Dồi thường được chiên vàng giòn sau khi hấp, nhân có thêm đậu xanh rang, sả, mỡ heo. |\n| **Nước chấm** | Thường chấm lòng với **nước mắm nguyên chất** kèm ớt tươi, vắt chút chanh hoặc dấm tỏi. | Thường dùng **nước mắm chua ngọt** nhẹ hoặc nước mắm tỏi ớt, ăn kèm giá sống/trụng. |\n## 3. Cách thưởng thức\nCháo lòng luôn được ăn khi **còn rất nóng**. Người ta thường rắc thêm nhiều tiêu xay, ớt bột hoặc ớt tươi thái lát, vắt miếng chanh và thả nhiều rau thơm vào tô cháo.\nCác miếng lòng luộc giòn sần sật, gan bùi bùi, dồi béo ngậy được gắp ra chấm ngập vào bát nước mắm đậm đà, ăn kèm từng muỗng cháo nóng hổi tạo nên cảm giác vô cùng ấm bụng, nhất là vào những ngày thời tiết mát mẻ hay buổi sáng sớm."},{"id":29,"cat":"porridge","image":"https://i.ibb.co/x8mm9Z9y/ebed0821483cd896020a03f35b0bd441.jpg","name_vi":"Cháo cá","name":{"en":"Fish Rice Porridge","zh":"鱼片粥","ja":"チャオカー(魚のお粥)","ko":"짜오까 (생선죽)"},"rating":5.0,"price":30000,"origin":"Việt Nam","spices":[{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Nước mắm","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Hành lá","price":2000},{"vi":"Gừng thái sợi","price":3000},{"vi":"Rau đắng","price":3000},{"vi":"Giá đỗ","price":5000}],"short":{"en":"Comforting rice porridge cooked with fresh fish, ginger and scallion, finished with crispy fried shallots.","zh":"鲜鱼与姜葱同煮的暖胃粥品，撒上酥脆炸葱头。","ja":"生姜とねぎを効かせた魚のお粥。揚げエシャロットをのせて仕上げる。","ko":"생강과 파를 넣어 끓인 생선죽. 바삭한 튀긴 샬롯을 올려 마무리한다."},"desc_vi":"Cháo cá là gì?\n**Cháo cá** là một món ăn thanh nhẹ, bổ dưỡng và vô cùng quen thuộc trong văn hóa ẩm thực Việt Nam. Món ăn này là sự kết hợp giữa cháo gạo ninh nhừ và thịt cá tươi ngon, xuất hiện từ các bữa ăn gia đình dã dãi đến các quán ăn đặc sản từ Bắc vào Nam.\n## 1. Thành phần chính\n * **Cá:** Có thể dùng cả cá nước ngọt (cá lóc/cá quả, cá chép, cá trắm, cá rô, cá bống...) lẫn cá nước mặn (cá thu, cá bớp, cá chẽm, cá mú, cá hồi...). Cá được làm sạch, luộc hoặc gỡ lấy thịt xào sơ với hành tím cho thơm đậm đà.\n * **Nước dùng & Cháo:** Phần cháo thường được ninh bằng chính **nước luộc cá** (đã lọc kỹ xương) kết hợp với xương heo hoặc củ cải để tạo vị ngọt thanh tự nhiên. Gạo nấu cháo thường là gạo dẻo, pha thêm chút gạo nếp hoặc đậu xanh để cháo có độ sánh mịn và vị bùi.\n * **Gia vị \"khử mùi tanh\" (Rất quan trọng):** Để tô cháo cá thơm ngon và không bị tanh, các gia vị đi kèm không thể thiếu gồm: **gừng tươi thái sợi**, hành tím phi vàng, tiêu xay, hành lá, ngò rí (rau mùi) và đặc biệt là **rau thì là** (rất phổ biến ở miền Bắc) hoặc **rau đắng, giá đỗ** (ở miền Nam).\n## 2. Các biến tấu cháo cá nổi tiếng theo vùng miền\n| Tên món cháo cá | Đặc điểm nổi bật |\n|---|---|\n| **Cháo cá lóc rau đắng (Miền Nam)** | Cá lóc (cá quả) hấp hoặc luộc gỡ thịt đậm đà, nước cháo sánh ngọt ăn kèm giá sống và lá **rau đắng đất** giòn đắng nhẹ nhưng hậu ngọt. |\n| **Cháo cá chép / cá trắm (Miền Bắc)** | Thường nấu chung với đậu xanh, thơm nồng mùi **thì là**, gừng sợi và hành phi giòn. Đây là món ăn vô cùng bổ dưỡng, thường dành cho người mới ốm dậy hoặc phụ nữ mang thai. |\n| **Cháo cá ám / cháo cá rô** | Cá rô đồng luộc lấy thịt xào thơm, phần xương giã lọc lấy nước ninh cháo. Bát cháo ngọt đậm vị cá đồng mộc mạc. |\n| **Cháo đầu cá bớp / cá thu (Miền Trung - Hải sản)** | Dùng hải sản tươi sống, cháo nấu hơi loãng, đậm đà vị cay của tiêu và ớt tươi, ăn rất ấm bụng. |\n## 3. Cách thưởng thức\nMột tô cháo cá chuẩn vị luôn phải ăn khi **còn nóng hổi, nghi ngút khói**. Khi ăn, người ta rắc thật nhiều tiêu đen, gừng thái sợi, hành ngò và vắt thêm một miếng chanh tươi.\nThịt cá mềm ngọt, không bị bở, quyện với bát cháo nóng ấm, vị cay nhẹ của gừng tiêu giúp ấm bụng và giải cảm rất tốt."},{"id":30,"cat":"porridge","image":"https://i.ibb.co/Mk6xQy6x/1705e90937fd14415eee916348c44beb.jpg","name_vi":"Cháo vịt","name":{"en":"Duck Rice Porridge","zh":"鸭肉粥","ja":"チャオヴィット(鴨のお粥)","ko":"짜오빗 (오리죽)"},"rating":4.8,"price":45000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm gừng","price":3000},{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Rau răm","price":3000},{"vi":"Gừng thái sợi","price":3000},{"vi":"Hành lá","price":2000},{"vi":"Giá đỗ","price":5000}],"short":{"en":"Rich rice porridge cooked in duck broth, served with tender duck meat and a tangy ginger-fish sauce dip.","zh":"鸭汤熬制的浓香粥品，配嫩鸭肉与姜汁鱼露蘸料。","ja":"鴨だしで炊いた濃厚なお粥。柔らかい鴨肉と生姜風味の魚醤ダレを添えて。","ko":"오리육수로 끓인 진한 죽에 부드러운 오리고기와 생강피시소스를 곁들인다."},"desc_vi":"Cháo vịt là gì?\n**Cháo vịt** là một món ăn bình dân, thanh mát và vô cùng quen thuộc trong ẩm thực Việt Nam, đặc biệt rất được ưa chuộng tại miền Trung và miền Nam. Món ăn này là sự kết hợp hoàn hảo giữa **cháo gạo ninh nhừ với nước luộc vịt** và **thịt vịt luộc/quay** mềm ngọt, béo ngậy.\n## 1. Thành phần chính\nMột phần cháo vịt đầy đủ và chuẩn vị thường gồm các thành phần:\n * **Tô cháo nóng:** Gạo rang sơ trước khi nấu (để hạt cháo nở bung mà không bị vữa), ninh trực tiếp bằng **nước luộc vịt** ngọt đậm đà. Cháo thường có thêm đậu xanh giã dập hoặc huyết vịt luộc xắt khối, tạo độ bùi và màu sắc bắt mắt.\n * **Đĩa thịt vịt:** Thịt vịt luộc chín tới, da béo gậy, thịt mềm ngọt không bị khô. Thịt thường được chặt miếng vừa ăn hoặc xé phay trộn gỏi.\n * **Gỏi ăn kèm (Rất quan trọng):** Đi kèm đĩa thịt vịt luôn là phần gỏi bắp cải (hoặc bắp chuối, đu đủ bào sợi) trộn cùng rau răm, hành tây thái mỏng, đậu phụng rang và nước mắm chua ngọt.\n * **Nước chấm \"linh hồn\":** **Nước mắm gừng** pha đặc sánh, đậm đà, vị cay nồng của gừng tươi và ớt giúp át hoàn toàn mùi hôi đặc trưng của vịt, tôn lên độ ngọt của thịt.\n## 2. Các hình thức thưởng thức phổ biến\n| Hình thức | Cách phục vụ & Trải nghiệm |\n|---|---|\n| **Cháo vịt nguyên bản (Thịt trong tô)** | Thịt vịt chặt miếng hoặc xé nhỏ thả trực tiếp vào tô cháo nóng hổi, rắc hành lá, ngò rí, tiêu xay và hành phi lên trên. |\n| **Cháo vịt gỏi (Rất phổ biến ở miền Nam)** | Phục vụ riêng: 1 tô cháo nóng + 1 đĩa gỏi bắp cải trộn thịt vịt + 1 chén nước mắm gừng. Người ăn gắp thịt vịt chấm mắm gừng, ăn kèm gỏi giòn chua ngọt rồi húp muỗng cháo nóng. |\n| **Cháo vịt quay** | Thịt vịt được quay giòn da, thơm phức gia vị ngũ vị hương rồi chặt xếp lên tô cháo, tạo hương vị đậm đà rất riêng. |\n## 3. Cảm nhận hương vị\nMột bữa cháo vịt ngon là sự tổng hòa của nhiều tầng hương vị: vị ấm nồng của tiêu và mắm gừng, vị béo ngọt của thịt vịt, độ bùi dẻo của cháo đậu xanh và vị chua ngọt, giòn sần sật của đĩa gỏi bắp cải rau răm. Đây là món ăn rất thích hợp cho những buổi chiều mát trời hoặc bữa ăn tối nhẹ bụng."},{"id":31,"cat":"porridge","image":"https://i.ibb.co/7t1kDvv7/193f43a1fc1f4fc28d5cba88e3e28197.jpg","name_vi":"Xôi mặn","name":{"en":"Savory Sticky Rice","zh":"咸味糯米饭","ja":"ソイマン(おかず入りおこわ)","ko":"쏘이만 (짭짤한 찹쌀밥)"},"rating":4.8,"price":45000,"origin":"Việt Nam","spices":[{"vi":"Nước tương","price":2000},{"vi":"Tương ớt","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Nước mắm","price":2000}],"sides":[{"vi":"Chả lụa","price":5000},{"vi":"Lạp xưởng","price":10000},{"vi":"Trứng cút","price":5000},{"vi":"Hành phi","price":3000}],"short":{"en":"Steamed glutinous rice topped with a hearty mix of Chinese sausage, shredded chicken, pork floss and mung bean.","zh":"蒸糯米饭配腊肠、鸡丝、肉松与绿豆蓉，丰盛饱足。","ja":"蒸したもち米に、腸詰めや鶏そぼろ、緑豆をのせた食べ応えのある一皿。","ko":"찐 찹쌀밥에 소시지, 닭고기채, 고기고명, 녹두를 푸짐하게 올린 요리."},"desc_vi":"Xôi mặn là gì?\n**Xôi mặn** là món ăn sáng bình dân, siêu phổ biến và là \"biểu tượng\" ẩm thực đường phố tại miền Nam (đặc biệt là ở Sài Gòn và các tỉnh Nam Bộ). Khác với các món xôi ngọt (như xôi xéo, xôi gấc, xôi dừa), xôi mặn thu hút người ăn bởi sự kết hợp của vô số loại topping đậm đà trên nền nếp dẻo thơm.\n## 1. Thành phần chính\nMột gói/hộp xôi mặn đầy đủ chuẩn vị Nam Bộ thường gồm:\n * **Xôi nếp:** Làm từ gạo nếp ngon hấp/đồ chín tới, hạt xôi dẻo quánh, bóng mượt và thơm lừng.\n * **Topping đậm đà (Rất đa dạng):**\n   * **Thịt & Chả:** Chả lụa thái mỏng, thịt xá xíu, thịt heo xé (ruốc/chà bông), lạp xưởng chiên thái lát.\n   * **Trứng:** Trứng cút luộc hoặc chiên, trứng gà chiên thái sợi.\n   * **Pâté & Mỡ hành (Linh hồn món ăn):** Một lớp pâté gan béo ngậy quết đều lên xôi, tưới thêm mỡ hành xanh mướt thơm phức và ruốc tép (tép khô xào).\n   * **Đồ chua & Dưa leo:** Dưa leo thái mỏng, đồ chua (cà rốt, đu đủ ngâm chua ngọt) giúp cân bằng độ béo.\n * **Nước rưới:** Nước tương (xì dầu) hoặc nước sốt xá xíu đậm đà, kết hợp với chút sa tế/ớt tươi tạo vị cay nhẹ.\n## 2. Các biến tấu xôi mặn phổ biến\n| Loại xôi mặn | Đặc điểm nổi bật |\n|---|---|\n| **Xôi gà / Xôi gà xé** | Xôi mặn ăn kèm thịt gà xé phay đậm đà (hoặc đùi gà chiên mắm/gà rôti), mỡ hành, chà bông và tỏi phi giòn. |\n| **Xôi xá xíu** | Thịt xá xíu mềm mại, đậm đà vị ngũ vị hương, rưới ngập phần nước sốt xá xíu sánh mịn, béo bùi. |\n| **Xôi khúc mặn** | Bánh khúc nhân đậu xanh thịt heo, rắc thêm chà bông, lạp xưởng và mỡ hành lên trên. |\n| **Xôi mặn gói lá chuối** | Phong cách truyền thống, xôi được gói trong lá chuối tươi giúp giữ độ nóng lâu và có thêm hương thơm dịu mát của lá. |\n## 3. Cảm nhận hương vị\nMột phần xôi mặn ngon là sự tổng hòa tuyệt vời của nhiều tầng hương vị: vị dẻo thơm của nếp, béo ngậy của pâté và mỡ hành, vị đậm đà của lạp xưởng, chả lụa hòa quyện cùng chút chua nhẹ của dưa góp và vị cay nồng của sa tế. Đây là món ăn vừa nhanh gọn, vừa chắc bụng, vô cùng quen thuộc với học sinh, sinh viên và người đi làm mỗi buổi sáng."},{"id":32,"cat":"porridge","image":"https://i.ibb.co/cSpJXd23/8ddce26344b87a5cd8117f72581db234.jpg","name_vi":"Xôi gấc","name":{"en":"Red Gac Sticky Rice","zh":"红木鳖果糯米饭","ja":"ソイガック(赤いガックのおこわ)","ko":"쏘이갓 (빨간 가지열매 찹쌀밥)"},"rating":4.8,"price":30000,"origin":"Việt Nam","spices":[{"vi":"Muối mè","price":3000},{"vi":"Đường","price":1000},{"vi":"Dừa nạo","price":5000},{"vi":"Mè rang","price":3000}],"sides":[{"vi":"Đậu xanh","price":5000},{"vi":"Chả lụa","price":5000},{"vi":"Hành phi","price":3000},{"vi":"Dừa sợi","price":5000}],"short":{"en":"Vivid red sticky rice colored and enriched by gac fruit, traditionally served at weddings and Tet for good luck.","zh":"由红木鳖果染色的喜庆糯米饭，传统上在婚礼与春节食用，寓意吉祥。","ja":"ガックの実で鮮やかな赤に染めたおこわ。結婚式やテトに縁起物として食べられる。","ko":"가지열매로 붉게 물들인 찹쌀밥. 전통적으로 결혼식과 설날에 행운을 기원하며 먹는다."},"desc_vi":"Xôi gấc là gì?\n**Xôi gấc** là một món xôi truyền thống vô cùng nổi tiếng và có vị trí đặc biệt trong văn hóa ẩm thực Việt Nam. Món ăn này gây ấn tượng bởi **màu đỏ tươi tự nhiên** rực rỡ thu hút ánh nhìn, được làm từ thịt quả gấc chín.\nTrong văn hóa Việt, màu đỏ tượng trưng cho sự may mắn, may mắn và hạnh phúc. Vì vậy, xôi gấc là món ăn gần như **bắt buộc phải có** trên mâm cỗ vào các dịp quan trọng như đám cưới, đám hỏi, lễ Tết, cúng Mùng Một/Rằm, hay các buổi tân gia, mừng thọ.\n## 1. Thành phần và Cách chế biến\n * **Thành phần chính:**\n   * **Gạo nếp:** Chọn loại nếp ngon (như nếp cái hoa vàng), hạt tròn đều, dẻo thơm.\n   * **Quả gấc:** Dùng phần ruột đỏ (thịt gấc) bóp cùng một ít rượu trắng để kích thích gấc dậy màu đỏ tươi và thơm hơn.\n   * **Gia vị bổ sung:** Một ít đường (tạo vị ngọt dịu nhẹ), muối, mỡ heo hoặc dầu ăn (giúp hạt xôi bóng mượt). Nhiều nơi còn cho thêm **nước cốt dừa** để xôi béo ngậy.\n * **Cách làm:** Gạo nếp sau khi ngâm nở sẽ được trộn đều với phần thịt gấc cho đến khi từng hạt nếp áo một màu đỏ rực. Sau đó, xôi được đồ (hấp) chín bằng hơi nước.\n## 2. Các hình thức thưởng thức và Biến tấu\nXôi gấc có hương vị thanh nhẹ, dẻo thơm và ngọt dịu nên rất dễ kết hợp với các món ăn khác:\n| Dạng xôi gấc | Đặc điểm & Bối cảnh sử dụng |\n|---|---|\n| **Xôi gấc đóng khuôn (Thắp hương/Cỗ)** | Xôi đồ chín được nén vào khuôn có khắc chữ *Phúc - Lộc - Thọ* hoặc hình hoa sen, ở giữa có thể độn thêm một lớp **nhân đậu xanh** sên đường mịn màng. |\n| **Xôi gấc ăn kèm chả lụa/giò quế** | Biến tấu ăn sáng phổ biến ở miền Bắc, sự kết hợp giữa vị dẻo ngọt nhẹ của xôi gấc và vị đậm đà, mặn mòi của giò chả tạo nên hương vị rất cuốn hút. |\n| **Xôi gấc vừng dừa** | Xôi đồ chín rắc thêm dừa nạo sợi và muối vừng (mè) rang thơm, tăng độ bùi béo. |\n## 3. Hương vị đặc trưng\nMột đĩa xôi gấc đạt chuẩn sẽ có hạt nếp dẻo quánh, bóng mượt, có màu đỏ cam vô cùng tươi tắn. Khi ăn, bạn sẽ cảm nhận được độ dẻo mềm của gạo nếp, vị bùi ngọt nhẹ tự nhiên của gấc và hương thơm quyến rũ của nước cốt dừa hòa quyện."},{"id":33,"cat":"skewer","image":"https://i.ibb.co/LhvSMn8G/23ebbab964bce9f131448926f2453c61.jpg","name_vi":"Nem nướng","name":{"en":"Grilled Pork Skewers","zh":"烤肉串(越式烤肉)","ja":"ネムヌン(炭火焼き肉串)","ko":"넴느엉 (숯불돼지고기꼬치)"},"rating":4.3,"price":90000,"origin":"Việt Nam","spices":[{"vi":"Nước chấm nem nướng","price":5000},{"vi":"Tương ớt","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Đậu phộng rang","price":3000}],"sides":[{"vi":"Rau sống","price":5000},{"vi":"Bánh tráng","price":5000},{"vi":"Dưa leo","price":3000},{"vi":"Đồ chua","price":5000}],"short":{"en":"Smoky grilled pork patties on skewers, usually rolled in rice paper with herbs and dipped in peanut sauce.","zh":"炭烤猪肉串，通常用米纸包裹香草蘸花生酱食用。","ja":"香ばしい炭火焼きの豚肉串。ライスペーパーとハーブで巻き、ピーナッツソースにつけて食べる。","ko":"숯불에 구운 돼지고기 꼬치. 라이스페이퍼에 허브와 함께 싸서 땅콩소스에 찍어 먹는다."},"desc_vi":"Nem nướng là gì?\n**Nem nướng** là một món ăn đặc sản vô cùng nổi tiếng của ẩm thực Việt Nam, xuất phát từ miền Trung (nổi danh nhất là *Nem nướng Nha Trang* và *Nem nướng Ninh Hòa*) sau đó lan rộng và rất được yêu thích trên khắp cả nước, bao gồm cả miền Nam (như *Nem nướng Miền Tây / Cần Thơ*).\nMón ăn này thu hút bởi những xiên thịt nướng thơm lừng, vàng ươm, kết hợp cùng muôn vàn loại rau sống và bát nước chấm sốt đặc sánh \"thần thánh\".\n## 1. Thành phần chính\nMột phần nem nướng đầy đủ và chuẩn vị thường bao gồm 4 phần cơ bản:\n * **Thịt nem nướng:** Làm từ **thịt heo tươi** (chọn phần thịt mông hoặc thịt ba chỉ) quết thật kỹ cùng mỡ hạt xắt nhỏ, tỏi, hành, đường, nước mắm và gia vị cho đến khi đạt độ dẻo mịn (tương tự như quết giò sống). Thịt sau đó được bọc quanh que tre/đũa rồi **nướng trên bếp than hồng** cho đến khi xém cạnh, tỏa mùi thơm nức và có màu vàng cam óng ả.\n * **Bánh tráng chiên giòn (Ram):** Bánh tráng được cuốn nhỏ lại rồi chiên ngập dầu cho giòn rụm, tạo độ giòn sần sật cực kỳ bắt miệng khi cuộn chung.\n * **Rau ăn kèm (Cực kỳ phong phú):**\n   * Rau sống: Xà lách, tía tô, húng quế, diếp cá, dưa leo, hẹ.\n   * Đồ chua & Trái cây thái mỏng: Khế chua, chuối chát, xoài sống bào sợi, dưa góp (cà rốt, đu đủ ngâm chua).\n * **Nước chấm (Linh hồn của món ăn):** Nước chấm nem nướng rất đặc biệt, không phải nước mắm chua ngọt thông thường mà là loại **sốt tương sánh đặc** có màu vàng cam. Sốt được làm từ nếp dẻo nấu nhừ, tôm tươi giã mịn, thịt heo băm, gan heo, tương đậu nành và mỡ hành, vị bùi béo, ngọt dịu và thơm nức.\n## 2. Các phong cách Nem nướng phổ biến\n| Phong cách | Đặc điểm nổi bật |\n|---|---|\n| **Nem nướng Nha Trang** | Thịt nem quết dẻo giòn, điểm nhấn là **sốt chấm nếp tôm thịt** màu cam sánh mịn, ăn kèm bánh tráng chiên giòn (ram) và rau sống đầy đủ vị chua-chát-ngọt. |\n| **Nem nướng Cần Thơ / Miền Tây** | Viên nem thường tròn trặn, nướng cháy xém đậm đà vị ngọt nhẹ đặc trưng Nam Bộ. Thường ăn kèm bánh hỏi, rau thơm và chấm **nước mắm nêm** hoặc **tương ngọt** pha đậu phụng giã dập. |\n| **Nem nướng Đà Lạt** | Ảnh hưởng từ phong cách Nha Trang nhưng sốt chấm thường được phục vụ nóng hổi để hợp với thời tiết lạnh, nem được nướng cháy cạnh thơm lừng. |\n## 3. Cách thưởng thức\nNgười ta thưởng thức nem nướng theo phong cách cuốn:\n 1. Trải một tấm bánh tráng dẻo ra đĩa/lòng bàn tay.\n 2. Xếp lần lượt xà lách, các loại rau thơm, xoài sống, chuối chát, dưa leo.\n 3. Đặt một thanh **nem nướng** và một thanh **ram chiên giòn** vào giữa.\n 4. Cuộn tròn chặt tay rồi **chấm ngập vào bát nước sốt tương béo ngậy** (có thể thêm chút sa tế cay xè).\nSự kết hợp giữa vị ngọt đậm đà của thịt nướng, độ giòn rụm của ram, vị tươi mát chua chát của rau xoài và vị bùi béo ấm áp của nước sốt tạo nên một trải nghiệm ẩm thực vô cùng cuốn hút!"},{"id":34,"cat":"skewer","image":"https://i.ibb.co/k2R5njH0/de61222cb6da34be235924269c7419a7.jpg","name_vi":"Nem chua","name":{"en":"Fermented Pork Roll","zh":"酸肉(越式酸肉卷)","ja":"ネムチュア(発酵豚肉ロール)","ko":"넴쭈어 (베트남 발효돼지고기)"},"rating":4.5,"price":7000,"origin":"Việt Nam","spices":[{"vi":"Tương ớt","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Tỏi","price":2000}],"sides":[{"vi":"Lá sung","price":3000},{"vi":"Dưa leo","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Đồ chua","price":5000}],"short":{"en":"Tangy fermented raw pork bound with pork skin, traditionally wrapped in guava or fig leaves for extra aroma.","zh":"以生猪肉与猪皮发酵制成的酸味小吃，传统以番石榴叶或无花果叶包裹增香。","ja":"生豚肉と豚皮を発酵させた酸味のある一品。伝統的にグァバや無花果の葉で包んで香りづけする。","ko":"생돼지고기와 돼지껍질을 발효시켜 만든 새콤한 음식. 전통적으로 구아바잎이나 무화과잎에 싸서 향을 더한다."},"desc_vi":"Nem chua là gì?\n**Nem chua** là một món ăn lên men truyền thống độc đáo, nổi tiếng bậc nhất trong văn hóa ẩm thực Việt Nam. Điểm đặc biệt của nem chua là thịt heo **không qua chế biến bằng nhiệt** (không luộc, chiên hay nướng) mà được làm chín hoàn toàn nhờ **quá trình lên men tự nhiên**.\nMón ăn này xuất hiện ở khắp ba miền, thường dùng làm món ăn vặt, món nhắm trên bàn tiệc, hay quà biếu trong các dịp lễ Tết.\n## 1. Thành phần và Cách chế biến\n * **Thành phần chính:**\n   * **Thịt heo:** Phải là thịt đùi hoặc thịt mông heo thật tươi (vừa mới mổ xong, còn ấm), lọc sạch mỡ và gân rồi mang đi giã hoặc xay nhuyễn mịn.\n   * **Bì heo (da heo):** Luộc chín, cạo sạch mỡ, thái thành từng sợi thật mỏng và giòn.\n   * **Gia vị & Phụ liệu:** Nước mắm ngon, đường, tiêu hạt, tỏi thái lát, ớt tươi và đặc biệt là **lá đinh lăng** (hoặc lá ổi) đặt lên thân nem.\n   * **Lá gói:** Gói bên trong bằng lá ổi/đinh lăng để tạo mùi thơm và hỗ trợ lên men, bên ngoài bọc kín bằng nhiều lớp **lá chuối tươi** để giữ nhiệt và tạo môi trường ếm khí cho nem chua.\n * **Cơ chế lên men:** Nhờ sự kết hợp giữa đường, gia vị và vi khuẩn lactic tự nhiên trong môi trường kín, sau khoảng 2–4 ngày (tùy thời tiết), nem sẽ tự chín, có vị chua nhẹ, khối thịt săn chắc và chuyển sang màu hồng tươi đẹp mắt.\n## 2. Các vùng nem chua nổi tiếng\n| Vùng miền | Đặc điểm đặc trưng |\n|---|---|\n| **Nem chua Thanh Hóa** | Món nem \"quốc dân\" nổi tiếng nhất. Nem có hình trụ nhỏ bằng ngón tay, vị chua thanh, giòn sần sật của bì heo, thơm nồng vị tỏi ớt và lá đinh lăng. |\n| **Nem Lai Vung (Đồng Tháp)** | Nem có màu đỏ hồng, hình khối vuông nhỏ gói bằng lá chuối. Vị nem thiên về **ngọt - chua - mặn - cay** hài hòa đúng phong cách miền Tây, bên trong thường đính kèm một hạt tiêu đen và lá ổi. |\n| **Nem chua Chợ Huyện (Bình Định)** | Cột thành từng xâu nhỏ, vị chua đậm đà, thịt săn chắc, thường được nướng sơ trên bếp than hồng trước khi thưởng thức. |\n| **Nem chua Thủ Đức (Sài Gòn)** | Viên nem hình vuông hoặc tròn, vị ngọt nhẹ, dẻo và giòn, thường ăn kèm tỏi sống. |\n## 3. Các biến tấu ẩm thực hấp dẫn từ Nem chua\nNgoài cách bóc lá ăn trực tiếp (chấm kèm tương ớt), nem chua còn được chế biến thành nhiều món ăn đường phố rất \"hot\":\n * **Nem chua nướng:** Nem chua được kẹp vào vỉ nướng trên than hồng cho xém cạnh, chảy mỡ xèo xèo, tỏa mùi thơm nức.\n * **Nem chua rán:** Món ăn vặt \"thần thánh\" của giới trẻ miền Bắc. Nem chua lăn qua bột chiên xù rồi chiên ngập dầu giòn rụm bên ngoài, dẻo mềm bên trong.\n * **Tré / Tré trộn:** Nem chua chặt nhỏ trộn cùng tré, chả lụa, xoài sống, tắc (quất), rau răm và muối ớt tây."},{"id":35,"cat":"skewer","image":"https://i.ibb.co/7tLQcG06/ccdb729958b909ac22eed0d0ac97df5f.jpg","name_vi":"Chả cá","name":{"en":"Turmeric Fish with Dill","zh":"姜黄煎鱼(河内煎鱼)","ja":"チャーカー(ターメリック魚のディル炒め)","ko":"짜까 (강황생선 딜볶음)"},"rating":4.5,"price":70000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Tương ớt","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Rau sống","price":5000},{"vi":"Dưa leo","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Đồ chua","price":5000}],"short":{"en":"A Hanoi icon: turmeric-marinated fish sizzled tableside with generous dill and scallion, served over rice noodles.","zh":"河内经典名菜，姜黄腌鱼配大量蒔萝与葱段现场煎烤，配米粉食用。","ja":"ハノイの名物料理。ターメリックで下味をつけた魚を、たっぷりのディルとねぎで卓上調理し、米麺と共に。","ko":"하노이의 명물 요리. 강황에 재운 생선을 딜과 파를 듬뿍 넣어 즉석에서 볶아 쌀국수와 함께 먹는다."},"desc_vi":"Chả cá là gì?\n**Chả cá** là một món ăn truyền thống vô cùng phổ biến, thơm ngon và đa dạng trong ẩm thực Việt Nam. Món ăn này được làm từ **thịt cá tươi** giã hoặc xay nhuyễn, nêm nếm gia vị rồi quết thật kỹ để tạo độ dai dẻo tự nhiên, sau đó chế biến bằng cách hấp, chiên (rán) hoặc nướng.\nChả cá xuất hiện từ Bắc vào Nam, vừa là món ăn hàng ngày trong bữa cơm gia đình, vừa là thành phần chính của nhiều món đặc sản nổi tiếng.\n## 1. Thành phần và Cách chế biến cơ bản\n * **Nguyên liệu chính:**\n   * **Cá:** Có thể dùng cá biển (cá thu, cá thác lác, cá nhồng, cá mối, cá cờ...) hoặc cá nước ngọt (cá thác lác, cá lóc, cá rô phi, cá chép...). Cá phải thật tươi thì chả mới có độ ngọt và dính dẻo tự nhiên.\n   * **Gia vị & Phụ liệu:** Hành tím, tỏi, tiêu đen/tiêu xanh, nước mắm, chút đường, thì là (phổ biến ở miền Bắc) hoặc mỡ heo thái hạt lựu (để tạo độ ngậy, không bị khô).\n * **Quy trình làm:**\n   1. Cá lọc lấy thịt (fillet), bỏ sạch xương và da.\n   2. Mang thịt cá đi quết (dùng muỗng/chày quết liên tục) hoặc xay lạnh để tạo độ liên kết dai sần sật mà **không cần dùng hàn the hay bột**.\n   3. Tạo hình thành viên tròn, bánh dẹt hoặc đĩa tròn rồi đem hấp chín hoặc chiên vàng ươm.\n## 2. Các món Chả cá đặc sản nổi tiếng Việt Nam\nTùy theo vùng miền và loại cá sử dụng, chả cá mang những hương vị phong cách rất riêng:\n| Tên món / Thương hiệu | Đặc điểm nổi bật |\n|---|---|\n| **Chả cá Lã Vọng (Hà Nội)** | Món ăn tinh tế xứ Kinh Kỳ. Thịt **cá lăng/cá anh vũ** cắt miếng lọc xương, ướp riềng, mẻ, nghệ rồi nướng than. Khi ăn, chả được xào nóng ngay tại bàn trên chảo mỡ cùng **thì là, hành hoa**, ăn kèm bánh đa, bún và chấm **mắm tôm** pha chanh ớt. |\n| **Chả cá Thác Lác (Mien Tây / Tây Nguyên)** | Làm từ cá thác lác (đặc biệt là cá thác lác cườm). Thịt cá siêu dai, ngọt thanh, thường dùng để chiên giòn, hấp hoặc nặn viên nấu soup/lẩu khổ qua. |\n| **Chả cá Quy Nhơn / Nha Trang (Miền Trung)** | Làm từ các loại cá biển tươi (cá thu, cá mối, cá nhồng). Bánh chả cá được chiên vàng giòn hoặc hấp chín mướt, là thành phần không thể thiếu trong món **Bún chả cá** nổi tiếng. |\n| **Chả cá Vân Đình (Hà Nội)** | Thường làm từ cá trắm, cá rô phi đồng, chiên mỏng vàng ươm, thơm nồng mùi hành thì là, rất hợp ăn kèm bún nước hoặc bánh mì. |\n## 3. Chả cá trong đời sống ẩm thực\nChả cá là nguyên liệu vô cùng linh hoạt. Ngoài việc chấm nước mắm tỏi ớt ăn trực tiếp với cơm nóng, chả cá còn là \"ngôi sao\" trong nhiều món ăn đường phố hấp dẫn như:\n * **Bún chả cá / Bánh canh chả cá** (đặc sản miền Trung).\n * **Bánh mì chả cá** (món ăn sáng tiện lợi, nóng hổi ép giòn rụm).\n * **Chả cá sốt cà chua** hoặc **Lẩu chả cá**."},{"id":36,"cat":"skewer","image":"https://i.ibb.co/Y4ZtyrxV/772cf61d4e9227f1566be9cd7e8dc7a9.jpg","name_vi":"Chả mực","name":{"en":"Squid Paste Cakes","zh":"墨鱼丸(下龙湾鱿鱼饼)","ja":"チャームック(イカ団子)","ko":"짜므억 (오징어살떡)"},"rating":5.0,"price":350000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Tương ớt","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Xôi trắng","price":5000},{"vi":"Rau sống","price":5000},{"vi":"Dưa leo","price":3000},{"vi":"Đồ chua","price":5000}],"short":{"en":"Bouncy, springy patties pounded from fresh squid, a specialty of Ha Long Bay, pan-fried until golden.","zh":"下龙湾特色，新鲜墨鱼捶打成有弹性的鱼糕，煎至金黄。","ja":"新鮮なイカを叩いて作る、コリコリとした食感が魅力のハロン湾名物。こんがり焼き上げる。","ko":"할롱베이 특산품. 신선한 오징어를 다져 만든 탱글탱글한 완자를 노릇하게 지진다."},"desc_vi":"Chả mực là gì?\n**Chả mực** là một món ăn đặc sản nổi tiếng hàng đầu của ẩm thực Việt Nam, trong đó danh tiếng bậc nhất thuộc về **Chả mực Hạ Long (Quảng Ninh)**. Món ăn này thu hút bởi hương vị ngọt đậm đà tự nhiên của biển, độ giòn sần sật đặc trưng và màu vàng ươm đẹp mắt khi chiên giòn.\n## 1. Thành phần và Bí quyết tạo nên độ giòn\n * **Mực tươi (Mực mai):** Để làm chả mực ngon chuẩn vị, người ta bắt buộc phải dùng **mực mai (mực nang)** tươi sống vừa mới đánh bắt từ biển về, thân dày, thịt dầy và ngọt.\n * **Gia vị & Phụ liệu:** Thịt heo ba chỉ hoặc mỡ hạt lựu (giúp chả không bị khô), tỏi, hành khô, tiêu đập dập, nước mắm ngon và một chút thì là/hành lá (tùy vùng).\n * **Bí quyết giã tay truyền thống:** Điểm đặc biệt nhất làm nên thương hiệu chả mực Hạ Long chính là **thịt mực được giã bằng tay trong cối đá**. Việc giã tay giúp các sợi cơ của thịt mực tiết ra độ dính dẻo tự nhiên, giữ trọn độ giòn sần sật khi nhai chứ không bị bở xốp như khi xay bằng máy.\n## 2. Quy trình chế biến & Thành phẩm\n 1. Mực được làm sạch, bỏ túi mực, lột da, rửa sạch và lau thật khô.\n 2. Thân mực cắt miếng giã nhuyễn, râu mực thái hạt lựu rồi trộn đều cùng mỡ heo và gia vị.\n 3. Nặn thành từng miếng tròn dẹt vừa ăn.\n 4. Mang đi **chiên ngập trong chảo dầu nóng** cho đến khi hai mặt phồng phao, chuyển sang màu vàng óng tỏa mùi thơm nức.\n## 3. Các món ăn kèm \"thần thánh\" với Chả mực\nChả mực nóng hổi vừa vớt ra khỏi chảo có thể chấm trực tiếp với tương ớt hoặc nước mắm tỏi ớt. Ngoài ra, nó còn là ngôi sao trong các món ăn nổi tiếng:\n * **Xôi chả mực:** Món ăn sáng \"quốc dân\" ở Quảng Ninh. Bát xôi nếp dẻo thơm rưới chút mỡ hành ăn kèm những miếng chả mực giòn sần sật, đậm đà.\n * **Bánh cuốn chả mực:** Bánh cuốn tráng mỏng nóng hổi ăn cùng chả mực chiên giòn rụm thay vì chả lụa/chả quế thông thường, chấm nước mắm chua ngọt pha khéo.\n * **Bún chả mực:** Ăn kèm nước dùng chua thanh nhẹ nấu từ cà chua, dọc mùng và dứa (thơm)."},{"id":37,"cat":"mains","image":"https://i.ibb.co/YT3M2JVn/ee9d08f8045bb091a05cb2eb08d63c06.jpg","name_vi":"Cá kho tộ","name":{"en":"Caramelized Braised Fish","zh":"红烧鱼(砂锅鱼)","ja":"カーコートー(魚のキャラメル煮土鍋)","ko":"까코또 (생선 캐러멜조림)"},"rating":4.0,"price":200000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Tiêu","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Đường","price":1000}],"sides":[{"vi":"Cơm trắng","price":5000},{"vi":"Rau luộc","price":5000},{"vi":"Dưa leo","price":3000},{"vi":"Canh chua","price":5000}],"short":{"en":"Fish braised low and slow in a clay pot with caramelized sugar and fish sauce until deeply savory.","zh":"鱼块与焦糖鱼露一同小火慢炖于砂锅中，咸香浓郁。","ja":"魚をキャラメリゼした砂糖と魚醤で土鍋にじっくり煮込んだ、コクのある一品。","ko":"생선을 캐러멜화한 설탕과 피시소스로 뚝배기에 은근하게 조려낸 깊은 맛의 요리."},"desc_vi":"Cá kho tộ là gì?\n**Cá kho tộ** là một món ăn đậm đà, dân dã và là \"quốc hồn quốc túy\" trong bữa cơm gia đình của người Nam Bộ. Món ăn này nổi bật với những khúc cá sẫm màu gián bóng mượt, mặn mặn ngọt ngọt, thơm nồng vị tiêu ớt và béo ngậy vị mỡ heo.\nTên gọi **\"kho tộ\"** xuất phát từ việc cá được kho trực tiếp trong **tộ** (người miền Nam gọi nồi đất/niêu đất nhỏ là \"tộ\").\n## 1. Thành phần chính\n * **Loại cá:** Phổ biến nhất là các loại cá nước ngọt/cá đồng sông nước miền Tây như **cá lóc (cá quả), cá hú, cá dứa, cá bông lau, cá kèo, cá trèn...** Khúc cá được cắt khoanh vừa ăn, thịt săn chắc và tươi ngon.\n * **Nước màu & Gia vị:** Nước màu (thắng từ đường cho ra màu cánh gián), nước mắm ngon, đường (người miền Nam kho cá thường nêm vị ngọt hơi đậm hơn miền Bắc), tiêu đen đập dập, tỏi, hành tím và **ớt chỉ thiên tươi**.\n * **Mỡ heo & Tóp mỡ (Linh hồn món ăn):** Người Nam Bộ chuẩn vị thường dùng mỡ heo để kho cá thay vì dầu ăn. Những miếng tóp mỡ giòn béo rưới lên trên giúp nồi cá có độ bóng bẩy, thơm lừng và ngậy đượm.\n## 2. Vì sao nhất định phải kho trong \"Tộ\"?\nKho cá bằng nồi đất (tộ) không chỉ là truyền thống mà còn là phương pháp nấu ăn rất tinh tế:\n * **Giữ nhiệt lâu và tỏa nhiệt đều:** Nồi đất giữ độ nóng lâu và tỏa nhiệt chậm, giúp gia vị từ từ thấm sâu tận vào từng sợi thịt cá mà không làm khúc cá bị nát.\n * **Làm quánh nước kho:** Nhờ đặc tính hút ẩm nhẹ của đất nướng, phần nước kho cá sẽ cô đặc lại thành lớp sốt **sánh quánh, dẻo quánh**, bám chặt vào khúc cá.\n## 3. Cảm nhận hương vị & Cách thưởng thức\nMột nồi cá kho tộ hoàn hảo khi dọn ra bàn ăn vẫn còn **sôi ùng ục, tỏa khói nghi ngút**.\n * **Hương vị:** Thịt cá săn chắc, thấm vị mặn ngọt đậm đà, béo ngậy vị tóp mỡ, quyện cùng vị cay nồng xè lưỡi của tiêu và ớt tươi.\n * **Thưởng thức:** Cá kho tộ là món \"tốn cơm\" nhất vào những ngày mưa hoặc tiết trời mát mẻ. Người ta thường gắp miếng thịt cá đậm đà ăn cùng cơm trắng nóng hổi, rồi dùng **dưa leo, giá đỗ, rau luộc (độc đáo nhất là luộc rau khoai lang, đậu bún, dưa leo)** rưới ngập phần nước sốt kho cá quánh dẻo để thưởng thức."},{"id":38,"cat":"mains","image":"https://i.ibb.co/9kvYJwnC/415d2f2052e55d16cb94f1c7256d8cb1.jpg","name_vi":"Cá lóc nướng trui","name":{"en":"Grilled Snakehead Fish","zh":"草烤生鱼(烤蛇头鱼)","ja":"カーロックヌンチュイ(草焼き雷魚)","ko":"까록느엉쭈이 (볏짚구이 가물치)"},"rating":4.8,"price":130000,"origin":"Việt Nam","spices":[{"vi":"Muối ớt","price":3000},{"vi":"Nước mắm chua ngọt","price":3000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Rau sống","price":5000},{"vi":"Bánh tráng","price":5000},{"vi":"Bún tươi","price":5000},{"vi":"Dưa leo","price":3000}],"short":{"en":"A Mekong Delta favorite: whole snakehead fish skewered and grilled over burning straw until smoky and charred.","zh":"湄公河三角洲特色，整条生鱼串起以稻草火烤，烟熏焦香。","ja":"メコンデルタの人気料理。丸ごとの雷魚を串刺しにし、藁の炎で豪快に焼き上げる。","ko":"메콩델타 지역 인기 요리. 가물치 통째로 꼬치에 꽂아 볏짚불에 구워 훈연향을 낸다."},"desc_vi":"Cá lóc nướng trui là gì?\n**Cá lóc nướng trui** là một món ăn dân dã, độc đáo và là \"biểu tượng\" ẩm thực gắn liền với văn hóa khai hoang của vùng sông nước Miền Tây Nam Bộ.\nĐiểm đặc biệt nhất của món ăn này là cá lóc được chế biến theo phong cách **hoàn toàn tự nhiên, mộc mạc**: cá sống catching từ sông/đồng lên không cần đánh vảy, không mổ bụng, không ướp gia vị mà mang đi nướng trực tiếp bằng **rơm khô**.\n## 1. Cách chế biến độc nhất vô nhị\nQuy trình làm món cá lóc nướng trui mang đậm chất phóng khoáng của người dân Nam Bộ:\n 1. **Sơ chế \"không chế biến\":** Chọn cá lóc đồng sống (thường từ 700g – 1kg), rửa sạch bùn đất bên ngoài. Tuyệt đối **không đánh vảy, không mổ bụng, không ướp bất kỳ gia vị nào** để giữ trọn vị ngọt tự nhiên và phần mỡ bụng đặc trưng.\n 2. **Xên que & Cắm đất:** Dùng một thanh trúc hoặc cành cây tươi vót nhọn xiên từ miệng cá xuyên suốt chiều dài thân cá, sau đó cắm ngược đầu cá xuống đất.\n 3. **Phủ rơm & Nướng trui:** Phủ một đống rơm khô ngập kín cá rồi châm lửa đốt. Người nướng phải canh lượng rơm vừa đủ: cháy liên tục khoảng 10–15 phút cho đến khi rơm tàn thành tro.\n 4. **Làm sạch cá:** Rút que cá ra, dùng dao cạo sạch lớp vảy cá bị cháy đen thui bên ngoài. Lúc này, lớp da cá bên trong hiện ra màu vàng ươm, tỏa mùi thơm phức bốc lên ngùn ngụt.\n## 2. Dụng cụ & Gia vị ăn kèm\nMón cá lóc nướng trui chỉ thực sự trọn vẹn khi đi kèm \"hệ sinh thái\" rau và nước chấm vô cùng phong phú:\n * **Mỡ hành & Đậu phụng:** Cá sau khi cạo sạch lớp cháy sẽ được rạch nhẹ một đường dọc lưng, rưới ngập **mỡ hành xanh mướt** và rắc **đậu phụng (lạc) rang giã dập** lên trên.\n * **Nước chấm (Linh hồn món ăn):**\n   * *Nước mắm me:* Chua chua, ngọt ngọt, cay nhẹ (phổ biến nhất).\n   * *Mắm nêm:* Pha cùng thơm (dứa) giã mịn, ớt và tỏi tươi.\n * **Rau ăn kèm (Chuẩn miền Tây):** Cuộn cùng bánh tráng và muôn vàn loại rau đồng quê như **lá cóc, lá xoài non, đọt đọt đọt, dưa leo, chuối chát, khế chua, giá đỗ, bún tươi**.\n## 3. Cảm nhận hương vị\nKhi thưởng thức, bạn tách dọc thân cá ra sẽ thấy phần thịt cá bên trong **trắng nõn, bốc khói nghi ngút, mọng nước** và giữ trọn độ ngọt tự nhiên do không bị mất nước trong quá trình nướng rơm.\nXé một miếng thịt cá dẻo ngọt, thêm chút ruột cá đắng nhẹ béo ngậy, cuộn chặt trong lá rau rừng cùng bánh tráng rồi chấm ngập vào chén mắm me đậm đà — bạn sẽ cảm nhận được trọn vẹn vị mộc mạc, phóng khoáng nhưng vô cùng quyến rũ của miền Tây sông nước."},{"id":39,"cat":"mains","image":"https://i.ibb.co/cKy0rdH7/25bf5a1de386a9ce2e69bd6d30035a58.jpg","name_vi":"Gà nướng","name":{"en":"Grilled Chicken","zh":"烤鸡","ja":"ガーヌン(鶏の炭火焼き)","ko":"가느엉 (숯불닭구이)"},"rating":4.3,"price":120000,"origin":"Việt Nam","spices":[{"vi":"Muối ớt","price":3000},{"vi":"Tiêu","price":2000},{"vi":"Tương ớt","price":2000},{"vi":"Nước mắm","price":2000}],"sides":[{"vi":"Rau răm","price":3000},{"vi":"Dưa leo","price":3000},{"vi":"Đồ chua","price":5000},{"vi":"Xôi","price":5000}],"short":{"en":"Marinated chicken grilled over charcoal until the skin turns crackling and golden, served with a citrus-salt dip.","zh":"腌制鸡肉炭火烤至外皮焦香金黄，佐柠檬椒盐蘸料。","ja":"下味をつけた鶏肉を炭火で皮パリパリに焼き上げ、塩とライムのタレを添えて。","ko":"양념한 닭고기를 숯불에 껍질이 바삭해지도록 구워 소금라임소스를 곁들인다."},"desc_vi":"Gà nướng là gì?\n**Gà nướng** là một món ăn phổ biến, thơm ngon và có mặt trong nền ẩm thực của hầu hết các quốc gia trên thế giới. Về cơ bản, đây là món ăn sử dụng **thịt gà** (nguyên con, đùi, cánh hoặc ức) đã được sơ chế, ướp gia vị rồi làm chín bằng **nhiệt độ cao trực tiếp hoặc gián tiếp** (nướng than hồng, nướng lu, nướng lò, hoặc nồi chiên không dầu).\nNhờ nhiệt độ cao, lớp da gà bên ngoài thường chín vàng giòn, xém cạnh, trong khi phần thịt bên trong vẫn giữ được độ mềm mọng và thấm đượm gia vị.\n## 1. Thành phần chính & Cách chế biến\n * **Thịt gà:** Thường ưu tiên chọn **gà thả vườn hoặc gà chạy bộ** (để thịt săn chắc, dẻo ngọt, da mỏng) hơn là gà công nghiệp.\n * **Gia vị ướp (Đa dạng theo phong cách):** Tùy từng loại gà nướng mà phần gia vị ướp sẽ mang đặc trưng riêng. Các nguyên liệu quen thuộc gồm: hành, tỏi, sả, ớt, nước mắm, mật ong, ngũ vị hương, hoặc các loại lá rừng đặc sản.\n * **Hình thức nướng:**\n   * **Nướng than hoa (than hồng):** Phương pháp truyền thống giúp gà có lớp vỏ giòn, xém cạnh thơm phức mùi khói.\n   * **Nướng lu (lu đất):** Gà được treo trong lu đất kín, nhiệt độ tỏa đều giúp gà chín mềm, không bị mất nước và giữ trọn độ ngọt.\n   * **Nướng lò / Nồi chiên không dầu:** Tiện lợi, hiện đại, thích hợp làm tại nhà.\n## 2. Các món Gà nướng đặc sản nổi tiếng ở Việt Nam\nỞ Việt Nam, món gà nướng biến tấu rất phong phú tùy theo vùng miền:\n| Món gà nướng | Đặc điểm nổi bật |\n|---|---|\n| **Gà nướng cơm lam (Tây Nguyên)** | Gà thả đồi ướp gia vị rừng, kẹp vào thanh trúc nướng trên than hồng. Thịt gà dai ngọt, thơm nồng vị khói, ăn kèm cơm lam dẻo thơm trong ống nứa và chấm **muối é / muối sả**. |\n| **Gà nướng muối ớt** | Món ăn đường phố cực \"hot\". Gà được phết lớp sốt muối ớt cay xè, màu đỏ cam bắt mắt, da giòn rụm, béo ngậy. |\n| **Gà nướng mật ong** | Vị ngọt dịu nhẹ, da gà vàng óng ánh, bóng mượt nhờ lớp mật ong nguyên chất phết đều trong quá trình nướng. |\n| **Gà nướng đất sét (Gà ăn mày)** | Gà đắp một lớp đất sét dày xung quanh rồi vùi vào đống lửa/rơm nướng chín. Khi bóc lớp đất khô ra, lông gà đi theo đất, thịt gà bên trong trắng nõn, cực kỳ ngọt mọng. |\n| **Gà nướng sả / Gà nướng lu** | Thơm nồng mùi sả tươi, thịt mềm mọng nước, thường ăn kèm xôi dẻo hoặc bánh mì. |\n## 3. Cách thưởng thức\nGà nướng ngon nhất là khi vừa ra lò, còn nóng hổi nghi ngút khói. Người ta thường xé gà bằng tay, chấm cùng **muối ớt xanh**, **muối tiêu chanh** hoặc **muối hạt giã ớt hiểm**, ăn kèm các loại rau thơm, dưa leo, dưa góp và xôi chiên/xôi dẻo để tròn vị."},{"id":40,"cat":"mains","image":"https://i.ibb.co/PG1DRhTN/c0e58a0a765ba710c481f5fc5375ed36.jpg","name_vi":"Vịt quay","name":{"en":"Roast Duck","zh":"烧鸭","ja":"ヴィットクアイ(北京ダック風)","ko":"오리구이"},"rating":4.0,"price":450000,"origin":"Việt Nam","spices":[{"vi":"Nước chấm vịt quay","price":5000},{"vi":"Nước tương","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Dưa leo","price":3000},{"vi":"Rau thơm","price":3000},{"vi":"Đồ chua","price":5000},{"vi":"Bánh mì","price":5000}],"short":{"en":"Whole duck roasted until the skin is deep mahogany and shatteringly crisp, served with a savory dipping sauce.","zh":"整只烧鸭烤至枣红色，皮脆肉嫩，佐浓郁蘸酱。","ja":"皮がパリパリになるまで焼き上げた丸鴨のロースト。特製ダレを添えて。","ko":"껍질이 바삭해지도록 통째로 구운 오리에 진한 소스를 곁들인다."},"desc_vi":"Vịt quay là gì?\n**Vịt quay** là một món ăn cao cấp, thơm ngon nổi tiếng trong văn hóa ẩm thực Á Đông, đặc biệt có nguồn gốc từ ẩm thực Trung Hoa và đã trở thành một món ăn cực kỳ quen thuộc, phổ biến tại Việt Nam.\nMón ăn này gây ấn tượng bởi **lớp da màu đỏ nâu bóng mượt, giòn rụm** bên ngoài, bao bọc lấy phần **thịt vịt bên trong mọng nước, mềm ngọt** và thấm đượm hương vị gia vị thảo mộc tẩm ướp đậm đà.\n## 1. Thành phần & Quy trình chế biến công phu\nĐể có một con vịt quay đạt chuẩn, quy trình chế biến đòi hỏi sự tỉ mỉ qua nhiều bước:\n * **Sơ chế & Tẩm ướp:** Vịt được làm sạch, ướp phần bụng bên trong bằng các loại gia vị thảo mộc như **ngũ vị hương, hoa hồi, thảo quả, trần bì (vỏ quýt), hành, tỏi, xì dầu**...\n * **Bơm hơi & Xối nước sôi (Tạo độ giòn da):** Người ta bơm không khí vào giữa lớp da và thịt để tách da ra, giúp da giòn hơn khi quay. Sau đó, vịt được xối nước sôi và phết lớp mật ong/mạch nha pha giấm lên da để tạo màu đỏ ánh kim bóng bẩy.\n * **Sấy khô & Quay:** Vịt được treo lên sấy khô hoàn toàn lớp da bên ngoài trước khi đưa vào **lu đất hoặc lò quay** ở nhiệt độ cao. Nhiệt độ giúp mỡ vịt chảy ra, làm lớp da chín giòn tan mà thịt bên trong không bị khô.\n## 2. Các phong cách Vịt quay nổi tiếng\n| Tên loại vịt quay | Đặc điểm nổi bật |\n|---|---|\n| **Vịt quay Bắc Kinh (Trung Quốc)** | Biểu tượng ẩm thực thế giới. Chú trọng nhất vào **lớp da giòn tan, siêu mỏng**. Khi ăn, da vịt được lạng thành miếng mỏng, cuốn trong bánh tráng pía mỏng cùng đầu hành, dưa leo và chấm sốt Hoisin/tương đen. Phần thịt còn lại thường dùng nấu canh hoặc xào mì. |\n| **Vịt quay Lạng Sơn (Việt Nam)** | Đặc sản vùng cao Việt Nam. Điểm cốt lõi là bụng vịt được nhồi đầy **lá và quả mắc mật** cùng các gia vị độc đáo. Vịt quay xong có mùi thơm nồng nàn đặc trưng của núi rừng, thịt ngọt đậm đà. |\n| **Vịt quay Chợ Lớn / Quảng Đông (Sài Gòn)** | Phổ biến nhất trong các tiệm quay Nam Bộ. Vịt quay nguyên con chặt miếng vừa ăn, thịt mềm mọng rưới ngập phần **nước sốt vịt quay** đậm đà béo ngậy, ăn kèm kiệu chua hoặc dưa góp. |\n## 3. Cách thưởng thức\nVịt quay thường được chặt thành từng miếng vừa ăn, xếp ra đĩa óng ả. Món ăn này có thể thưởng thức theo nhiều cách vô cùng linh hoạt:\n * **Ăn kèm bánh mì / Bánh hỏi / Bánh bao chiên:** Chấm ngập miếng vịt quay và bánh mì vào bát **nước sốt quay vịt** đậm đà, béo thơm.\n * **Ăn cùng cơm nóng hoặc bún:** Là món ăn chính vô cùng \"tốn cơm\" trong các bữa tiệc gia đình hay dịp cúng lễ.\n * **Chấm kèm:** Nước sốt tiết ra từ bụng vịt khi quay (sốt gốc), nước tương tỏi ớt hoặc nước mắm xì dầu pha chua ngọt."},{"id":41,"cat":"hotpot","image":"https://i.ibb.co/ksM5BPKf/f964d9ec7fe7d1a7aec6a8640cb78a3c.jpg","name_vi":"Lẩu mắm","name":{"en":"Fermented Fish Hot Pot","zh":"鱼露火锅(金边鱼酱锅)","ja":"ラウマム(発酵魚醤鍋)","ko":"러우맘 (발효생선소스 전골)"},"rating":4.3,"price":800000,"origin":"Việt Nam","spices":[{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Nước mắm","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Rau đắng","price":3000},{"vi":"Bông súng","price":5000},{"vi":"Cà tím","price":3000},{"vi":"Bún tươi","price":5000}],"short":{"en":"A Mekong Delta hot pot built on deeply fragrant fermented-fish broth, packed with seafood, meats and vegetables.","zh":"湄公河三角洲风味火锅，浓香鱼露汤底，配海鲜、肉类与蔬菜。","ja":"メコンデルタ発、発酵魚醤の濃厚だしを使った鍋。海鮮や肉、野菜をたっぷりと。","ko":"메콩델타 지역의 발효생선소스 육수 전골. 해산물과 고기, 채소가 푸짐하게 들어간다."},"desc_vi":"Lẩu mắm là gì?\n**Lẩu mắm** là món lẩu đặc sản biểu tượng của văn hóa ẩm thực miền Tây Nam Bộ (Đồng bằng sông Cửu Long). Món ăn này là sự kết hợp độc đáo giữa **nước dùng nấu từ mắm cá đậm đà**, muôn vàn loại **hải sản, thịt cá tươi sống** cùng một \"tập đoàn\" **rau đồng quê** vô cùng phong phú.\nLẩu mắm không chỉ là một món ăn đơn thuần mà còn thể hiện trọn vẹn sự phóng khoáng, dồi dào sản vật của vùng sông nước miền Tây.\n## 1. Thành phần chính\nMột nồi lẩu mắm đầy đủ chuẩn vị miền Tây bao gồm 3 phần chính:\n * **Nước dùng (Linh hồn của lẩu):**\n   * Được ninh từ **mắm cá linh** hoặc **mắm cá sặc** (nhiều nơi pha thêm mắm cá lóc để tăng vị đậm đà và độ béo). Mắm được nấu rã thịt, lọc sạch xương, sau đó hòa cùng nước dừa tươi và nước ninh xương heo.\n   * Nước dùng được dằn lại vị ngọt bằng đường thốt nốt, nêm nếm cùng **sả đập dập, tỏi, ớt và cà tím** thái khúc để át mùi nồng của mắm, tạo nên vị ngọt đậm, thơm lừng và vô cùng kích thích giác quan.\n * **Đồ nhúng (Đồ bơi & Đồ đồng):**\n   * **Hải sản & Cá:** Cá hú, cá lóc, cá kèo, cá dứa, tôm sông, mực tươi, lươn đồng, hoặc chả cá thác lác.\n   * **Thịt:** Thịt ba chỉ heo (thịt ba rọi) thái mỏng, quay giòn da hoặc giò heo.\n * **Đặc sản rau ăn kèm (Không thể thiếu):**\n   * Lẩu mắm nổi tiếng là món ăn có lượng rau đi kèm \"đồ sộ\" nhất trong các loại lẩu.\n   * Có đến 20–30 loại rau đồng quê: **bông điên điển, bông súng, hoa chuối, rau đắng, rau muống, đọt xoài, lá cóc, kèo nèo, cà tím, đọt khổ qua, rau nhút, giá đỗ...**\n## 2. Điểm đặc trưng & Hương vị\n| Yếu tố | Đặc điểm nổi bật |\n|---|---|\n| **Mùi vị** | Đậm đà, thơm nồng vị mắm đặc trưng nhưng không cay nồng hay khó ăn nhờ sự cân bằng của sả, nước dừa tươi và đường thốt nốt. |\n| **Trải nghiệm** | Sự hòa quyện giữa vị **béo ngậy** của thịt ba chỉ, vị **ngọt tươi** của cá hải sản, vị **đắng nhẹ / chát nhẹ / giòn sần sật** của vô số loại rau đồng. |\n| **Nước chấm** | Thường chấm cùng bát **nước mắm nguyên chất** dầm ớt hiểm tươi hoặc ớt sa tế. |\n## 3. Cách thưởng thức đúng điệu\nKhi nồi lẩu mắm sôi ùng ục trên bếp, tỏa mùi thơm nức của sả và mắm:\n 1. Thả cà tím, thịt ba chỉ, các loại cá và hải sản vào trước cho ngọt nước.\n 2. Trụng sơ các loại rau đồng (đặc biệt là bông điên điển, bông súng) để giữ được độ giòn ngọt tươi mát.\n 3. Gắp rau, cá, thịt ra bát, rưới ngập phần nước lẩu nóng hổi, ăn kèm với **bún tươi**.\nLẩu mắm rất thích hợp cho những buổi sum họp gia đình, bạn bè vào những ngày mưa hoặc tiết trời mát mẻ."},{"id":42,"cat":"hotpot","image":"https://i.ibb.co/jZHVdz9Z/7303445510b36b20cb1da36c8b979ef5.jpg","name_vi":"Lẩu cá kèo","name":{"en":"Eel Goby Fish Hot Pot","zh":"鲡鱼火锅(酸汤鱼锅)","ja":"ラウカーケオ(鰻ハゼの酸味鍋)","ko":"러우까께오 (뱀장어 신맛전골)"},"rating":3.9,"price":350000,"origin":"Việt Nam","spices":[{"vi":"Nước mắm","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000},{"vi":"Tiêu","price":2000}],"sides":[{"vi":"Rau đắng","price":3000},{"vi":"Rau muống","price":5000},{"vi":"Bông súng","price":5000},{"vi":"Bún tươi","price":5000}],"short":{"en":"A sour-and-savory soup base simmered with slippery goby fish, tamarind, herbs and vegetables.","zh":"酸香汤底炖煮滑溜鲡鱼，配罗望子与新鲜蔬菜。","ja":"タマリンドの酸味を効かせただしで、ぬめりのあるハゼ科の魚を煮込む鍋。","ko":"타마린드의 새콤함을 살린 육수에 미끌미끌한 생선과 채소를 넣어 끓이는 전골."},"desc_vi":"Lẩu cá kèo là gì?\n**Lẩu cá kèo** là một món lẩu đặc sản miền Tây Nam Bộ nổi tiếng khắp các tỉnh thành Việt Nam. Món ăn này gây thương nhớ nhờ sự kết hợp hoàn hảo giữa vị **chua thanh mát của lá giang**, vị **đậm đà nóng hổi của nước dùng** và vị **béo ngậy, ngọt thơm đặc trưng của cá kèo tươi sống**.\n## 1. Thành phần chính\n * **Cá kèo (Ngôi sao của món ăn):** Cá kèo là loại cá da trôi nhỏ cỡ ngón tay, sống ở vùng nước lợ và đầm bãi bồi ven biển miền Tây. Cá làm lẩu phải là **cá kèo tươi sống** (còn bơi khỏe trong chậu). Cá chỉ được rửa sạch lớp nhớt bên ngoài, giữ nguyên con, **không mổ bụng hay bỏ ruột** vì phần gan cá đắng nhẹ, béo ngậy chính là \"tinh túy\" mà người sành ăn yêu thích.\n * **Nước dùng chua thanh:** Nước lẩu được ninh từ xương heo lấy vị ngọt, kết hợp với **lá giang** (một loại lá rừng có vị chua dịu tự nhiên). Sự ăn ý giữa vị chua của lá giang và vị ngọt của cá giúp khử hoàn toàn mùi tanh, tạo nên phần nước dùng cực kỳ bắt miệng.\n * **Rau ăn kèm phong phú:** Đúng chất lẩu miền Tây, lẩu cá kèo ăn kèm tập đoàn rau xanh tươi mát: **rau đắng, bông điên điển, hoa chuối bào, rau muống chẻ, giá đỗ, kèo nèo, lá tía tô...**\n * **Nước chấm:** Thường dùng **mắm me** chua ngọt, kẹp thêm vài lát ớt hiểm tươi để chấm cá.\n## 2. Trải nghiệm thưởng thức độc đáo\nCách ăn lẩu cá kèo có một \"thủ tục\" rất riêng và thú vị:\n 1. **Thả cá sống:** Khi nồi nước lẩu lá giang trên bếp đang **sôi ùng ục**, người ta sẽ mở nắp đĩa (hoặc tô đậy) và gắp những con cá kèo tươi sống thả thẳng vào nồi rồi nhanh tay đậy nắp lại.\n 2. **Chín siêu nhanh:** Chỉ sau khoảng 2–3 phút, thịt cá kèo chín tới, da mềm béo, thịt ngọt lịm và tỏa mùi thơm phức.\n 3. **Thưởng thức:** Gắp cá ra đĩa, nhúng các loại rau đắng, hoa chuối vào nước lẩu rồi gắp ăn cùng bún tươi.\n## 3. Cảm nhận hương vị\nTô lẩu cá kèo là sự bùng nổ của nhiều giác quan: vị chua thanh thanh của lá giang, vị đắng nhẹ kích thích vị giác của rau đắng và gan cá, hòa quyện với vị béo ngọt mọng nước của thịt cá kèo mềm mịn. Đây là món lẩu cực kỳ thích hợp để lai lai cùng bạn bè hoặc thưởng thức vào những ngày thời tiết mát mẻ, chiều mưa."},{"id":43,"cat":"hotpot","image":"https://i.ibb.co/MDDdzfxZ/b43c2246b182eacf81708dad181e7bae.jpg","name_vi":"Lẩu hải sản","name":{"en":"Seafood Hot Pot","zh":"海鲜火锅","ja":"海鮮鍋(ラウハイサン)","ko":"해산물 전골"},"rating":4.5,"price":400000,"origin":"Việt Nam","spices":[{"vi":"Muối ớt","price":3000},{"vi":"Nước mắm","price":2000},{"vi":"Ớt tươi","price":1000},{"vi":"Chanh","price":2000}],"sides":[{"vi":"Rau muống","price":5000},{"vi":"Rau cải","price":5000},{"vi":"Nấm","price":5000},{"vi":"Bún tươi","price":5000}],"short":{"en":"A generous simmering pot of shrimp, squid, fish and clams in a light, savory broth with vegetables.","zh":"虾、鱿鱼、鱼片与蛤蜊丰盛齐聚，清鲜汤底配蔬菜同煮。","ja":"エビ、イカ、魚、貝がたっぷり入った、あっさり出汁の海鮮鍋。","ko":"새우, 오징어, 생선, 조개가 푸짐하게 들어간 담백한 육수의 해산물 전골."},"desc_vi":"Lẩu hải sản là gì?\n**Lẩu hải sản** là một trong những món lẩu phổ biến và được yêu thích nhất trong ẩm thực Việt Nam. Món ăn này là sự kết hợp hoàn hảo giữa **nước dùng chua cay đậm đà** (hoặc ngọt thanh) cùng đa dạng các loại **hải sản tươi sống** và rau củ ăn kèm.\nLẩu hải sản thường là sự lựa chọn hàng đầu cho các bữa tiệc gia đình, tụ họp bạn bè hay các dịp lễ Tết nhờ sự sang trọng, giàu dinh dưỡng và không khí quây quầy ấm cúng.\n## 1. Thành phần chính\nMột nồi lẩu hải sản chuẩn vị và hấp dẫn thường bao gồm:\n * **Đồ nhúng hải sản (Cực kỳ phong phú):**\n   * **Tôm & Mực:** Tôm sú, tôm thẻ, mực ống, mực lá hoặc bạch tuộc.\n   * **Ngao / Nghêu & Sò:** Ngao trắng, ngao hai vòi, sò điệp, tu tôm.\n   * **Cá:** Thịt cá hồi, cá bớp, cá chẽm, cá mú (thường dầm phi lê hoặc lấy khúc).\n   * **Cua / Ghẹ / Bề bề (Tôm tít):** Giúp nước lẩu ngọt đậm đà hơn.\n * **Nước dùng lẩu (Linh hồn món ăn):**\n   * **Vị Thái chua cay (Phổ biến nhất):** Nấu từ xương heo/gà combined với sả, ớt, lá chanh, riềng, cà chua, khóm (dứa) và gói sốt Lẩu Thái/tomyum chua cay xuýt xoa.\n   * **Vị nấm / Ngọt thanh:** Ninh từ xương củ quả, thêm nấm tươi và sâm nhẹ, phù hợp cho người không ăn được cay.\n * **Rau & Nấm ăn kèm:** Rau muống, rau dừa, dứa, cà chua, bắp non, cải cúc, hoa chuối, cùng các loại nấm (nấm kim针, nấm đùi gà, nấm rơm...).\n * **Bún / Mì:** Ăn kèm bún tươi, mì gói (mì tôm) hoặc mì udon.\n## 2. Các phong cách Lẩu hải sản được yêu thích\n| Phong cách lẩu | Đặc điểm hương vị |\n|---|---|\n| **Lẩu hải sản Thái (Chua cay)** | Vị chua thanh của me/tắc, vị cay nồng của ớt, thơm nức mùi sả và lá chanh. Đây là hương vị \"quốc dân\" rất kích thích vị giác. |\n| **Lẩu hải sản thập cẩm truyền thống** | Nước ninh xương ngọt đậm, gia vị vừa vặn, chú trọng giữ trọn độ ngọt tự nhiên nguyên bản của các loại hải sản tươi. |\n| **Lẩu hải sản nấm** | Nước lẩu thanh ngọt tự nhiên từ các loại nấm quý và củ quả, tạo cảm giác nhẹ bớt mỡ màng, rất bổ dưỡng. |\n## 3. Cách thưởng thức đúng chuẩn\n 1. Khi nồi nước lẩu **sôi bùng lên**, thả các loại hải sản lâu chín như cua, ghẹ, đầu cá hoặc ngao vào trước để lấy độ ngọt cho nước.\n 2. Nhúng tôm, mực, cá phi lê vừa chín tới (không nên nhúng quá lâu hải sản sẽ bị dai và mất độ ngọt).\n 3. Thả rau, nấm vào trụng sơ rồi gắp ra ăn cùng bún/mì nóng hổi.\n 4. Chấm hải sản cùng **muối ớt xanh** (muối hải sản), **mắm tỏi ớt** hoặc **muối tiêu chanh** để tôn lên độ ngọt đậm đà của biển cả."},{"id":44,"cat":"hotpot","image":"https://i.ibb.co/xSK6fn0b
